# axis_meanings — ความหมายเมื่อปัจจัยหนึ่งจับคู่กับ "แกน" อ้างอิงหลัก (axis factor)
# ใช้เสริมความหมายของ planetary picture ที่มีแกนนั้นร่วมอยู่ด้วย เช่น picture ที่มี M อยู่
# จะดึงความหมายของ M ร่วมกับปัจจัยอื่นในภาพมาเสริมบริบท ("บนแกน M: ...")
#
# ที่มา: ถอดความจาก "The Language of Uranian Astrology" โดย Roger A. Jacobson (มีลิขสิทธิ์)
# เป็นการถอดความสำหรับใช้งานภายในโปรเจกต์เท่านั้น ไม่ใช่คำแปลตรงตัว — ดูเอกสารอ้างอิงฉบับเต็มที่
# backend/app/knowledge_base/uranian/research/uranian-delineation-axes.md
#
# สถานะ (แก้ไข 2026-08-13): ครบ 5 แกนแล้ว — M, A, MOON, NODE มี 21 คู่ (ครบทุกปัจจัยอื่นที่มี)
# SUN มี 19 คู่ (ต้นฉบับไม่ได้ระบุความหมายของ Sun+Apollon และ Sun+Admetos — ดู research/
# หัวข้อ "สิ่งที่ยังขาด") บางคู่ (เช่น A+M, SUN+M, SUN+A, MOON+M/A/SUN, NODE+M/A/SUN/MOON) ไม่มี
# บรรทัดแยกในต้นฉบับของแกนนั้นๆ (หนังสือเขียนไว้ครั้งเดียวฝั่งแกนใดแกนหนึ่ง) — backfill มาจากคู่
# เดียวกันที่มีอยู่แล้วในอีกแกน เพราะ midpoint สมมาตร ความหมายของคู่จึงใช้ร่วมกันได้ทั้งสองทิศทาง
axes:
  - axis: M
    entries:
      - paired_factor: ARIES
        meaning_th: "ตัวตนของผู้เจ้าของดวงในโลกภายนอก บทบาททางอาชีพ"
      - paired_factor: SUN
        meaning_th: "อัตตาส่วนตัว ร่างกายและจิตวิญญาณ การแสดงออกของ \"ตัวฉัน\""
      - paired_factor: A
        meaning_th: "ปฏิสัมพันธ์ระหว่างตนเองกับสิ่งแวดล้อม"
      - paired_factor: MOON
        meaning_th: "อารมณ์และความรู้สึกที่มีต่อตนเอง"
      - paired_factor: NODE
        meaning_th: "ความผูกพันส่วนตัว เครือข่ายทางอาชีพ วงสังคมส่วนตัว"
      - paired_factor: MERCURY
        meaning_th: "ความคิดส่วนตัว การครุ่นคิด บทสนทนากับตัวเอง"
      - paired_factor: VENUS
        meaning_th: "รสนิยมและความชอบส่วนตัว ความสามารถในการรัก ความสุขส่วนตัว"
      - paired_factor: MARS
        meaning_th: "การผจญภัยส่วนตัว การกระทำที่ขับเคลื่อนจากภายใน"
      - paired_factor: JUPITER
        meaning_th: "โชคดีส่วนตัว ความสุขภายใน"
      - paired_factor: SATURN
        meaning_th: "ภาระและความรับผิดชอบส่วนตัว หน้าที่ในอาชีพ"
      - paired_factor: URANUS
        meaning_th: "ความตึงเครียดภายใน ความประหลาดใจ การเบี่ยงเบนจากขนบส่วนตัว"
      - paired_factor: NEPTUNE
        meaning_th: "จินตนาการและจุดอ่อนส่วนตัว ความไม่มั่นคงในใจ"
      - paired_factor: PLUTO
        meaning_th: "พัฒนาการส่วนตัว การเปลี่ยนแปลงภายใน ความก้าวหน้าในอาชีพ"
      - paired_factor: CUPIDO
        meaning_th: "ความผูกพันกับครอบครัว ความสมดุลและรสนิยมทางศิลปะ"
      - paired_factor: HADES
        meaning_th: "ความทุกข์ใจหรือความเดือดร้อนส่วนตัว ความลับส่วนตัว"
      - paired_factor: ZEUS
        meaning_th: "เป้าหมายส่วนตัวและอาชีพ ความสามารถเชิงสร้างสรรค์"
      - paired_factor: KRONOS
        meaning_th: "ความสามารถส่วนตัว ความเป็นอิสระ การเป็นผู้เชี่ยวชาญ"
      - paired_factor: APOLLON
        meaning_th: "ขอบเขตประสบการณ์ชีวิต ความสำเร็จส่วนตัว โอกาสในอาชีพ"
      - paired_factor: ADMETOS
        meaning_th: "ความมั่นคงภายใน ความดื้อรั้นส่วนตัว"
      - paired_factor: VULKANUS
        meaning_th: "พลังภายใน อำนาจส่วนตัว"
      - paired_factor: POSEIDON
        meaning_th: "ประกายศักดิ์สิทธิ์ภายใน จิตวิญญาณของตนเอง"

  - axis: A
    entries:
      - paired_factor: M
        meaning_th: "ปฏิสัมพันธ์ระหว่างตนเองกับสิ่งแวดล้อม"
      - paired_factor: ARIES
        meaning_th: "ความสัมพันธ์กับโลกภายนอก สภาพแวดล้อมกลางแจ้ง"
      - paired_factor: SUN
        meaning_th: "การมีตัวตนทางกายภาพในสถานที่นั้น การอยู่ต่อหน้าผู้อื่น"
      - paired_factor: MOON
        meaning_th: "ความสัมพันธ์กับผู้หญิง ความสัมพันธ์เชิงอารมณ์ ความสัมพันธ์กับสาธารณชน"
      - paired_factor: NODE
        meaning_th: "การเชื่อมโยงกับสิ่งแวดล้อม วงสังคมในสถานที่นั้น การรักษาความสัมพันธ์ใกล้ชิด เขตแดน"
      - paired_factor: MERCURY
        meaning_th: "การสนทนา การติดต่อสื่อสาร ความคิดของผู้อื่น"
      - paired_factor: VENUS
        meaning_th: "ความสัมพันธ์เชิงรัก มิตรภาพที่น่ารื่นรมย์ ความงามในสิ่งแวดล้อม"
      - paired_factor: MARS
        meaning_th: "กิจกรรมร่วมกับผู้อื่น การโต้เถียง"
      - paired_factor: JUPITER
        meaning_th: "แหล่งทรัพย์สินในสิ่งแวดล้อม ความสุขผ่านผู้อื่น การได้รับความช่วยเหลือ"
      - paired_factor: SATURN
        meaning_th: "ภาระผูกพันต่อผู้อื่น ความห่างเหิน การแยกจาก ความโดดเดี่ยว"
      - paired_factor: URANUS
        meaning_th: "การพบเจอแบบฉับพลัน ผู้คนรอบข้างที่อยู่ในสภาวะตื่นเต้นหรือกระวนกระวาย สิ่งเร้าจากภายนอก"
      - paired_factor: NEPTUNE
        meaning_th: "การถูกหลอกลวง ความลังเลหรือไม่รับผิดชอบของผู้อื่น"
      - paired_factor: PLUTO
        meaning_th: "การย้ายที่อยู่ การเปลี่ยนแปลงของสิ่งแวดล้อม ผู้อื่นเปลี่ยนทัศนคติที่มีต่อเรา"
      - paired_factor: CUPIDO
        meaning_th: "ความสัมพันธ์ในครอบครัว การอยู่ร่วมกับศิลปิน บ้านเกิด ญาติพี่น้อง ที่อยู่อาศัย"
      - paired_factor: HADES
        meaning_th: "ด้านมืดของชีวิตในพื้นที่นั้น ความสัมพันธ์กับผู้ด้อยโอกาสทางสังคม/เศรษฐกิจ"
      - paired_factor: ZEUS
        meaning_th: "เหตุการณ์ที่เกิดใกล้ตัว การสร้างสรรค์ร่วมกับผู้อื่น ผู้อื่นเป็นผู้นำหรือให้ทิศทาง"
      - paired_factor: KRONOS
        meaning_th: "คนทำงาน ลูกจ้าง เจ้าหน้าที่ ความสัมพันธ์กับผู้มีอำนาจ หน่วยงานรัฐในพื้นที่นั้น"
      - paired_factor: APOLLON
        meaning_th: "ความสัมพันธ์กับผู้คนจำนวนมาก โอกาส สถานที่ห่างไกล ต่างแดน"
      - paired_factor: ADMETOS
        meaning_th: "ความมั่นคง รากฐาน ผู้อื่นถอยห่างหรือเป็นรอง ชนบท"
      - paired_factor: VULKANUS
        meaning_th: "อิทธิพลที่แข็งแกร่งของผู้อื่นที่มีต่อชีวิตเรา"
      - paired_factor: POSEIDON
        meaning_th: "ความสัมพันธ์กับผู้มีแนวคิดคล้ายกัน ผู้อื่นนำพาความกระจ่างมาสู่สถานการณ์"

  - axis: SUN
    entries:
      - paired_factor: M
        meaning_th: "อัตตาส่วนตัว ร่างกายและจิตวิญญาณ การแสดงออกของ \"ตัวฉัน\""
      - paired_factor: A
        meaning_th: "การมีตัวตนทางกายภาพในสถานที่นั้น การอยู่ต่อหน้าผู้อื่น"
      - paired_factor: ARIES
        meaning_th: "การดำรงอยู่ทางกายภาพบนโลกโดยทั่วไป"
      - paired_factor: MOON
        meaning_th: "ชายและหญิง การแต่งงาน พ่อแม่ มิตรภาพ"
      - paired_factor: NODE
        meaning_th: "ความเชื่อมโยงทางกาย การจับแขนเดินคู่กัน ความสัมพันธ์กับผู้ชาย"
      - paired_factor: MERCURY
        meaning_th: "จิตสำนึกตื่นตัว ร่างกายที่เคลื่อนไหว"
      - paired_factor: VENUS
        meaning_th: "ความงามทางกาย วันที่น่ารื่นรมย์ เสน่ห์ส่วนตัว ชายรูปงาม"
      - paired_factor: MARS
        meaning_th: "ความเป็นชาย ชายผู้กระตือรือร้น ทหาร สามี"
      - paired_factor: JUPITER
        meaning_th: "เงินทอง ความสุขทางกาย สิ่งของมีค่า"
      - paired_factor: SATURN
        meaning_th: "ข้อจำกัดทางร่างกาย ความประหยัด การแยกทางกาย ชายชรา วินัยประจำวัน"
      - paired_factor: URANUS
        meaning_th: "ความกระสับกระส่ายทางกาย ความตึงเครียด ความตื่นเต้นรายวัน (เกี่ยวโยงกับหัวใจ)"
      - paired_factor: NEPTUNE
        meaning_th: "พลังชีวิตต่ำ ร่างกายอ่อนแอ ไวต่อภูมิแพ้ ความเหนื่อยล้าที่อธิบายไม่ได้ การบิน"
      - paired_factor: PLUTO
        meaning_th: "พัฒนาการทางกาย การดูดซึมอาหาร ศักยภาพในการฟื้นฟู ปีแห่งการเติบโต (วัยเด็ก)"
      - paired_factor: CUPIDO
        meaning_th: "สมาชิกชายในครอบครัว ศิลปิน ชายที่แต่งงานแล้ว"
      - paired_factor: HADES
        meaning_th: "ร่างกายเจ็บป่วย ความพิการทางกาย โชคร้ายที่ตามมา ผู้แบกความลับ"
      - paired_factor: ZEUS
        meaning_th: "การยืนหยัดเพื่อตนเอง เจตจำนงในการสร้างสรรค์ ชายผู้มีเป้าหมาย บิดา ความเป็นผู้นำ"
      - paired_factor: KRONOS
        meaning_th: "ความเพียรพยายาม อสังหาริมทรัพย์ ความมั่นคง"
      - paired_factor: VULKANUS
        meaning_th: "พลังทางกาย พลังของอัตตา ประสบการณ์เข้มข้นในแต่ละวัน"
      - paired_factor: POSEIDON
        meaning_th: "กายทิพย์ ชายผู้มีจิตวิญญาณสูง แสงสว่างทางกาย"
      # หมายเหตุ: ต้นฉบับไม่ได้ระบุความหมายของ Sun+Apollon และ Sun+Admetos ไว้ — ยังขาดอยู่

  - axis: MOON
    entries:
      - paired_factor: M
        meaning_th: "อารมณ์และความรู้สึกที่มีต่อตนเอง"
      - paired_factor: A
        meaning_th: "ความสัมพันธ์กับผู้หญิง ความสัมพันธ์เชิงอารมณ์ ความสัมพันธ์กับสาธารณชน"
      - paired_factor: SUN
        meaning_th: "ชายและหญิง การแต่งงาน พ่อแม่ มิตรภาพ"
      - paired_factor: NODE
        meaning_th: "สายใยทางอารมณ์ ความผูกพันด้านความรู้สึก"
      - paired_factor: ARIES
        meaning_th: "ผู้คนโดยทั่วไป ชีวิตสาธารณะ"
      - paired_factor: MERCURY
        meaning_th: "จิตใต้สำนึก ความคิดผสานกับความรู้สึก"
      - paired_factor: VENUS
        meaning_th: "ความเป็นหญิง หญิงงาม ความรู้สึกรัก การตั้งครรภ์ ความเป็นแม่"
      - paired_factor: MARS
        meaning_th: "กิจกรรมทางความคิด การกระทำที่ขับเคลื่อนด้วยอารมณ์ ชั่วโมงทำงาน ภรรยา"
      - paired_factor: JUPITER
        meaning_th: "ความเชื่อ หญิงร่าเริง อารมณ์ดี"
      - paired_factor: SATURN
        meaning_th: "การยับยั้งชั่งใจ การควบคุมตนเอง หญิงสูงวัย ช่วงเวลาโดดเดี่ยว ความหดหู่"
      - paired_factor: URANUS
        meaning_th: "การตื่นขึ้น ความตกใจ หญิงที่กระวนกระวาย ความตื่นตัว"
      - paired_factor: NEPTUNE
        meaning_th: "การหลับใหล การฝัน หญิงที่หลอกลวงหรือถูกหลอกลวง ความสับสนทางอารมณ์"
      - paired_factor: PLUTO
        meaning_th: "แนวโน้มทางอารมณ์สุดขั้ว การเปลี่ยนแปลงที่มาไวไปไว"
      - paired_factor: CUPIDO
        meaning_th: "ภรรยา เวลาว่าง ชีวิตสังคม"
      - paired_factor: HADES
        meaning_th: "การสละ/ลาออก ความรู้สึกไม่สุขใจ ความทุกข์ทางอารมณ์"
      - paired_factor: ZEUS
        meaning_th: "คุณสมบัติทางอารมณ์อันสูงส่ง ผู้นำหญิง มารดา ข้าราชการ"
      - paired_factor: KRONOS
        meaning_th: "จิตใจเชิงสร้างสรรค์ วินัย แรงจูงใจในการบรรลุเป้าหมาย"
      - paired_factor: APOLLON
        meaning_th: "ประสบการณ์ทางอารมณ์ ฝูงชน อิสรภาพ"
      - paired_factor: ADMETOS
        meaning_th: "ความสงบ การไตร่ตรอง พื้นที่ปิด"
      - paired_factor: VULKANUS
        meaning_th: "ความเข้มข้นทางอารมณ์ สติที่เต็มเปี่ยม อิทธิพลของผู้หญิง"
      - paired_factor: POSEIDON
        meaning_th: "ความเห็นอกเห็นใจ การตอบสนองต่อสิ่งทางจิตวิญญาณ ร่างทรง"
      # หมายเหตุ (ถอดความจากหนังสือ): ดวงจันทร์ควรตีความในหลายระดับพร้อมกัน — (1) ผู้หญิง
      # (2) ผู้คนทั่วไป/มวลชน (3) อารมณ์ (4) กระบวนการทางความคิด (5) ชั่วโมง (6) เดือน —
      # synthesis layer ควรเลือกระดับที่ตรงกับบริบทคำถาม (เช่น ถามเรื่องคน vs ถามเรื่องช่วงเวลา)
      # ไม่ได้ทำเป็น field แยกในนี้เพราะ EngineResult ไม่มีช่องรับบริบทคำถามแบบนั้นในตอนนี้

  - axis: NODE
    entries:
      - paired_factor: M
        meaning_th: "ความผูกพันส่วนตัว เครือข่ายทางอาชีพ วงสังคมส่วนตัว"
      - paired_factor: A
        meaning_th: "การเชื่อมโยงกับสิ่งแวดล้อม วงสังคมในสถานที่นั้น การรักษาความสัมพันธ์ใกล้ชิด เขตแดน"
      - paired_factor: SUN
        meaning_th: "ความเชื่อมโยงทางกาย การจับแขนเดินคู่กัน ความสัมพันธ์กับผู้ชาย"
      - paired_factor: MOON
        meaning_th: "สายใยทางอารมณ์ ความผูกพันด้านความรู้สึก"
      - paired_factor: ARIES
        meaning_th: "การเชื่อมโยงกับโลกภายนอก วัฒนธรรมย่อย ความสัมพันธ์แบบไม่เป็นส่วนตัว"
      - paired_factor: MERCURY
