# 8 ดาวเสริมยูเรเนียน (trans-Neptunian points, Hamburg School) — คำนวณด้วย
# pyswisseph (swe_id 40-47) ผ่านอีเฟเมอริสภายใน (Moshier) ไม่ต้องใช้ไฟล์ข้อมูลเสริม
points:
  - id: cupido
    swe_id: 40
    name_th: "คิวปิโด"
    name_en: "Cupido"
    keywords: ["ความสัมพันธ์", "ครอบครัว", "ศิลปะ", "การรวมกลุ่ม"]
    meaning_core: "พลังงานของความสัมพันธ์ ครอบครัว งานศิลปะ และการอยู่ร่วมกันเป็นกลุ่มสังคม"

  - id: hades
    swe_id: 41
    name_th: "ฮาเดส"
    name_en: "Hades"
    keywords: ["การปรับสภาพ", "สิ่งที่ถูกซ่อน", "ความขาดแคลน", "การเยียวยา"]
    meaning_core: "กระบวนการปรับสภาพ ความเสื่อมสลายที่นำไปสู่การฟื้นฟู และสิ่งที่ถูกซ่อนไว้รอการเยียวยา"

  - id: zeus
    swe_id: 42
    name_th: "ซุส"
    name_en: "Zeus"
    keywords: ["พลังสร้างสรรค์", "การจัดระเบียบ", "ความเป็นผู้นำเชิงรุก"]
    meaning_core: "พลังสร้างสรรค์ที่มีเป้าหมายชัดเจน ความสามารถในการจัดระเบียบและผลักดันสิ่งต่างๆ ให้เกิดขึ้นจริง"

  - id: kronos
    swe_id: 43
    name_th: "โครนอส"
    name_en: "Kronos"
    keywords: ["อำนาจ", "ความเป็นกลาง", "ตำแหน่งสูง", "ความเชี่ยวชาญ"]
    meaning_core: "อำนาจ ความเป็นกลางเชิงภาพรวม และตำแหน่งหรือความเชี่ยวชาญที่อยู่เหนือรายละเอียดปลีกย่อย"

  - id: apollon
    swe_id: 44
    name_th: "อพอลโล"
    name_en: "Apollon"
    keywords: ["การขยายตัว", "ความหลากหลาย", "การค้า", "การสื่อสารกว้างไกล"]
    meaning_core: "การขยายตัวไปในหลายทิศทาง ความหลากหลาย การค้าขาย และการเชื่อมโยงกับผู้คนวงกว้าง"

  - id: admetos
    swe_id: 45
    name_th: "แอดเมโทส"
    name_en: "Admetos"
    keywords: ["ความหยุดนิ่ง", "แรงเฉื่อย", "ความลึก", "ข้อจำกัด"]
    meaning_core: "ความหยุดนิ่งหรือแรงเฉื่อยที่ต้องใช้เวลาและความอดทนอย่างมาก แต่นำไปสู่ความลึกซึ้ง"

  - id: vulkanus
    swe_id: 46
    name_th: "วัลคานัส"
    name_en: "Vulkanus"
    keywords: ["พลังมหาศาล", "แรงกดดัน", "การเปลี่ยนแปลงใหญ่", "ความแข็งแกร่ง"]
    meaning_core: "พลังมหาศาลและแรงกดดันที่สะสมจนนำไปสู่การเปลี่ยนแปลงครั้งใหญ่หรือความแข็งแกร่งเชิงโครงสร้าง"

  - id: poseidon
    swe_id: 47
    name_th: "โพไซดอน"
    name_en: "Poseidon"
    keywords: ["จิตวิญญาณ", "การรู้แจ้ง", "ความคิดกระจ่างชัด", "แสงสว่างทางปัญญา"]
    meaning_core: "จิตวิญญาณ แสงสว่างทางปัญญา และความคิดที่กระจ่างชัดจนนำไปสู่การรู้แจ้งหรือความเข้าใจใหม่"
