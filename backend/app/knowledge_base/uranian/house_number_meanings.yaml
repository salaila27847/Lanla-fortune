# house_number_meanings — ความหมายทั่วไปของเรือนแต่ละหมายเลข (1-12) ไม่ผูกกับดาวดวงใด
# ใช้เสริม house_meanings.yaml (ซึ่งเป็น "ธรรมชาติของเรือนที่ดาวสถิต" ต่อดาว ไม่ระบุเลขเรือน) —
# สองไฟล์นี้รวมกันแล้วได้ทั้ง "ดาวอะไร" และ "เรือนไหน" ครบทั้งสองมิติ
#
# เป็นความหมายทั่วไปตามหลักโหราศาสตร์สากลที่ใช้กันทั่วไป (ไม่ได้ถอดความจากตำรายูเรเนียนเล่มใด
# โดยเฉพาะ เหมือนกับ signs.yaml/factors.yaml) — อ้างอิงระบบเรือนเมริเดียนของโปรเจกต์นี้เอง:
# เรือนที่ 10 = M พอดี, เรือนที่ 1 เริ่มที่ East Point (Equatorial Ascendant)
house_number_meanings:
  - house: 1
    meaning_th: "ตัวตน รูปลักษณ์ภายนอก ความประทับใจแรกที่มีต่อผู้อื่น จุดเริ่มต้นของสิ่งต่างๆ"
  - house: 2
    meaning_th: "ทรัพย์สิน รายได้ ความมั่นคงทางวัตถุ คุณค่าและความสามารถของตนเอง"
  - house: 3
    meaning_th: "การสื่อสาร การเรียนรู้ระยะสั้น พี่น้อง เพื่อนบ้าน การเดินทางใกล้"
  - house: 4
    meaning_th: "บ้าน ครอบครัว รากฐานชีวิต พื้นฐานทางอารมณ์และความมั่นคงภายใน"
  - house: 5
    meaning_th: "ความคิดสร้างสรรค์ ความรัก การแสดงออกซึ่งตัวตน งานอดิเรก ลูกหลาน"
  - house: 6
    meaning_th: "งานประจำวัน สุขภาพ การรับใช้ผู้อื่น ระเบียบวินัยและกิจวัตร"
  - house: 7
    meaning_th: "หุ้นส่วน การแต่งงาน ความสัมพันธ์แบบเปิดเผยกับผู้อื่นหนึ่งต่อหนึ่ง"
  - house: 8
    meaning_th: "การเปลี่ยนแปลงครั้งใหญ่ ทรัพยากรร่วมกับผู้อื่น วิกฤต การเกิดใหม่หลังการสูญเสีย"
  - house: 9
    meaning_th: "ปรัชญา ความเชื่อ การเดินทางไกล การศึกษาระดับสูง มุมมองที่กว้างไกลขึ้น"
  - house: 10
    meaning_th: "อาชีพ สถานะทางสังคม เป้าหมายและบทบาทสาธารณะในชีวิต (ตรงกับ M พอดีในระบบเรือนนี้)"
  - house: 11
    meaning_th: "มิตรภาพ กลุ่มสังคม เครือข่าย ความหวังและเป้าหมายระยะยาว"
  - house: 12
    meaning_th: "จิตใต้สำนึก สิ่งที่ซ่อนเร้นหรือยังไม่ปรากฏชัด การเยียวยา การสละตนเพื่อสิ่งที่ใหญ่กว่า"
