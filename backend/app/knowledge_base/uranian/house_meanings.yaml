# ความหมายทั่วไปของ "เรือนที่ดาวแต่ละดวงสถิต" (ไม่ผูกกับแกนใดแกนหนึ่ง) — ถอดความจาก
# research/uranian-delineation-axes.md หัวข้อ 7 ครอบคลุมดาวเคราะห์คลาสสิก 10 ดวง + ดาวเสริม 8 ดวง
# (ไม่รวม Node/จุดอาริส/M/A — ต้นฉบับไม่ได้ระบุความหมายเรือนสำหรับจุดเหล่านี้ และ M/A เองเป็นตัว
# กำหนดเรือนที่ 10/1 พอดี จึงไม่ "ตกอยู่ในเรือน" ในความหมายเดียวกับดาวเคราะห์)
#
# ระบบเรือนที่ใช้คือ Meridian house system (เรียกอีกชื่อว่า Axial rotation system) ตามที่ยูเรเนียน
# แอสโตรโลจีใช้จริง — pyswisseph รองรับตรงๆ ผ่าน hsys=b"X" (ยืนยันด้วย swe.house_name(b"X")
# == "axial rotation system/Meridian houses"): เรือนที่ 10 ตรงกับ M พอดี, เรือนที่ 1 เริ่มที่ East
# Point (Equatorial Ascendant) ไม่ใช่ลัคนาสุริยวิถีตามระบบ Placidus ทั่วไป — ดู engine.py::_house_cusps()
house_meanings:
  - factor: SUN
    meaning_th: "เรื่องที่ดำเนินไปด้วยพลังชีวิต ความกระตือรือร้น ความมั่นใจในตนเอง"
  - factor: MOON
    meaning_th: "เรื่องที่ผันผวนตามอารมณ์ เกี่ยวข้องกับมนุษย์ มีจังหวะการเปลี่ยนแปลง"
  - factor: MERCURY
    meaning_th: "เรื่องที่เป็นประเด็นทางความคิดและบทสนทนา ต้องการความกระจ่างและความเฉียบไว"
  - factor: VENUS
    meaning_th: "เรื่องที่มักนำมาซึ่งความเพลิดเพลินหรือความงาม เรื่องความรักอาจเกี่ยวโยงกับเรือนนี้"
  - factor: MARS
    meaning_th: "เรื่องที่กระตุ้นให้เกิดการกระทำ อาจนำมาซึ่งความหงุดหงิดหรือข้อโต้แย้ง"
  - factor: JUPITER
    meaning_th: "เรื่องที่มีแนวโน้มเจริญรุ่งเรือง แหล่งรายได้และความสุขอาจมาจากเรือนนี้"
  - factor: SATURN
    meaning_th: "เรื่องที่ต้องการโครงสร้าง วินัย กำหนดการ และความอดทนรอคอย"
  - factor: URANUS
    meaning_th: "เรื่องที่พลิกผันฉับพลัน ต้องการความหยั่งรู้และความคิดสร้างสรรค์ อาจเกี่ยวโยงกับเทคโนโลยี"
  - factor: NEPTUNE
    meaning_th: "เรื่องที่เสื่อมสลายง่ายหากปล่อยละเลย เต็มไปด้วยภาพลวงตา แต่ก็เป็นแหล่งของแรงบันดาลใจทางจิตวิญญาณได้เช่นกัน"
  - factor: PLUTO
    meaning_th: "เรื่องที่อยู่ในสภาวะเปลี่ยนผ่าน จุดศูนย์กลางของวิกฤตหรือการเปลี่ยนแปลงใหญ่ในชีวิต"
  - factor: CUPIDO
    meaning_th: "เรื่องที่เกี่ยวกับชีวิตครอบครัว งานศิลปะ การแต่งงาน และชุมชน/สังคม"
  - factor: HADES
    meaning_th: "เรื่องที่อาจผิดพลาดได้หากไม่แก้ไข อาจเกี่ยวโยงกับอดีตอันไกลโพ้นหรือหน้าที่ที่ถูกเรียกร้อง"
  - factor: ZEUS
    meaning_th: "เรื่องที่เจ้าของดวงทุ่มเทพลังและความมุ่งมั่นเพื่อบรรลุเป้าหมาย แสดงออกถึงความเป็นผู้นำ"
  - factor: KRONOS
    meaning_th: "เรื่องที่เน้นความเป็นเลิศ อาจเกี่ยวโยงกับภาครัฐหรืออิทธิพลของผู้บังคับบัญชา"
  - factor: APOLLON
    meaning_th: "เรื่องที่มักส่งผลดีต่อความสำเร็จ เปิดมุมมองและขอบฟ้าที่กว้างขึ้น โอกาสมาเยือน"
  - factor: ADMETOS
    meaning_th: "เรื่องที่เปลี่ยนแปลงช้ามาก เป็นรากฐานที่มั่นคง แต่บางครั้งอาจรู้สึกติดขัดหรือจนมุม"
  - factor: VULKANUS
    meaning_th: "เรื่องที่ดำเนินไปอย่างเข้มข้น ต้องแสดงพลังของตนเองหรือรับแรงกดดันจากผู้อื่น"
  - factor: POSEIDON
    meaning_th: "เรื่องที่นำไปสู่ความเข้าใจภายใน การแสวงหาความจริงและความกระจ่าง"
