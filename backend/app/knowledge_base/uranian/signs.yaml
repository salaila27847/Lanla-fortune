# 12 ราศี เรียงตามลองจิจูดสุริยวิถี 0-330 (ขั้นละ 30°) ใช้เป็นตัวปรับสีสัน
# การแสดงออกของดาวเสริมแต่ละดวงในผลลัพธ์ engine
signs:
  - id: aries
    name_th: "ราศีเมษ"
    start_degree: 0
    modifier: "แสดงออกทันที กล้าตัดสินใจ ชอบบุกเบิกสิ่งใหม่"

  - id: taurus
    name_th: "ราศีพฤษภ"
    start_degree: 30
    modifier: "มั่นคง ค่อยเป็นค่อยไป ให้คุณค่ากับความมั่นคงและสัมผัสที่จับต้องได้"

  - id: gemini
    name_th: "ราศีเมถุน"
    start_degree: 60
    modifier: "สื่อสารคล่องแคล่ว ปรับตัวไว สนใจหลายเรื่องพร้อมกัน"

  - id: cancer
    name_th: "ราศีกรกฎ"
    start_degree: 90
    modifier: "อ่อนไหว ผูกพันทางอารมณ์ลึกซึ้ง ปกป้องคนใกล้ตัว"

  - id: leo
    name_th: "ราศีสิงห์"
    start_degree: 120
    modifier: "แสดงออกอย่างมั่นใจ ต้องการเป็นที่ยอมรับ สร้างสรรค์และมีเสน่ห์"

  - id: virgo
    name_th: "ราศีกันย์"
    start_degree: 150
    modifier: "พิถีพิถัน วิเคราะห์ละเอียด มุ่งปรับปรุงให้สมบูรณ์แบบ"

  - id: libra
    name_th: "ราศีตุลย์"
    start_degree: 180
    modifier: "มองหาความสมดุล ให้ความสำคัญกับความสัมพันธ์และความยุติธรรม"

  - id: scorpio
    name_th: "ราศีพิจิก"
    start_degree: 210
    modifier: "เข้มข้น ลึกซึ้ง มุ่งเปลี่ยนแปลงถึงแก่นแท้"

  - id: sagittarius
    name_th: "ราศีธนู"
    start_degree: 240
    modifier: "มองไกล ใฝ่รู้ ต้องการอิสระในการขยายขอบเขต"

  - id: capricorn
    name_th: "ราศีมังกร"
    start_degree: 270
    modifier: "มีวินัย มุ่งเป้าหมายระยะยาว รับผิดชอบสูง"

  - id: aquarius
    name_th: "ราศีกุมภ์"
    start_degree: 300
    modifier: "คิดนอกกรอบ ให้คุณค่ากับอิสรภาพและความเป็นตัวของตัวเอง"

  - id: pisces
    name_th: "ราศีมีน"
    start_degree: 330
    modifier: "ละเอียดอ่อนทางจิตใจ จินตนาการสูง เห็นอกเห็นใจผู้อื่น"
