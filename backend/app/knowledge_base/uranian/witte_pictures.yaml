    entries:
      - third_factor: M
        meaning_th: "แสดงออกอย่างระเบิดอารมณ์ รวมพลังทั้งหมดไว้ที่จุดเดียว การแสดงพลังอันยิ่งใหญ่ฉับพลัน ธรรมชาตินักสู้ เผชิญพลังแห่งธรรมชาติฉับพลัน"
      - third_factor: ARIES
        meaning_th: "พลังของเครื่องยนต์ เกี่ยวข้องกับการกระทำรุนแรงโดยทั่วไป พายุไฟฟ้า"
      - third_factor: SUN
        meaning_th: "ร่างกายเผชิญการกระทำรุนแรงฉับพลัน อันตรายร้ายแรงต่อร่างกาย ชายผู้จัดการพลังงานมหาศาล วันแห่งภยันตรายครั้งใหญ่"
      - third_factor: A
        meaning_th: "เผชิญการกระทำรุนแรงของผู้อื่นฉับพลัน หรือร่วมกับผู้อื่น อาศัยอยู่ในสภาพแวดล้อมอันตราย อันตรายจากกระแสไฟฟ้า จากอุปกรณ์เทคนิค"
      - third_factor: MOON
        meaning_th: "พลังและอำนาจของประชาชนที่น่าประหลาดใจ สาธารณชนถูกยั่วยุอย่างมาก ชั่วโมงแห่งการตัดสินใจ ชั่วโมงที่เต็มไปด้วยเหตุการณ์"
      - third_factor: NODE
        meaning_th: "พัวพันกับพลังงานมหาศาลฉับพลัน ถูกสืบสวน ตรวจสอบ ทบทวน หรือตรวจซ้ำ สะเพร่าและไม่ไตร่ตรอง ถูกพัดพาไป ถูกลากจูงไป"
      - third_factor: MERCURY
        meaning_th: "ข่าวที่ก่อความตื่นเต้นฉับพลัน ลงมือทำอย่างรวดเร็วและตัดสินใจฉับไว การกระทำที่เร่งรีบอย่างมาก ต้องการความรวดเร็วอย่างยิ่ง"
      - third_factor: VENUS
        meaning_th: "ประหลาดใจที่ได้รับความรักความผูกพันอันยิ่งใหญ่ ความกลมกลืนและเป็นหนึ่งเดียวปรากฏขึ้นฉับพลัน"
      - third_factor: MARS
        meaning_th: "เผชิญอันตรายใหญ่หลวง การบาดเจ็บ หรือการกระทำรุนแรง ความสำเร็จแห่งห้วงเวลาปัจจุบัน"
      - third_factor: JUPITER
        meaning_th: "เปี่ยมด้วยความปีติและความสุข (ภาวะแห่งความสุขล้นเหลือ)"
      - third_factor: SATURN
        meaning_th: "รู้สึกถูกขัดขวางอย่างหนักฉับพลัน ลิ้มรสความขมขื่นแห่งการพึ่งพาผู้อื่นฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "ความไร้อำนาจฉับพลันที่น่าประหลาดใจ ความผิดหวัง ถูกบังคับให้ออกจากกิจกรรม"
      - third_factor: PLUTO
        meaning_th: "พลังงานในการกระทำฉับพลัน (พลังจลน์) พลังถูกขับเคลื่อน พัฒนาการและการเปลี่ยนแปลงอันยิ่งใหญ่เกิดขึ้นฉับพลันอย่างน่าประหลาดใจ"
      - third_factor: CUPIDO
        meaning_th: "ความปั่นป่วนรุนแรงในชุมชน สังคม ครอบครัว หรือชีวิตแต่งงาน"
      - third_factor: HADES
        meaning_th: "เผชิญและตกอยู่ภายใต้ความต่ำช้าและการกระทำชั่วร้ายครั้งใหญ่"
      - third_factor: ZEUS
        meaning_th: "พลังงานมหาศาลมุ่งสู่จุดเดียว บรรลุจุดประสงค์ พลังงานสะสมอันมหึมา"
      - third_factor: KRONOS
        meaning_th: "อำนาจและความเป็นอิสระอันยิ่งใหญ่ที่เกิดขึ้นฉับพลันอย่างน่าประหลาดใจ"
      - third_factor: APOLLON
        meaning_th: "คนจำนวนมากรอคอยด้วยความคาดหวัง โหยหาการเปลี่ยนแปลง รอคอยการเปลี่ยนแปลงในสภาพที่เป็นอยู่"
      - third_factor: ADMETOS
        meaning_th: "ความพินาศครั้งใหญ่ โชคร้ายร้ายแรงฉับพลัน ความพ่ายแพ้และการกดขี่ครั้งใหญ่ การต่อสู้ที่ไร้ประโยชน์"
      - third_factor: POSEIDON
        meaning_th: "ใช้พลังทางจิตและอิทธิพลฉับพลัน ได้รับความเข้าใจลึกซึ้งฉับพลันและบรรลุผลลัพธ์ที่ชัดเจน"

  - factors: [URANUS, POSEIDON]
    keyword_en: "Truth. Light. Phosphorus. Clearing up. Enlightenment. Propaganda. Motion pictures. Television. Signs of life. To be lively or alive. Mental tension. Mentally alert. The torch-bearer."
    entries:
      - third_factor: M
        meaning_th: "ความพร้อมและความตึงเครียดทางจิตใจ มุ่งแสวงหาความสว่าง ความรู้ และความจริง มีจิตใจแจ่มใสและตื่นตัว"
      - third_factor: ARIES
        meaning_th: "ภาพยนตร์ การรู้แจ้ง ดำเนินการโฆษณาชวนเชื่อ ความคาดหวังกระตือรือร้นของสาธารณชนที่ถูกขับเคลื่อนด้วยความคิด ความตื่นตัวทางจิตใจโดยทั่วไป"
      - third_factor: SUN
        meaning_th: "ตื่นเต้นหรือถูกกระตุ้นด้วยความคิดเห็น ความคิด หรือความนึกคิด ชายผู้ปรากฏตัวในฐานะผู้ถือความคิด ผู้เป็นตัวแทนของความคิดหรือความเชื่อมั่น ผู้ปลุกระดมโฆษณาชวนเชื่อ วันแห่งความตึงเครียดทางจิตใจ"
      - third_factor: A
        meaning_th: "ปลูกฝังความคิดในผู้อื่น กระตุ้นจิตใจผู้อื่นหรือถูกกระตุ้น เผยแพร่การรู้แจ้งและโฆษณาชวนเชื่อร่วมกับผู้อื่น ฉายภาพยนตร์ให้ชุมชนชม"
      - third_factor: MOON
        meaning_th: "บุคคลที่มีจิตใจตื่นตัว การโฆษณาชวนเชื่อต่อสาธารณะ การโฆษณาชวนเชื่อเพื่อการเลือกตั้งทางการเมือง บุคคลที่ถูกครอบงำด้วยความคิด ชั่วโมงแห่งความตึงเครียดและความตื่นตัวทางจิตใจ"
      - third_factor: NODE
        meaning_th: "เกี่ยวข้องกับตัวแทนของความคิด มีความสัมพันธ์กับนักโฆษณาชวนเชื่อ"
      - third_factor: MERCURY
        meaning_th: "ส่งหรือรับสัญญาณแห่งชีวิต ตึงเครียดจากความคิดใหม่ๆ การหยั่งรู้เชิงวิสัยทัศน์"
      - third_factor: VENUS
        meaning_th: "ความกลมกลืนและความสัมพันธ์อันสอดคล้องที่เกิดจากศรัทธา ศาสนา และมุมมองต่อชีวิตที่ร่วมกัน"
      - third_factor: MARS
        meaning_th: "ผลักดันความขยันหมั่นเพียรและความใส่ใจอย่างแข็งขัน เรียกร้องความมีจิตสำนึกรับผิดชอบ"
      - third_factor: JUPITER
        meaning_th: "โชคดีจากความรอบคอบและความขยัน มีจิตสำนึกรับผิดชอบ ความสุขและความสำเร็จ"
      - third_factor: SATURN
        meaning_th: "แสงหรือชีวิตดับสูญ ความตายเกิดขึ้น ยอมแพ้"
      - third_factor: NEPTUNE
        meaning_th: "ไม่ยอมรับความจริง หลอกตัวเอง บิดเบือนความจริง ถูกหลอกลวง สร้างภาพลวงตา หลอกลวงผู้อื่น"
      - third_factor: PLUTO
        meaning_th: "ปลุกความสนใจ กระตุ้นจิตใจ สร้างแสงสว่าง หนุนหลังความจริงและความกระจ่างชัด"
      - third_factor: CUPIDO
        meaning_th: "อธิบาย ไขความกระจ่าง รู้แจ้งร่วมกับผู้อื่น (อังคาร ยูเรนัส และโพไซดอนบนแกนเดียวกันให้ความกระจ่าง)"
      - third_factor: HADES
        meaning_th: "นำแสงสว่างและความกระจ่างเข้าสู่เรื่องชั่วร้าย มืดมน หรือคลุมเครือ ทำให้เรื่องราวในอดีตกลับมามีชีวิตอีกครั้ง"
      - third_factor: ZEUS
        meaning_th: "บังคับหรือยืนกรานให้มีการชี้แจงหรือแถลงการณ์ที่ชัดเจน"
      - third_factor: KRONOS
        meaning_th: "ชำระบัญชีกับเจ้านาย รัฐ หรือผู้มีอำนาจ ตรวจสอบ ตกอยู่ในความตึงเครียดอย่างมาก"
      - third_factor: APOLLON
        meaning_th: "นำคนหมู่มากมาอยู่ภายใต้อิทธิพลทางจิตใจของตน ให้ความรู้แจ้ง สร้างแรงบันดาลใจ กระตุ้นจิตใจพวกเขา พบผู้อื่นที่มีลักษณะคล้ายกันและมีความคิดคล้ายกัน"
      - third_factor: ADMETOS
        meaning_th: "ค้นหาความจริงถึงแก่นและยุติการค้นหานั้น ความตึงเครียดทางจิตใจลดลง ผ่อนคลายทางจิตใจ เป็นที่รู้จักในวงแคบ"
      - third_factor: VULKANUS
        meaning_th: "เป็นแรงกระตุ้นทางจิตใจครั้งใหญ่ สร้างความตึงเครียดทางจิตใจ ดึงดูดความสนใจอย่างมหาศาล การหยั่งรู้อันทรงพลังและวิสัยทัศน์อันแจ่มชัด"
  - factors: [NEPTUNE, PLUTO]
    keyword_en: "Changes which are not externally noticeable. Transformations. Changes only recognized in the future. Secrecy."
    entries:
      - third_factor: M
        meaning_th: "พัฒนาอนาคตจากอดีต อยู่ในพัฒนาการหรือการเปลี่ยนแปลงที่ยังมองไม่เห็นผลลัพธ์ในอนาคต ไม่อาจประเมินผลกระทบของบางสิ่งได้ ซ่อนตัว อยู่เบื้องหลัง"
      - third_factor: ARIES
        meaning_th: "การเปลี่ยนแปลงทั่วไปที่ไม่อาจประเมินได้อย่างแม่นยำ"
      - third_factor: SUN
        meaning_th: "การเปลี่ยนแปลงในร่างกายที่ไม่อาจสังเกตเห็นจากการเปลี่ยนวิถีชีวิต อาหารที่แตกต่าง วิธีบำรุงร่างกายที่แตกต่าง โฮมีโอพาธี"
      - third_factor: A
        meaning_th: "การเปลี่ยนสถานที่ที่ก่อความไม่แน่นอน รับรู้ว่ามีการเปลี่ยนแปลงแต่ไม่รู้ทิศทาง"
      - third_factor: MOON
        meaning_th: "บุคคลที่ค่อยๆ เปลี่ยนทัศนคติต่อเจ้าของดวงอย่างไม่รู้ตัว อาจหมายถึงสาธารณชนหรือผู้หญิงโดยเฉพาะ บุคคลลึกลับ"
      - third_factor: NODE
        meaning_th: "สายสัมพันธ์ที่ค่อยๆ มาและจากไปโดยแทบไม่มีใครสังเกต"
      - third_factor: MERCURY
        meaning_th: "จุดเริ่มต้นของการเปลี่ยนแปลงอย่างช้าๆ ในการรับรู้และความคิด การรับรู้ที่ได้จากสัญชาตญาณ ข่าวสาร หรือความรู้ที่เข้าใจความหมายแท้จริงเพียงบางส่วน ความสามารถในการซ่อนความคิดที่แท้จริงและเก็บความลับ"
      - third_factor: VENUS
        meaning_th: "จุดเริ่มต้นที่แทบไม่มีใครสังเกตของการเปลี่ยนแปลงอันน่ายินดี"
      - third_factor: MARS
        meaning_th: "ทำงานโดยไม่วางแผน ไม่ใช้สมอง"
      - third_factor: JUPITER
        meaning_th: "จุดเริ่มต้นของการเปลี่ยนแปลงอันโชคดีที่ไม่ถูกสังเกตในทันที ปกปิดบางสิ่งได้สำเร็จ"
      - third_factor: SATURN
        meaning_th: "พัฒนาการที่ในที่สุดนำไปสู่การทำลายล้าง"
      - third_factor: URANUS
        meaning_th: "พัฒนาการที่คืบคลานอย่างช้าๆ ถูกขัดจังหวะฉับพลัน หรือถูกผลักดันไปข้างหน้าด้วยแรงกระชาก พัฒนาการเชิงปฏิวัติที่เป็นรูปเป็นร่างขึ้นฉับพลัน"
      - third_factor: CUPIDO
        meaning_th: "การเปลี่ยนแปลงอย่างช้าๆ ในครอบครัวหรือบ้าน เช่น การรับปากหรือหมั้นหมายอย่างลับๆ การจากไปของสมาชิกครอบครัวจากความเจ็บป่วยที่ค่อยเป็นค่อยไป หรือเรื่องราวลับของครอบครัวที่ปิดบังจากสาธารณะ"
      - third_factor: HADES
        meaning_th: "ความเจ็บป่วยลักษณะโรคระบาด การทรยศต่ำช้าลับหลัง"
      - third_factor: ZEUS
        meaning_th: "อาวุธลับ อาวุธซ่อนเร้น การสะสมอาวุธอย่างลับๆ เก็บกิจกรรมของตนเป็นความลับ ฝึกฝนอย่างลับๆ คำสั่งลับ"
      - third_factor: KRONOS
        meaning_th: "ความสามารถพัฒนาขึ้นโดยไม่มีใครสังเกต การเปลี่ยนแปลงอย่างช้าๆ ในความสัมพันธ์กับเจ้านาย ผู้บังคับบัญชา หรือผู้มีอำนาจ"
      - third_factor: APOLLON
        meaning_th: "การเปลี่ยนแปลงที่คืบคลานส่งผลต่อคนหมู่มาก การเปลี่ยนแปลงและการแปรสภาพทางวิทยาศาสตร์ที่ไม่มีใครสังเกต จุดเริ่มต้นที่ไม่มีใครสังเกตของจุดจบของวิทยาศาสตร์แขนงหนึ่ง หรือของวิทยาศาสตร์แห่งอนาคต"
      - third_factor: ADMETOS
        meaning_th: "การเปลี่ยนแปลงจากรากฐานขึ้นมา ผ่านการล่มสลาย"
      - third_factor: VULKANUS
        meaning_th: "ในกีฬา คือการทำสปีดโค้งสุดท้าย โฮมรัน พัฒนาการลับที่ผลักดันด้วยกำลังไปสู่การตัดสินใจและกลายเป็นที่เปิดเผย ในการบำบัด คือวิกฤตหรือการเจาะระบายแผล"
      - third_factor: POSEIDON
        meaning_th: "การผ่อนคลายและความบันเทิงทางจิตใจ"

  - factors: [NEPTUNE, CUPIDO]
    keyword_en: "Unfortunate for parents. Shortage in housing. Inharmony in the family, disharmony in associations."
    entries:
      - third_factor: M
        meaning_th: "ความโศกเศร้าจากการแต่งงาน เป็นส่วนหนึ่งของการล่มสลายของสหภาพ ยกเลิกข้อตกลงหรือสัญญา"
      - third_factor: ARIES
        meaning_th: "ความไม่พอใจโดยทั่วไปต่อสถาบันการแต่งงาน หรือสมาคมส่วนรวม การล่มสลายของชุมชนขนาดใหญ่ การล่มสลายของครอบครัว ย้ายออกไป"
      - third_factor: SUN
        meaning_th: "สามีที่โชคร้าย (ไม่มีความสุข)"
      - third_factor: A
        meaning_th: "เข้าสู่การแต่งงานที่ไม่มั่นคง เป็นโสด การแต่งงานที่ไม่ยั่งยืน"
      - third_factor: MOON
        meaning_th: "ภรรยาที่โชคร้าย (ไม่มีความสุข) ประชาชนที่ไม่มีความสุข"
      - third_factor: NODE
        meaning_th: "สร้างสายสัมพันธ์ที่ลงเอยอย่างไม่น่าพอใจ ตัดสายสัมพันธ์"
      - third_factor: MERCURY
        meaning_th: "การนอกใจในชีวิตแต่งงาน การหลอกลวงเรื่องแต่งงาน คิดปรารถนาการแยกทางจากการแต่งงาน ความคิดโศกเศร้าจากการล่มสลายของครอบครัว การขาดแคลนที่อยู่อาศัย"
      - third_factor: VENUS
        meaning_th: "การหลอกลวงในความรัก การผิดสัญญาแต่งงาน ความไม่กลมกลืนในชีวิตแต่งงานด้วยความรัก เท่ากับพฤหัสบดี/พลูโต คือได้ที่อยู่อาศัยที่ดีขึ้น"
      - third_factor: MARS
        meaning_th: "การหย่อนสมรรถภาพหรือการติดเชื้อของสามี การทะเลาะเรื่องที่อยู่อาศัย"
      - third_factor: JUPITER
        meaning_th: "ความฟุ่มเฟือย (การใช้จ่ายสุรุ่ยสุร่าย) ในชีวิตแต่งงานที่ไม่มีความสุข การขาดแคลนที่อยู่อาศัย"
      - third_factor: SATURN
        meaning_th: "การพรากจากกันของการแต่งงานที่ไม่เหมาะสม การล่มสลายของสมาคมหรือองค์กร ความเจ็บป่วยบดบังการแต่งงานหรือองค์กร อุปสรรค"
      - third_factor: URANUS
        meaning_th: "การแตกหักฉับพลันในชีวิตแต่งงาน ความล่มสลายหรือโศกเศร้าฉับพลันในชีวิตแต่งงานจากความตายหรืออุบัติเหตุ การล่มสลายเชิงปฏิวัติฉับพลัน เหตุการณ์ฉับพลันในองค์กรลับ"
      - third_factor: PLUTO
        meaning_th: "การขาดแคลนที่อยู่อาศัยเพิ่มขึ้นหรือลดลง ขึ้นอยู่กับตำแหน่งของพลูโต การเปลี่ยนแปลงผ่านคำสั่งหรือสมาคมลับ จุดเริ่มต้นของการล่มสลายของสมาคม"
      - third_factor: HADES
        meaning_th: "สภาพน่ารังเกียจในชีวิตแต่งงานที่ยากไร้ ความยากลำบากหรือปัญหาจากชุมชนหรือการขาดแคลนที่อยู่อาศัย เท่ากับอังคาร คือที่พักทหารในสงครามหรือการฝึกซ้อม ที่อยู่ชั่วคราวยามฉุกเฉิน"
      - third_factor: ZEUS
        meaning_th: "ลูกจำนวนมากในชีวิตแต่งงานที่ยากไร้ ขาดที่พักพิงจากไฟไหม้ แกะดำในครอบครัว ค่ายทหาร โรงทหาร คลังอาวุธ"
      - third_factor: KRONOS
        meaning_th: "การแต่งงานถูกพรากโดยผู้มีอำนาจ สมาคมถูกยุบโดยรัฐ ความบาดหมางหรือความแตกแยกในหมู่ผู้นำที่นำไปสู่การล่มสลาย"
      - third_factor: APOLLON
        meaning_th: "การล่มสลายของบรรษัทหรือสมาคมที่ขยายตัว การขาดแคลนที่อยู่อาศัยครั้งใหญ่ ครอบครัวจำนวนมากแตกแยก การขยายตัวของสมาคมลับ"
      - third_factor: ADMETOS
        meaning_th: "ความเดียวดายจากชีวิตแต่งงานที่ไม่มีความสุข ถูกทอดทิ้ง พรากจากพันธมิตรและมิตรสหาย ความสูญเสียในหุ้นส่วน ถูกหลอกลวงและฉ้อโกง"
      - third_factor: VULKANUS
        meaning_th: "ครอบครัวหรือสมาคมถูกพรากจากกันด้วยกำลัง"
      - third_factor: POSEIDON
        meaning_th: "การล่มสลายของชมรมเพื่อการพักผ่อนหรือความบันเทิง ความล้มเหลวของสมาคมที่มีอุดมการณ์ทางการเมืองหรือวัฒนธรรม ล้มเหลวในการก่อตั้งสถาบันเช่นนั้น"

  - factors: [NEPTUNE, HADES]
    keyword_en: "Water catastrophes. Dropsy. Lack of air. Damages through error, lack of lucidity, deception, decay or water."
    entries:
      - third_factor: M
        meaning_th: "จมน้ำตาย จมน้ำ ชาวเรือ หายใจไม่ออก ตกอยู่ภายใต้การหลอกลวงร้ายแรง เสี่ยงภัยครั้งใหญ่ด้วยตนเอง"
      - third_factor: ARIES
        meaning_th: "น้ำท่วม คลื่นยักษ์ เจ้าของดวงหลอกตัวเองเรื่องความสัมพันธ์กับสิ่งแวดล้อมและโลกโดยรวม สิ่งแวดล้อมเองก็อาจไม่แน่ใจว่ารู้สึกอย่างไรต่อเจ้าของดวง"
      - third_factor: SUN
        meaning_th: "อันตรายในน้ำ ตายจากการจมน้ำ การเดินทางทางทะเล ความอ่อนแอ อันตรายจากการติดเชื้อ อันตรายจากการทำลายร่างกาย"
      - third_factor: A
        meaning_th: "ความเจ็บป่วยหรือความตายจากน้ำหรือโรคบวมน้ำ ถูกหลอกลวงเรื่องความสัมพันธ์กับคนใกล้ชิด ผู้อื่นรู้สึกถูกหลอกหรือผิดหวังต่อเจ้าของดวง — พวกเขาคาดหวังสิ่งที่แตกต่างออกไป"
      - third_factor: MOON
        meaning_th: "ฝนตกหนักฉับพลัน ความเสียหายจากน้ำ ความตายในแหล่งน้ำเล็กๆ การหลอกลวง เรื่องไม่น่าพอใจ หรือความหยาบคายผ่านผู้หญิงหรือในที่สาธารณะ"
      - third_factor: NODE
        meaning_th: "ประสบภัยพิบัติทางน้ำ ฝนตกหนักฉับพลัน ผิดหวังในความสัมพันธ์กับผู้อื่น เกี่ยวข้องกับของเหลว"
      - third_factor: MERCURY
        meaning_th: "ความบ้าคลั่งรุนแรง โรคทางสมอง คิดถึงการเดินทางทางทะเล ความคิดสับสน ไม่อาจจดจ่อ สูญเสียการมองภาพรวม สับสนวุ่นวาย"
      - third_factor: VENUS
        meaning_th: "การหลอกลวงและความต่ำช้าในความรัก โหยหาน้ำ ถูกดึงดูดใจโดยสภาพแวดล้อมที่มีน้ำมาก"
      - third_factor: MARS
        meaning_th: "การทำลายล้างและความตายจากน้ำ ความพยายามที่สูญเปล่า งานที่ไร้ประโยชน์ สงครามทางเรือ เรือรบ เท่ากับซุส คือน้ำเดือด ไอน้ำ"
      - third_factor: JUPITER
        meaning_th: "กิจการหลอกลวง ความสูญเปล่า วัณโรคปอด โชคดีในภัยพิบัติทางน้ำ การอาบน้ำ ตกหรือกระโดดลงน้ำแล้วยังโชคดี โชคดีเกี่ยวกับน้ำหรือของเหลว"
      - third_factor: SATURN
        meaning_th: "ความสูญเสียจากน้ำท่วมหรือน้ำ ความเจ็บป่วยร้ายแรง จมหรือตกลงไปในน้ำ เผชิญอุปสรรคจากการหลอกลวง ความผิดพลาด หรือสถานการณ์เลวร้ายอื่น ของเหลวมีกลิ่นเหม็น เช่น น้ำเสีย"
      - third_factor: URANUS
        meaning_th: "ความตายและความพินาศจากภัยพิบัติทางน้ำ การฆาตกรรมที่เกี่ยวข้องกับกิจกรรมปฏิวัติ"
      - third_factor: PLUTO
        meaning_th: "ความผิดพลาดที่ถูกพบเมื่อสายเกินไป จุดเริ่มต้นของการเน่าเปื่อยหรือผุพัง"
      - third_factor: CUPIDO
        meaning_th: "สภาพที่อยู่อาศัยย่ำแย่ การแต่งงานที่ยากไร้และไม่มีความสุข การทะเลาะหรือสัญญาณการล่มสลายในชุมชน"
      - third_factor: ZEUS
        meaning_th: "ภัยพิบัติทางน้ำในกองทัพเรือ ถูกไอน้ำลวก จมน้ำตาย พลังงานหรือความพยายามที่สูญเปล่า การกระทำในอดีตที่กลายเป็นอุปสรรคใหญ่ต่ออนาคต"
      - third_factor: KRONOS
        meaning_th: "ความตายและความพินาศในแวดวงผู้ปกครอง ในรัฐ หรือในกองทัพเรือ ประสบความชั่วร้ายผ่านหรือร่วมกับผู้มีอำนาจ"
      - third_factor: APOLLON
        meaning_th: "คนจำนวนมากอยู่ใต้ฤทธิ์แอลกอฮอล์ ปริมาณของเหลว วิทยาศาสตร์เคมี ควันและไอพิษ ความหวังในอนาคตที่ไม่มีวันเป็นจริง ระบบน้ำ ซากเรืออับปาง แม่น้ำ ลำธาร มหาสมุทร"
      - third_factor: ADMETOS
        meaning_th: "ความตายจากความหนาวเย็นและความอดอยาก โรคภัยจากความเย็นและความชื้น น้ำในพื้นดิน หิมะ น้ำแข็ง"
      - third_factor: VULKANUS
        meaning_th: "อันตรายคืบคลานเข้ามาโดยไม่รู้ตัว ระหว่างการดำเนินกิจการ"
      - third_factor: POSEIDON
        meaning_th: "ความผิดพลาดจากการหลอกลวงหรือภาพลวงตาทางจิตใจ เท่ากับอังคาร/เสาร์ คือถูกจมน้ำตาย"

  - factors: [NEPTUNE, ZEUS]
    keyword_en: "Inflammable gases. Liquid fuel. Concealed weapons. Creative imagination. Wasted energies."
    # missing: SATURN (OCR damage — entry not recoverable between the Jupiter and Uranus entries)
    entries:
      - third_factor: M
        meaning_th: "บุคคลผู้โอ้อวด อารมณ์ร้อน"
      - third_factor: ARIES
        meaning_th: "สงครามแก๊ส แก๊สระเบิด การทำลายทรัพย์สินส่วนรวมจากสงคราม การทำลายเหมืองเชื้อเพลิง การทำสงครามที่ไม่สำเร็จ ความพ่ายแพ้ในสงคราม"
      - third_factor: SUN
        meaning_th: "แผลพุพองจากความร้อน แก๊สพิษในเหมือง งานที่ไร้ผล ชายผู้พยายามอย่างสูญเปล่า วันแห่งงานที่ไร้ผล"
      - third_factor: A
        meaning_th: "ถูกลวกโดยผู้อื่น ถูกบังคับให้คลุกคลีกับคนขี้โอ้อวด กิจกรรมร่วมกับผู้อื่นที่ไม่สำเร็จ เท่ากับอังคาร คือบาดเจ็บหรือถูกฆ่าด้วยอาวุธปืน"
      - third_factor: MOON
        meaning_th: "ความตื่นเต้นพลุ่งพล่าน (บ้าคลั่งแบบแข่งขัน) บุคคลขี้โอ้อวด ชั่วโมงที่สูญเปล่า จินตนาการสร้างสรรค์"
      - third_factor: NODE
        meaning_th: "การรวมตัวอย่างฉับพลันซึ่งตามมาด้วยการแยกจากกัน"
      - third_factor: MERCURY
        meaning_th: "การดำเนินแผนอย่างฉับพลัน คิดถึงอาวุธลับหรืออาวุธซ่อนเร้น"
      - third_factor: VENUS
        meaning_th: "ความหลงใหลฉับพลันที่ผ่านไปเร็วโดยไม่มีผลตามมา การทำหมันของผู้หญิง จุดเริ่มต้นของเชื้อสาย หรือจุดจบของทายาท"
      - third_factor: MARS
        meaning_th: "พลังงานหรือกำลังสูญเปล่าไปกับการจุดแก๊สหรือของเหลว เท่ากับเสาร์/ยูเรนัส คือถูกฆ่าด้วยแก๊สไฟไหม้หรือพลังเครื่องยนต์ พลังที่ไร้การควบคุม อนาธิปไตย เท่ากับฮาเดส คือถูกวางยาสลบด้วยคลอโรฟอร์ม พลังขับเคลื่อนถูกทำลายด้วยน้ำ"
      - third_factor: JUPITER
        meaning_th: "ความเสียหายจากบ่อน้ำมันที่ถูกเผา การค้นพบแก๊สโดยไม่คาดคิด การกลั่น โชคดีเกี่ยวกับแอลกอฮอล์ กับสุรา"
      - third_factor: URANUS
        meaning_th: "แก๊สและเครื่องยนต์น้ำมัน การระเบิดของแก๊สติดไฟ กิจกรรมปฏิวัติ ต้องการบังคับให้เกิดการปฏิวัติ เท่ากับฮาเดส คือบาดเจ็บจากแก๊สไฟไหม้"
      - third_factor: PLUTO
        meaning_th: "ทำงานอย่างเงียบๆ ตามลำพัง ปฏิบัติหน้าที่อย่างเงียบๆ ผลงานที่เพิ่มขึ้นซึ่งไม่ปรากฏให้เห็นบนผิวหน้า พัฒนาอาวุธซ่อนเร้น"
      - third_factor: CUPIDO
        meaning_th: "คำสัญญาแต่งงานที่ไม่เป็นจริง ศิลปะแนวเอ็กซ์เพรสชันนิสม์ การปฏิเสธข้อเสนอแต่งงาน ความยากลำบากในการตกลงทำงานร่วมกัน"
      - third_factor: HADES
        meaning_th: "ความเสียหายจากแก๊สพิษในเหมือง ความสูญเสียจากไฟไหม้ที่เกิดจากส่วนผสมแก๊ส เท่ากับอังคาร คือการขัดขวางหรือทำลายกำลังแรงงาน เท่ากับเสาร์/อาทิตย์ คือความสูญเสียจากความเสียหายจากไฟ (ในอากาศ) แก๊สให้แสงสว่าง ความเสียหายต่อเครื่องจักรไอน้ำ"
      - third_factor: KRONOS
        meaning_th: "การโจมตีด้วยแก๊สตามคำสั่ง กิจการน้ำมันหรือบ่อน้ำมันของรัฐ ความพยายามทางการเมืองครั้งใหญ่ที่ไม่สำเร็จ"
      - third_factor: APOLLON
        meaning_th: "ปริมาณแก๊ส ปริมาณเชื้อเพลิงเหลว ผลงานสร้างสรรค์ในวิทยาศาสตร์แขนงใหม่"
      - third_factor: ADMETOS
        meaning_th: "ทำงานไม่สำเร็จในขอบเขตเล็กหรือพื้นที่แคบ ถูกบังคับให้ทำงานภายใต้สถานการณ์ที่ยากลำบากอย่างยิ่งและแรงกดดันหนักหน่วง"
      - third_factor: VULKANUS
        meaning_th: "ความพยายามอันมหาศาลแต่ไร้ประโยชน์และสูญเปล่า"
      - third_factor: POSEIDON
        meaning_th: "ความพยายามที่ไร้ผลและอันตราย การคลายจากแรงบีบคั้นทางจิตใจ"

  - factors: [NEPTUNE, KRONOS]
    keyword_en: "Incompetent management. Diplomacy. Vapor. Air. Great deception. Unlimited uncertainty. The formula for great diplomats."
    entries:
      - third_factor: M
