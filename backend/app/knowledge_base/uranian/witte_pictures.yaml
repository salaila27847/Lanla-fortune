      - third_factor: MOON
        meaning_th: "โชคดีที่ไม่คาดคิดของผู้หญิง"
      - third_factor: NODE
        meaning_th: "การรวมกันอันโชคดีฉับพลัน"
      - third_factor: MERCURY
        meaning_th: "โต้ตอบไว การเยาะเย้ยและไหวพริบผสมกัน ความร่าเริง"
      - third_factor: VENUS
        meaning_th: "ความสุขในความรักฉับพลัน การหมั้น เท่ากับคิวปิโด คือเครื่องประดับ อัญมณี"
      - third_factor: MARS
