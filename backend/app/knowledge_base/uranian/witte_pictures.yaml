        meaning_th: "อยู่ร่วมกับคนหมู่มากในองค์กรที่ถืออาวุธ การประชุมวันครอบครัว สมาชิกครอบครัวเพิ่มขึ้น การสร้างสรรค์ทางศิลปะหรือวิทยาศาสตร์"
      - third_factor: KRONOS
        meaning_th: "ได้รับความโปรดปรานจากเจ้านาย หัวหน้า รัฐ หรือหัวหน้าครอบครัว เนื่องจากผลงานทางศิลปะหรือวิทยาศาสตร์ ผู้มีอำนาจในสาขาเหล่านั้น"
      - third_factor: ADMETOS
        meaning_th: "ถูกสังเกตในวงแคบเพราะผลงานยิ่งใหญ่ ความเป็นไปได้ในสาขาเหล่านั้นถูกขัดขวาง"
      - third_factor: VULKANUS
        meaning_th: "ความสำเร็จสูงสุดผ่านผลงานศิลปะหรือวิทยาศาสตร์ ความสำเร็จทางวัตถุครั้งใหญ่ของบริษัท งานเฉลิมฉลองครอบครัวครั้งใหญ่ การประชุมครอบครัว"
      - third_factor: POSEIDON
        meaning_th: "การรวมผลงานทางศิลปะหรือวิทยาศาสตร์ ร่วมกับผู้อื่นที่มีมุมมองหรือศรัทธาเดียวกัน"

  - factors: [CUPIDO, ADMETOS]
    keyword_en: "Solitude. Hermitage. Monkhood. Monastery. Lonely places. To be avoided or avoid others. Dissolution of an association."
    entries:
      - third_factor: M
        meaning_th: "มีส่วนในการล่มสลายของหุ้นส่วน กลายเป็นผู้โดดเดี่ยว อยู่อย่างเดียวดาย"
      - third_factor: ARIES
        meaning_th: "เข้าไปอยู่ในสภาพแวดล้อมแปลกหน้า ไร้สายสัมพันธ์ รู้สึกหลงทาง"
      - third_factor: SUN
        meaning_th: "ชายที่ประสบการล่มสลายของครอบครัวตน เป็นส่วนหนึ่งของมัน ประสบการณ์ที่เกิดขึ้นทันที"
      - third_factor: A
        meaning_th: "สมาชิกของสมาคมแยกจากกัน ต่างแยกตัวอยู่โดดเดี่ยว"
      - third_factor: MOON
        meaning_th: "ผู้หญิงที่สามีไม่อยู่ ผู้หญิงที่เดียวดายและถูกทอดทิ้ง ชั่วโมงพักผ่อนที่เดียวดาย ความสัมพันธ์ผ่านไปกับผู้หญิง"
      - third_factor: NODE
        meaning_th: "เป็นพยานในการแตกแยกหรือล่มสลาย มีส่วนร่วมกับผู้คนที่เดียวดายและถูกหลีกเลี่ยง"
      - third_factor: MERCURY
        meaning_th: "คำกล่าวอำลา การพูดคุย คิดถึงการล่มสลายของครอบครัวหรือหุ้นส่วน อยู่ตามลำพังกับความคิดของตน ความคิดเชิงศิลปะในความเดียวดาย"
      - third_factor: VENUS
        meaning_th: "ปฏิเสธความพยายามของผู้อื่นที่จะสร้างหุ้นส่วน หรือในทางกลับกัน ผู้อื่นเย็นชาและปฏิเสธ ความรักที่ไม่ยั่งยืน"
      - third_factor: MARS
        meaning_th: "แยกทางกันทันทีหลังจากแต่งงานเสร็จสิ้น การแต่งงานภายใต้สถานการณ์กดดันสูง แยกตัวเกี่ยวกับงานของตน ทำงานตามลำพัง ความพยายามที่ไม่สำเร็จในการรักษาหุ้นส่วนไว้ หรือสร้างความสัมพันธ์ร่วมมือ"
      - third_factor: JUPITER
        meaning_th: "มิตรภาพหรือความเป็นเพื่อนอันน่ายินดีที่ผ่านมาชั่วครู่"
      - third_factor: SATURN
        meaning_th: "เผชิญอุปสรรคร้ายแรงในครอบครัวตน ถูกปฏิเสธโดยครอบครัวตน ตกอยู่ในสถานการณ์คับขันจากครอบครัวหรือหุ้นส่วน แยกจากครอบครัวอย่างเด็ดขาด"
      - third_factor: URANUS
        meaning_th: "การล่มสลายหรือแตกหักฉับพลันในหุ้นส่วนอย่างน่าประหลาดใจ หรือความปั่นป่วนร้ายแรงในชีวิตแต่งงาน ทุกคนหันมาต่อต้านเจ้าของดวงฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "พันธมิตรหรือหุ้นส่วนที่ไม่น่าเชื่อถือ สภาพที่เปลี่ยนแปลงไป มาตรฐานศีลธรรมและประเพณีใหม่ แฟชั่นใหม่ ต่อต้านมารยาทเก่า สถานะทางสังคมที่ไม่แน่นอน"
      - third_factor: PLUTO
        meaning_th: "การเปลี่ยนแปลงหรือการแปรสภาพอย่างลึกซึ้งในครอบครัวหรือหุ้นส่วน หรือการรวมตัวกันชั่วคราวในครอบครัวหรือหุ้นส่วน"
      - third_factor: HADES
        meaning_th: "การยุบค่ายเชลย จุดจบหรือจุดเริ่มต้นของการแต่งงานหรือหุ้นส่วนที่น่าสังเวช ความเป็นเพื่อนและหุ้นส่วนในยามร้ายแรงและเลวร้าย อยู่และยึดติดกันในสภาพที่น่าสังเวช"
      - third_factor: ZEUS
        meaning_th: "จุดเริ่มต้นของผลงานศิลปะยิ่งใหญ่ จัดการและทำงานกับปัญหา อุปสรรคและความล่าช้าในการก่อตั้งกิจการใหม่"
      - third_factor: KRONOS
        meaning_th: "สมาคมถูกยุบโดยรัฐหรือผู้มีอำนาจ รัฐก่อความยุ่งยากและอุปสรรคระหว่างการยุบบรรษัท การล่มสลายหรือแตกหักของสนธิสัญญา รัฐธรรมนูญ หรือรูปแบบการปกครอง"
      - third_factor: APOLLON
        meaning_th: "สมาคมวิทยาศาสตร์ขนาดเล็ก ความพึงพอใจจากสมาคมเล็กเช่นนั้น ความร่วมมือในวงแคบ"
      - third_factor: VULKANUS
        meaning_th: "ประสบอุปสรรคและความขัดขวางครั้งใหญ่จากครอบครัวหรือคู่หุ้นส่วน รู้สึกถูกกดขี่จากสภาพเช่นนั้น ต่อสู้หรือดิ้นรนอย่างหนักเพื่อผลงานศิลปะ มักถูกบังคับให้ต้องต่อสู้"
      - third_factor: POSEIDON
        meaning_th: "ถอยห่างจากสายสัมพันธ์ทางสังคมหรืออื่นๆ เพราะมุมมองและความชอบที่แตกต่าง เพราะความแตกต่างทางจิตใจและอารมณ์ เพราะรู้สึกหลงทางและเดียวดายท่ามกลางพวกเขา"

  - factors: [CUPIDO, VULKANUS]
    keyword_en: "Great organization. Mighty artistic abilities and talent. Power and influence in or through a party. The powerful community or also political party."
    entries:
      - third_factor: M
        meaning_th: "ผลงานศิลปะอันยิ่งใหญ่ เป็นศิลปินที่โดดเด่น พรสวรรค์ในการจัดองค์กรอันยิ่งใหญ่"
      - third_factor: ARIES
        meaning_th: "ผลงานศิลปะอันยิ่งใหญ่โดยทั่วไป เป็นที่รู้จักโดยทั่วไปผ่านผลงานศิลปะ"
      - third_factor: SUN
        meaning_th: "ชายที่มีอิทธิพลใหญ่หลวงผ่านงานศิลปะของตน วันแห่งการสร้างสรรค์งานศิลปะอันยิ่งใหญ่ เป็นสมาชิกของพรรคที่มีอำนาจ"
      - third_factor: A
        meaning_th: "การสร้างสรรค์งานศิลปะครั้งใหญ่ร่วมกับผู้อื่น มิตรภาพหรือการคบหากับศิลปินยิ่งใหญ่ ความนับถือหรือความเคารพอย่างสูงต่อผลงานของผู้อื่น"
      - third_factor: MOON
        meaning_th: "งานเฉลิมฉลองครอบครัวครั้งใหญ่ เช่น การหมั้น การแต่งงาน เป็นหุ้นส่วนของบุคคลผู้มีอิทธิพล สมาคมสาธารณะที่มีอิทธิพล"
      - third_factor: NODE
        meaning_th: "เกี่ยวข้องกับสังคมอันยิ่งใหญ่ ครอบครัว หรือศิลปะอันยิ่งใหญ่"
      - third_factor: MERCURY
        meaning_th: "แผนศิลปะอันยิ่งใหญ่ โครงการทางความคิดด้านศิลปะอันยิ่งใหญ่ ภาพร่างหรือแผนของผลงานศิลปะครั้งใหญ่"
      - third_factor: VENUS
        meaning_th: "ความสัมพันธ์ที่คงอยู่ด้วยความกลมกลืนและความจงรักภักดีอันยิ่งใหญ่ วัตถุศิลปะที่งดงามอย่างยิ่ง"
      - third_factor: MARS
        meaning_th: "งานเฉลิมฉลองครอบครัวสองเท่า งานแต่งงานคู่ พิสูจน์ความสามารถทางศิลปะอันยิ่งใหญ่ของตนด้วยข้อเท็จจริง ทำงานกับผลงานศิลปะครั้งใหญ่"
      - third_factor: JUPITER
        meaning_th: "โชคหรือวาสนาอันยิ่งใหญ่ของครอบครัว ความสำเร็จทางศิลปะครั้งใหญ่ ความสุขจากการเสพศิลปะ"
      - third_factor: SATURN
        meaning_th: "โครงการศิลปะที่สุกงอมอย่างช้าๆ ผ่านอุปสรรคใหญ่หลวง กิจกรรมศิลปะถูกขัดจังหวะ อุปสรรคจากสังคมอันยิ่งใหญ่"
      - third_factor: URANUS
        meaning_th: "วัตถุศิลปะหรือองค์กรที่สร้างขึ้นด้วยความพยายามเหนือมนุษย์ในเวลาอันสั้น"
      - third_factor: NEPTUNE
        meaning_th: "จุดเริ่มต้นของการล่มสลายของสมาคมหรือครอบครัว แสร้งว่าเป็นส่วนหนึ่งของสมาคมอันยิ่งใหญ่"
      - third_factor: PLUTO
        meaning_th: "ผลงานศิลปะครั้งใหญ่กำลังก่อร่างขึ้น การแปรสภาพครั้งใหญ่ในมโนทัศน์ศิลปะ การเปลี่ยนแปลงครอบครัวครั้งใหญ่ ทำงานสร้างสังคมอันยิ่งใหญ่ เท่ากับมิเดียม คือการพัฒนาและสร้างตัวเอง"
      - third_factor: HADES
        meaning_th: "ความขาดแคลนครั้งใหญ่ในผลงานศิลปะ การกระทำชั่วร้ายของสมาคมอันยิ่งใหญ่ โชคร้ายหรือโศกนาฏกรรมครั้งใหญ่ในครอบครัว"
      - third_factor: ZEUS
        meaning_th: "การรวมตัวของครอบครัวใหญ่ผ่านการแต่งงานหรือการหมั้น ผลงานศิลปะยิ่งใหญ่ องค์กรใหญ่รวมพลังทั้งหมดไว้ที่จุดเดียว เพื่อบรรลุสิ่งต่างๆ ในแบบของตนเอง"
      - third_factor: KRONOS
        meaning_th: "ผลงานศิลปะระดับอัจฉริยะ สมาคมที่ได้รับการรับรองจากรัฐ สถานะทางสังคมกับชนชั้นสูง ขุนนาง"
      - third_factor: APOLLON
        meaning_th: "การขยายตัวของสมาคมอันยิ่งใหญ่ ผลงานศิลปะจำนวนมาก ผลงานศิลปะที่ขยายตัวอย่างกว้างขวาง"
      - third_factor: ADMETOS
        meaning_th: "อยู่ตามลำพัง (คนเดียว) กับผลงานศิลปะอันยิ่งใหญ่ ภายใต้แรงกดดัน ต่อสู้กับอุปสรรคใหญ่หลวง ค้นหาความจริงถึงแก่น ถึงต้นตอของสิ่งต่างๆ"
      - third_factor: POSEIDON
        meaning_th: "ใช้อิทธิพลทางจิตใจอันยิ่งใหญ่ต่อมโนทัศน์โลก ผลงานอันยิ่งใหญ่ในสาขาวิทยาศาสตร์ทางจิตใจและจิตวิญญาณ"

  - factors: [CUPIDO, POSEIDON]
    keyword_en: "Religious, philosophical, or spiritual community. The congregation of faith."
    entries:
      - third_factor: M
        meaning_th: "แสวงหาชุมชนทางจิตใจหรือจิตวิญญาณ ถูกดึงดูดใจโดยชุมชนเช่นนั้น"
      - third_factor: ARIES
        meaning_th: "ชุมชนศาสนาทั่วไป นิกาย โบสถ์ คณะสงฆ์"
      - third_factor: SUN
        meaning_th: "เป็นสมาชิกของชุมชนศาสนา ชายผู้มีศรัทธา"
      - third_factor: A
        meaning_th: "อยู่ท่ามกลางผู้คนที่เป็นตัวแทนของศรัทธา ศาสนา"
      - third_factor: MOON
        meaning_th: "ผู้หญิงที่เป็นตัวแทนของศาสนา ครุ่นคิดทางจิตใจในชั่วโมงพักผ่อน"
      - third_factor: NODE
        meaning_th: "เกี่ยวข้องกับเรื่องศรัทธา เกี่ยวข้องกับนิกาย โบสถ์ ฯลฯ"
      - third_factor: MERCURY
        meaning_th: "คิดถึงสมาคมศาสนา เผยแพร่โฆษณาชวนเชื่อให้นิกายศาสนา กลมกลืนกับพวกเขา"
      - third_factor: VENUS
        meaning_th: "คณะชุมนุมทางศาสนา กลมกลืนกับพวกเขา"
      - third_factor: MARS
        meaning_th: "ต่อสู้เพื่อหรือต่อต้านศรัทธา"
      - third_factor: JUPITER
        meaning_th: "มีความสุขในศรัทธาของตนเอง โชคและความสำเร็จร่วมกับหรือผ่านสมาคมเช่นนั้น"
      - third_factor: SATURN
        meaning_th: "ประสบอุปสรรคจากนิกายศาสนา หรือแยกตัวจากนิกายหนึ่ง"
      - third_factor: URANUS
        meaning_th: "ความตื่นเต้นและการโต้เถียงในเรื่องศรัทธา"
      - third_factor: NEPTUNE
        meaning_th: "อาการล่มสลายและเสื่อมโทรมในนิกายศาสนา ความผิดพลาดร้ายแรงปรากฏให้เห็น"
      - third_factor: PLUTO
        meaning_th: "การพัฒนา การแปรสภาพ และการสร้างนิกายศาสนา"
      - third_factor: HADES
        meaning_th: "ความเสื่อมถอยของนิกาย การแพร่กระจายของความเชื่อผิดๆ หรือความเชื่องมงาย นิกายที่หากินกับความโง่เขลาและความไม่รู้ของสมาชิก"
      - third_factor: ZEUS
        meaning_th: "มีส่วนร่วมในการนำและการสร้างสมาคมศาสนา เป็นผู้ร่วมก่อตั้ง"
      - third_factor: KRONOS
        meaning_th: "รับตำแหน่งผู้นำและบริหารองค์กรศาสนา ลัทธิของรัฐ นิกายศาสนาที่รัฐให้เงินอุดหนุนและบริหารจัดการ"
      - third_factor: APOLLON
        meaning_th: "การแพร่กระจายของลัทธิศาสนา การรวมตัวของผู้คนที่มีศรัทธาเดียวกัน"
      - third_factor: ADMETOS
        meaning_th: "ออกจากศรัทธาทางศาสนา อยู่นอกศรัทธานั้น ไม่มีแนวโน้มจะเข้าร่วม ความเสียเปรียบและการกดขี่จากสิ่งนั้น"
      - third_factor: VULKANUS
        meaning_th: "อำนาจในหรือผ่านสมาคมศาสนา อำนาจแห่งอิทธิพลผ่านศรัทธา"
  - factors: [HADES, ZEUS]
    keyword_en: "Damage through fire. Coal fire. Industry. Burning heat."
    entries:
      - third_factor: M
        meaning_th: "ผู้วางเพลิง สูญเสียธุรกิจจากไฟไหม้ ถูกเกลียดชัง หรือเกลียดชังผู้อื่น ความเกี่ยวข้องส่วนตัวกับอุตสาหกรรม"
      - third_factor: ARIES
        meaning_th: "อุตสาหกรรม ไฟไหม้ทำลายล้างสำหรับคนหมู่มาก การปะทุความเกลียดชังโดยทั่วไป เท่ากับโครนอส คือความเกลียดชังแบบสงครามครั้งใหญ่หรือไฟไหม้ทำลายล้างครั้งใหญ่ รวมถึงอุตสาหกรรมหนัก"
      - third_factor: SUN
        meaning_th: "บาดเจ็บทางร่างกายจากไฟลวก ชายที่ถูกเกลียดชัง ความเสียหายจากควัน ความเสียหายจากเตาอบหรือเตาไฟ ไฟไหม้ปล่องไฟ สิ่งสกปรกจากการก่อสร้างหรือปรับปรุงอาคาร"
      - third_factor: A
        meaning_th: "ถูกไฟไหม้ทำลายล้างมาเยือน พฤติกรรมน่ารังเกียจและเกลียดชังของผู้อื่น"
      - third_factor: MOON
        meaning_th: "ผู้หญิงที่บาดเจ็บจากไฟลวก ฝนฟ้าคะนอง โรคทางสมอง คนงานอุตสาหกรรม บุคคลที่มีมารยาทน่าเกลียดและน่ารังเกียจ"
      - third_factor: NODE
        meaning_th: "มีส่วนร่วมในไฟไหม้ครั้งใหญ่ เป็นพยานไฟไหม้ทำลายล้างครั้งใหญ่ เกี่ยวข้องกับความต่ำช้าและความเกลียดชัง"
      - third_factor: MERCURY
        meaning_th: "การวางเพลิง ติดไฟ วิธีคิดที่เกลียดชัง คำพูดเยาะเย้ยและเกลียดชัง ประณามใครบางคน"
      - third_factor: VENUS
        meaning_th: "ผู้หญิงบาดเจ็บจากไฟ ผู้หญิงที่โหดร้าย ถูกบังคับให้ทำงานรับใช้ต่ำต้อย"
      - third_factor: MARS
        meaning_th: "ไฟไหม้คร่าชีวิตผู้คน ไฟลุกโชนทำลายล้าง ตายจากการฆาตกรรมที่วางแผนไว้ล่วงหน้า ปฏิบัติการรบ การฝึกยิงเป้า ความเจ็บป่วยเฉียบพลันที่อันตรายมาก การกระทำที่เกิดจากความเกลียดชัง"
      - third_factor: JUPITER
        meaning_th: "กิจการฉ้อโกง เริ่มต้นดีแต่จบไม่สวย เท่ากับมิเดียม คือตัวแทนประกันอัคคีภัย ในเรือนที่ 10 คือโชคดีในอาชีพที่เกี่ยวกับไฟหรือพลังความร้อน"
      - third_factor: SATURN
        meaning_th: "ความสูญเสียจากไฟไหม้ การวางเพลิง เท่ากับพุธ คือตายจากไฟไหม้ เท่ากับอาริส คือความสูญเสียจากไฟไหม้ทั่วไป เช่น ไฟป่า ไฟทุ่งหญ้า ความเกลียดชังทำลายล้างอย่างช้าๆ จุดเริ่มต้นของช่วงเวลาแห่งการทำลายล้างที่ยาวนาน"
      - third_factor: URANUS
        meaning_th: "ถูกไฟคร่าชีวิตอย่างไม่ทันตั้งตัว เพลิงไหม้ครั้งใหญ่ ความเกลียดชังคลั่งไคล้ปะทุขึ้นฉับพลัน เท่ากับมิเดียม คือความเสียหายจากระเบิดหรือไฟไหม้ฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "แก๊สพิษในเหมือง ถูกไอน้ำลวก หายใจไม่ออกจากควัน ความโกรธและความเกลียดชังที่ทำอะไรไม่ได้ คำสาปแช่งเกลียดชัง"
      - third_factor: PLUTO
        meaning_th: "หลีกเลี่ยงหรือหนีหน้าที่ ไฟที่ลุกลามขึ้น การพิสูจน์ความไม่ชอบ ทำให้ความเกลียดชังหรือความเกลียดชังที่กำลังก่อตัวเป็นกลาง"
      - third_factor: CUPIDO
        meaning_th: "ไฟไหม้ทำลายล้างที่เกี่ยวข้องกับบรรษัทขนาดใหญ่ หรือกับคนหมู่มาก อันตรายต่อคนหมู่มาก ทนทุกข์จากศัตรูของสังคมทั้งหมด รวมถึงโจมตีและเกลียดชังกลุ่มคนทั้งกลุ่ม"
      - third_factor: KRONOS
        meaning_th: "ไฟไหม้ทำลายล้างครั้งใหญ่ เท่ากับเสาร์ คือความสูญเสียที่ตามมา ความเกลียดชังต่อสภาพที่เป็นอยู่ในรัฐบาล ปฏิเสธรัฐบาลแต่รับใช้เพราะถูกบังคับเท่านั้น สภาพการรับใช้ที่น่าสังเวชจากการบริหารผิดพลาดของรัฐบาล เท่ากับเสาร์ คือความสูญเสียจากสภาพและเรื่องราวข้างต้น"
      - third_factor: APOLLON
        meaning_th: "ความเกลียดชังร่วมกันของคนหมู่มาก การแพร่กระจายของวิธีคิดที่เกลียดชังและน่าเกลียด การขยายตัวของอุตสาหกรรม ผลผลิตถ่านหินเพิ่มขึ้น"
      - third_factor: ADMETOS
        meaning_th: "เหมืองถ่านหิน ความเกลียดชังที่ฝังลึก ความเกลียดชังที่ไม่อาจคืนดี ความเกลียดชังในหมู่คนไม่กี่คน"
      - third_factor: VULKANUS
        meaning_th: "การปะทุความเกลียดชังอย่างรุนแรง เท่ากับเนปจูน คือความเกลียดชังที่ทำอะไรไม่ได้ การฆาตกรรมที่เกิดจากความเกลียดชัง"
      - third_factor: POSEIDON
        meaning_th: "ถูกเกลียดชังเพราะความเชื่อมั่น เกลียดชังความเชื่อมั่นของผู้อื่น เกลียดชังวิธีมองโลกแบบต่างชาติ ถูกบังคับให้มองโลกในแบบต่ำช้า"

  - factors: [HADES, KRONOS]
    keyword_en: "Great baseness and meanness. Great brutality and poverty. Poor government. Crime. Police. The basic formula for a criminal on a big scale."
    entries:
      - third_factor: M
        meaning_th: "สูญเสียธุรกิจหรืออาชีพจากการบริหารผิดพลาด ประสบความต่ำช้าครั้งใหญ่ ทนทุกข์จากมันหรือยินยอมให้เกิดขึ้น"
      - third_factor: ARIES
        meaning_th: "ความโหดร้ายทารุณ อัตราการตายสูง การเสียสละชีวิตมนุษย์ อาชญากรรมร้ายแรงของหรือต่อรัฐบาล แผนการที่ล้มเหลว"
      - third_factor: SUN
        meaning_th: "โชคชะตาเลวร้ายมาก ตายจากเหตุการณ์ร้ายแรง ชายที่ตกอยู่ภายใต้ความโหดร้ายครั้งใหญ่ ต้องป้องกันตัวเองจากมัน รัฐบาลไม่รักษาสัญญา วันแห่งโชคร้าย ชายผู้โชคร้าย"
      - third_factor: A
        meaning_th: "เกี่ยวข้องกับความโชคร้ายร้ายแรง ความเสียหายครั้งใหญ่ต่อเจ้าของดวงจากความต่ำช้าของผู้อื่น"
      - third_factor: MOON
        meaning_th: "โชคร้ายครั้งใหญ่สำหรับผู้หญิงหรือประชาชน เท่ากับคิวปิโด คือในสถานประกอบการขนาดใหญ่"
      - third_factor: NODE
        meaning_th: "มีส่วนในเรื่องราวที่น่าสงสัย ทำหน้าที่เป็นสายลับ ถูกว่าจ้าง เกี่ยวข้องกับตำรวจปราบปรามอาชญากรรม เป็นพยานในอาชญากรรมร้ายแรงหรืออุบัติเหตุครั้งใหญ่"
      - third_factor: MERCURY
        meaning_th: "ผู้นำทางความคิดในหมู่อาชญากร คิดถึงการกระทำต่ำช้าครั้งใหญ่ งานเขียนเกี่ยวกับความยากจนและความทุกข์ยากครั้งใหญ่ เท่ากับซุส คือความเห็น (การตัดสิน) ของตำรวจปราบปรามอาชญากรรม"
      - third_factor: VENUS
        meaning_th: "เป็นผู้นำในเรื่องความรักที่ซื้อขายได้ ได้รับความช่วยเหลือและการสนับสนุนในเรื่องชั่วร้ายจากเจ้านาย ผู้บังคับบัญชา หรือรัฐบาล"
      - third_factor: MARS
        meaning_th: "การฆาตกรรมหมู่ ตกอยู่ในมือของตำรวจปราบปรามอาชญากรรม การกระทำต่ำช้าของเจ้านาย ผู้บังคับบัญชา หรือรัฐบาล"
      - third_factor: JUPITER
        meaning_th: "เรื่องอื้อฉาวทางการเงิน ธนาคารล่มสลาย ภาวะเงินเฟ้อ รอดพ้นจากแผนการต่ำช้า รอดมาได้โดยเสียหายเพียงเล็กน้อย"
      - third_factor: SATURN
        meaning_th: "ความสูญเสียจากการบริหารผิดพลาดของรัฐบาล ถูกรัฐบาลทอดทิ้ง รัฐบาลไม่รักษาสัญญา"
      - third_factor: URANUS
        meaning_th: "โชคร้ายครั้งใหญ่ฉับพลันพร้อมการสูญเสียชีวิต การฆาตกรรมครั้งใหญ่ฉับพลันที่รัฐบาลมีส่วนเกี่ยวข้อง"
      - third_factor: NEPTUNE
        meaning_th: "การฉ้อโกงที่พัฒนามาจากการทุจริต เท่ากับอพอลโล คือนักต้มตุ๋นชั้นสูง อาชญากรระดับหรู นักหลอกลวงมืออาชีพ"
      - third_factor: PLUTO
        meaning_th: "การกระทำชั่วร้ายครั้งใหญ่ก่อตัวขึ้น ความชั่วร้ายที่กำลังเติบโต ความล้มเหลวครั้งใหญ่"
      - third_factor: CUPIDO
        meaning_th: "ศิลปะหยาบคายหรือลามก การกระทำต่ำช้าของฝูงชน แก๊งอาชญากร"
      - third_factor: ZEUS
        meaning_th: "สั่งการความโหดร้ายในสงคราม จุดไฟไหม้ทำลายล้างครั้งใหญ่ ความเกลียดชังที่เกิดจากความต่ำช้า ความโหดร้ายและความต่ำช้าที่มุ่งเป้าหรือถูกกำกับอย่างดี"
      - third_factor: APOLLON
        meaning_th: "ตรวจพบการทุจริตและความต่ำช้าครั้งใหญ่ ความบกพร่องครั้งใหญ่ในรัฐบาลเป็นที่รับรู้ต่อสาธารณชน"
      - third_factor: ADMETOS
        meaning_th: "การกระทำต่ำช้าครั้งใหญ่ที่เกิดขึ้นในพื้นที่แคบหรือห้อง การกระทำในคุกยังคงถูกปิดบัง การกระทำชั่วร้ายที่ไม่ถูกค้นพบ"
      - third_factor: VULKANUS
        meaning_th: "การฆาตกรรมในระดับใหญ่ ความโหดร้าย ความต่ำช้า และความชั่วร้ายครั้งใหญ่ รัฐบาลดำเนินการในแบบปีศาจ"
      - third_factor: POSEIDON
        meaning_th: "วิธีมองชีวิตและโลกแบบต่ำช้าหรือปานกลาง ความชั่วร้าย คำโกหก หรือการบิดเบือนทางจิตใจ"

  - factors: [HADES, APOLLON]
    keyword_en: "Widespread poverty. Misery of the masses. Garbage and junk dealers. Second-hand dealers. Collecting rags. The science of the past. The knowledge of history. Occult science. Secret science. Magic."
    entries:
      - third_factor: M
        meaning_th: "ตกอยู่ใต้อิทธิพลและความประทับใจของความยากจนครั้งใหญ่ เป็นนักประวัติศาสตร์ รู้จักอดีต ความรู้ในหลักคำสอนลับ"
      - third_factor: ARIES
        meaning_th: "ความยากจนและความทุกข์ยากโดยทั่วไป ทัศนคติต่ออดีต ค้าขายเศษผ้า เสื้อผ้ามือสอง"
      - third_factor: SUN
        meaning_th: "ชายที่จัดการกับขยะและเศษผ้า ชายที่เกี่ยวข้องกับวิทยาศาสตร์หรือความรู้แห่งอดีต วันที่นำมาซึ่งอุปสรรคมากมาย"
      - third_factor: A
        meaning_th: "ประสบความทุกข์ยากของมวลชนในสภาพแวดล้อม ผู้อื่นยากจนข้นแค้น ผู้อื่นโทษความทุกข์ยากว่ามาจากอดีต สิ่งน่าเกลียดในอดีตถูกชี้ให้เจ้าของดวงเห็น"
      - third_factor: MOON
        meaning_th: "ความทุกข์ยากครั้งใหญ่ของมวลชน ความยากจนโดยทั่วไปของประชาชน ความแห้งแล้งและช่วงอากาศร้อน การขาดแคลนน้ำ โรคระบาด"
      - third_factor: NODE
        meaning_th: "การค้าหยุดชะงัก เศรษฐกิจตกต่ำ เกี่ยวข้องกับโบราณวัตถุและประวัติศาสตร์วิทยาศาสตร์"
      - third_factor: MERCURY
        meaning_th: "การพูดคุย ความคิดเห็น และความคิดเกี่ยวกับโรคระบาด ความขาดแคลน ความยากจน ความแห้งแล้ง ฯลฯ การถกเถียงหรือความคิดเชิงวิทยาศาสตร์เกี่ยวกับอดีต โบราณวัตถุ หรือประวัติศาสตร์วิทยาศาสตร์"
      - third_factor: VENUS
        meaning_th: "แม่ที่เจ็บป่วยหรือไม่อยู่ ความยากจนที่บรรเทาลงด้วยความเมตตาและความเป็นมิตร มิตรภาพ ความเป็นเพื่อน และมือที่ยื่นช่วยเหลือในยามทุกข์ยาก รู้สึกถูกดึงดูดใจโดยเวทมนตร์และไสยศาสตร์"
      - third_factor: MARS
        meaning_th: "กิจกรรมทางโบราณคดีหรือประวัติศาสตร์วิทยาศาสตร์ กิจกรรมค้าขายหรืออาชีพที่เกี่ยวกับวัสดุเก่า การกระทำน่าเกลียด กิจกรรมด้านไสยศาสตร์หรือเวทมนตร์"
      - third_factor: JUPITER
        meaning_th: "โชคดีและความสำเร็จในโบราณคดีและประวัติศาสตร์วิทยาศาสตร์ ได้รับการดูแลอย่างดีในยามยาก รายได้จากการเก็บเศษผ้าและของเก่า โชคดีและความสำเร็จในไสยศาสตร์และเวทมนตร์"
      - third_factor: SATURN
        meaning_th: "จุดเริ่มต้นหรือจุดจบของความทุกข์ยากของมวลชนโดยทั่วไป ภาวะเงินเฟ้อหรือความยากจน ความทุกข์ยากของผู้ลี้ภัย ความสิ้นหวังโดยทั่วไป การล้มละลาย และการฆ่าตัวตาย"
      - third_factor: URANUS
        meaning_th: "การกระทำต่ำช้าฉับพลันอันเป็นผลจากความผิดพลาดในอดีต ความผิดพลาดและการกระทำชั่วร้ายในอดีตถูกย้ำเตือน บาปและความบกพร่องเก่าส่งผลตอบสนอง โหราศาสตร์"
      - third_factor: NEPTUNE
        meaning_th: "จากอดีต ทำนายอนาคตอย่างเป็นวิทยาศาสตร์ เกี่ยวข้องกับมวลน้ำ ความชื้นสูง ระบบน้ำ"
      - third_factor: PLUTO
        meaning_th: "เริ่มต้นหรือยุติช่วงเวลาแห่งภาวะฉุกเฉินครั้งใหญ่ พัฒนาความสามารถด้านไสยศาสตร์"
      - third_factor: CUPIDO
        meaning_th: "เรื่องไม่น่าพอใจกับครอบครัวหรือสมาคม สมาคมประวัติศาสตร์วิทยาศาสตร์ เรื่องไม่น่าพอใจที่เกี่ยวกับขยะ เศษผ้าเก่า หรือวัสดุเก่าอื่นๆ"
      - third_factor: ZEUS
        meaning_th: "ความทุกข์ยากของมวลชนและการทำลายล้างครั้งใหญ่ที่เกิดจากความเกลียดชังในสงคราม กิจกรรมสร้างสรรค์ในประวัติศาสตร์วิทยาศาสตร์"
      - third_factor: KRONOS
        meaning_th: "เป็นผู้เชี่ยวชาญด้านประวัติศาสตร์วิทยาศาสตร์ ความทุกข์ยากของมวลชนที่เกิดจากความไร้ความสามารถของรัฐบาล ความสามารถในสาขาเวทมนตร์และไสยศาสตร์"
      - third_factor: ADMETOS
        meaning_th: "ความยากจนและความขัดสนของคนไม่กี่คน เป็นส่วนหนึ่งของคนไม่กี่คนนั้น"
      - third_factor: VULKANUS
        meaning_th: "การแพร่กระจายของความยากจนและความขัดสนอย่างมหาศาล ความทุกข์ยากมหาศาล การทำลายล้างครั้งใหญ่ ความสำเร็จครั้งใหญ่ในฐานะนักประวัติศาสตร์ ความสำเร็จในเรื่องไสยศาสตร์"
      - third_factor: POSEIDON
        meaning_th: "พี่น้องร่วมประเภทเดียวกัน ทัศนคติทางจิตใจเท่ากับสถานะทางสังคม หาผู้สนับสนุนและผู้ติดตามให้กับศาสตร์หนึ่ง เช่นเดียวกันทั้งทางสังคมและการเมือง"

  - factors: [HADES, ADMETOS]
    keyword_en: "Lack and want of raw materials. Scantness. Frugality. Raw materials from old materials or junk. Great and deep sadness. Pessimism. Coldness. Antipathy."
    entries:
      - third_factor: M
        meaning_th: "ใช้ชีวิตในสภาพขัดสน แก่ ห้วนๆ และเข้าถึงยาก อยู่คนเดียวและเดียวดายตลอดชีวิต"
      - third_factor: ARIES
        meaning_th: "การขาดแคลนวัตถุดิบโดยทั่วไป เศรษฐกิจตกต่ำ มาตรฐานความเป็นอยู่ตกต่ำ การมองโลกในแง่ร้ายโดยทั่วไป"
      - third_factor: SUN
        meaning_th: "ชายที่ทนทุกข์จากการขาดแคลนหลายอย่างและต้องดิ้นรนหาเลี้ยงชีพ ชายที่มีความต้องการน้อยมาก วันเวลาผ่านไปในอารมณ์ที่ถูกกดดัน"
      - third_factor: A
        meaning_th: "เกี่ยวข้องกับผู้คนที่ขัดสน ทนทุกข์เองจากอากาศเลวร้ายหรือความหนาวเย็น"
      - third_factor: MOON
        meaning_th: "ผู้หญิงหรือบุคคลอื่นที่ขัดสนอย่างหนัก การปรากฏของความขาดแคลนในหมู่ประชาชน"
      - third_factor: NODE
        meaning_th: "สัมผัสกับความยากจน แนวโน้มที่จะประหยัด แนวโน้มแบบนักพรต"
      - third_factor: MERCURY
        meaning_th: "อารมณ์เศร้าและมองโลกในแง่ร้ายที่เกิดจากความขาดแคลน พูดคุยเรื่องวัตถุดิบหรือวัสดุเก่า"
      - third_factor: VENUS
        meaning_th: "ขาดแคลนบุคลากรให้บริการ ถูกปลดจากหน้าที่ หรือได้รับการปลดจากงาน แม้จะขาดแคลนและต้องการบุคลากร"
      - third_factor: MARS
        meaning_th: "ถูกบังคับให้ทำงานรับใช้ต่ำต้อยด้วยแรงกดดันสูง ถูกข่มขู่ในหรือผ่านงานของตน"
      - third_factor: JUPITER
        meaning_th: "ได้รับการดูแลอย่างดีแม้จะขาดแคลนวัตถุดิบและอยู่ในสภาพประหยัด ไม่รู้สึกขัดสนสิ่งใด"
      - third_factor: SATURN
        meaning_th: "ตกอยู่ในสถานการณ์คับขันจากการพลัดพรากและความเป็นศัตรู ถูกขังแน่นโดยไม่มีทางออก"
      - third_factor: URANUS
        meaning_th: "ความขัดสน ความต้องการ หรือความยากจนปรากฏขึ้นฉับพลัน เหตุการณ์ร้ายแรง ถูกฝังอยู่ใต้บางสิ่ง ความเป็นศัตรูร้ายแรงฉับพลัน แผ่นดินถล่มฉับพลัน หรือสิ่งที่มั่นคงพังทลายลงฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "จุดเริ่มต้นของการเปลี่ยนแปลงสภาพปัจจุบันถูกทำให้ล่าช้าหรือหยุดชะงักด้วยความคลุมเครือ การหลอกลวง และความผิดพลาด"
      - third_factor: PLUTO
        meaning_th: "การขาดแคลนวัตถุดิบเพิ่มขึ้น ความขัดสนและความประหยัด มาตรฐานความเป็นอยู่ลดลงซ้ำแล้วซ้ำเล่า"
      - third_factor: CUPIDO
        meaning_th: "สมาคมเล็กที่ทนทุกข์จากความขาดแคลนหลายรูปแบบ จำนวนสมาชิกลดลง ขาดแคลนเงิน ฯลฯ"
      - third_factor: ZEUS
        meaning_th: "บรรเทาหรือกำจัดสภาพความเป็นอยู่ที่ย่ำแย่หรือการขาดแคลนวัตถุดิบผ่านความพยายามอันแข็งขันครั้งใหญ่ เดินหน้าด้วยความกระตือรือร้นแบบคลั่งไคล้ ขณะต่อสู้อย่างเกลียดชังกับศัตรู"
      - third_factor: KRONOS
        meaning_th: "วิธีการแปลกๆ ของรัฐบาลในการเอาชนะการขาดแคลนวัตถุดิบ การปรากฏครั้งแรกของความโหดร้ายครั้งใหญ่"
      - third_factor: APOLLON
        meaning_th: "เริ่มต้นช่วงเวลาแห่งความขัดสนสำหรับคนหมู่มาก การเปิดเผยที่น่าพอใจในประวัติศาสตร์วิทยาศาสตร์"
      - third_factor: VULKANUS
        meaning_th: "ตกอยู่ภายใต้แรงกดดันหนักจากความขัดสน ความอดอยาก และความเป็นศัตรู ประหยัดจนเกินพอดี"
      - third_factor: POSEIDON
        meaning_th: "ครุ่นคิดถึงยุคโบราณ สนใจสิ่งของหรือยุคก่อนประวัติศาสตร์ ครุ่นคิดถึงอดีตอันไกลโพ้น คำอธิบาย 'ความไม่รู้และความเฉยเมยทางจิตใจ' ก็ถูกต้องเช่นกัน"

  - factors: [HADES, VULKANUS]
    keyword_en: "Raw force. Great danger. Murder. Mean and brutal acts. Capital crimes. Viciousness. Ugliness. Vices."
    entries:
      - third_factor: M
        meaning_th: "มีนิสัยโน้มเอียงไปทางอบายมุข สัมผัสกับอบายมุข ความต่ำช้า และความสกปรก แสวงหาและค้นหาสิ่งเหล่านี้ มีนิสัยโหดร้าย"
      - third_factor: ARIES
        meaning_th: "อบายมุข อุปสรรค และความสกปรกโดยทั่วไป ต้องรับมือกับคนประเภทนั้น มารยาทและกลอุบายที่น่าเกลียดโดยทั่วไป คนดิบและไร้วัฒนธรรม"
      - third_factor: SUN
        meaning_th: "สกปรกทางกาย ร่างกายเต็มไปด้วยสิ่งสกปรก ร่างกายอ่อนแอจากภายในเพราะการติดเชื้อ ร่างกายที่รู้สึกอ่อนแรง วันที่เต็มไปด้วยอุปสรรค"
      - third_factor: A
        meaning_th: "เกี่ยวข้องกับเรื่องสกปรก ถูกพัวพันผ่านผู้อื่น การกระทำชั่วร้ายของผู้อื่น สภาพแวดล้อมมีผู้คนนิสัยหยาบคายและต่ำช้า"
      - third_factor: MOON
        meaning_th: "ผู้คนต่ำช้า โหดร้าย ชั่วร้าย และไร้วัฒนธรรม ผู้คนที่โน้มเอียงไปทางความรุนแรง ผู้คนที่อ่อนแอไร้ความกล้าหาญ ผู้หญิงที่อ่อนแอจากความเจ็บป่วย"
      - third_factor: NODE
        meaning_th: "ต้องติดต่อกับคนหยาบคายและไร้มารยาท ถูกก่อกวนโดยพวกเขา"
      - third_factor: MERCURY
        meaning_th: "วิธีแสดงออกอย่างหยาบคาย คำสาปแช่ง ภาษาหยาบโลน สาปแช่งหรือถูกสาปแช่ง"
      - third_factor: VENUS
        meaning_th: "ความน่ารังเกียจในความรัก ความอ่อนแอทางเพศ เท่ากับจันทร์ คือผู้หญิงที่มีแนวโน้มคลอดก่อนกำหนดหรือแท้งบุตร"
      - third_factor: MARS
        meaning_th: "การกระทำในสงครามครั้งใหญ่ การทำลายล้างครั้งใหญ่ เผชิญความโหดร้ายและความต่ำช้าในเวลาทำงาน การปฏิบัติที่ไม่ยุติธรรมและไม่เป็นธรรม"
      - third_factor: JUPITER
        meaning_th: "หลบหนีความพยายามชั่วร้าย ได้รับการปกป้องที่จำเป็นเพื่อหลีกเลี่ยงอันตราย"
      - third_factor: SATURN
        meaning_th: "ถูกพรากจากกันเพราะความโหดร้ายและความต่ำช้า ถูกขัดขวางจากสิ่งเดียวกัน ถูกสงสัยและถูกสอดแนม เป็นสายลับ ปฏิบัติหน้าที่ในสงคราม"
      - third_factor: URANUS
        meaning_th: "การฆาตกรรมอันน่าสยดสยองฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "ไร้อำนาจต่อความต่ำช้า ความชั่วร้าย และสิ่งเลวร้ายอื่นๆ อบายมุขถูกเปิดเผยผ่านการล่มสลายครั้งใหญ่"
      - third_factor: PLUTO
        meaning_th: "สิ่งชั่วร้ายที่กำลังก่อตัวขึ้นและคงอยู่นาน"
      - third_factor: CUPIDO
        meaning_th: "หุ้นส่วนที่ตกอยู่ในอันตรายตลอดเวลา อ่อนแอลงจากความสูญเสีย ถูกทำลายบางส่วน"
      - third_factor: ZEUS
        meaning_th: "การกระทำชั่วร้ายครั้งใหญ่ที่เกิดจากความเกลียดชัง ความชั่วร้ายครั้งใหญ่"
      - third_factor: KRONOS
        meaning_th: "อาชญากรรมและการกระทำชั่วร้ายหรือความต่ำช้าขนาดมหึมา รัฐบาลและเจ้าหน้าที่มีส่วนเกี่ยวข้อง"
      - third_factor: APOLLON
        meaning_th: "ความชั่วร้ายที่แพร่กระจายอย่างกว้างขวาง ความสำเร็จในประวัติศาสตร์วิทยาศาสตร์ ความล้มเหลวในอุตสาหกรรม"
      - third_factor: ADMETOS
        meaning_th: "ความชั่วร้ายและการกระทำชั่วร้ายในวงแคบ"
      - third_factor: POSEIDON
        meaning_th: "หดหู่จากการกระทำผิด มีความรู้สึกผิดในใจ"

  - factors: [HADES, POSEIDON]
    keyword_en: "Mental and spiritual poverty. Mental deficiency and defects. Secret science. Mental and spiritual isolation."
    entries:
      - third_factor: M
        meaning_th: "ยากจนทางจิตใจหรือจิตวิญญาณ แสดงความบกพร่อง เป็นตัวแทนของศาสตร์ลับหรือภูมิปัญญา เป็นคนประหลาดทางจิตใจ"
      - third_factor: ARIES
        meaning_th: "ตาบอดทางจิตใจและความยากจนทางจิตใจโดยทั่วไป เกี่ยวข้องกับผู้คนที่ไม่อาจสร้างการติดต่อทางจิตใจได้"
      - third_factor: SUN
        meaning_th: "ชายที่ดูเหมือนพัฒนาการทางจิตใจล่าช้า มีความคิดโบราณ ความคิดแปลกประหลาด รูปแบบอ่อนคือความคิดอนุรักษ์นิยม ใช้ชีวิตตามประเพณี คำอธิบายทั่วไปคือ 'แยกตัวเองออกจากผู้อื่นทางจิตใจ'"
      - third_factor: A
        meaning_th: "ผู้อื่นแยกตัวเองออกจากเจ้าของดวงทางจิตใจ เจ้าของดวงดูเหมือนเข้าใจยาก ไม่ถูกเข้าใจทางจิตใจ เจ้าของดวงใช้ชีวิตทางจิตใจของตนในสภาพแวดล้อมที่ไม่เข้าใจตน สิ่งนี้อาจเกิดขึ้นเมื่อเจ้าของดวงเป็นนักโหราศาสตร์ นักมายากล หรืออาชีพคล้ายกัน"
      - third_factor: MOON
        meaning_th: "โดดเด่นกว่าผู้อื่นและสาธารณชนในเรื่องจิตใจและความเข้าใจโลก โดยทั่วไปเจ้าของดวงไม่มีความเข้าใจต่อสาธารณชนหรือผู้อื่น ผู้หญิงที่แปลกประหลาด"
      - third_factor: NODE
        meaning_th: "เกี่ยวข้องกับผู้คนที่แปลกประหลาด"
      - third_factor: MERCURY
        meaning_th: "มีความคิดแปลกประหลาด ยึดติดกับมัน"
      - third_factor: VENUS
        meaning_th: "ถูกแยกตัวโดยการรับใช้หรือหน้าที่ คำสั่งพิเศษหรือภารกิจ ได้รับมอบหมายหน้าที่พิเศษที่เหมาะกับเจ้าของดวง"
      - third_factor: MARS
        meaning_th: "แยกตัวเองผ่านกิจกรรมหรือพฤติกรรมทางศีลธรรมของตนเอง ได้รับการปฏิบัติเป็นพิเศษ ถูกแยกตัว"
      - third_factor: JUPITER
        meaning_th: "ความสุขจากการแยกตัวทางจิตใจ"
      - third_factor: SATURN
        meaning_th: "จากผลของการแยกตัว รู้สึกหดหู่และถูกกดขี่ ถูกเบียดเบียนเพราะทัศนคติทางจิตใจที่แตกต่าง"
      - third_factor: URANUS
        meaning_th: "ขีดเส้นแบ่งอย่างชัดเจนฉับพลันเกี่ยวกับการแยกตัวของตน"
      - third_factor: NEPTUNE
        meaning_th: "ปรากฏต่อผู้อื่นว่าคลุมเครือ ไม่ชัดเจน และซับซ้อนจากพฤติกรรมทางจิตใจและการแยกตัวของตนเอง ไม่ถูกเข้าใจ"
      - third_factor: PLUTO
        meaning_th: "การพรากจาก การแยกตัว และสถานะพิเศษพัฒนาขึ้น ในทางไดเรกชั่น เจ้าของดวงจะประสบการแยกตัวที่รุนแรงยิ่งขึ้น"
      - third_factor: CUPIDO
        meaning_th: "สนับสนุนและติดตามสมาคมที่มีศรัทธาแปลกประหลาด มีความสุขในวงแคบเฉพาะกลุ่มเช่นนั้น รังเกียจมวลชน ติดตามกลุ่มคนที่แยกตัวออกจากกลุ่มใหญ่"
      - third_factor: ZEUS
        meaning_th: "ผ่านการแยกตัวหรือการพราก กลายเป็นเป้าหมายของความเกลียดชังและความอาฆาตพยาบาท"
      - third_factor: KRONOS
        meaning_th: "ตกอยู่ภายใต้ความต่ำช้าและความสูญเสียครั้งใหญ่จากผู้มีอำนาจหรือผู้บังคับบัญชาเพราะสถานะพิเศษของตน"
      - third_factor: APOLLON
        meaning_th: "แยกตัวหรือแยกออกจากคนหมู่มาก หรือมีสถานะพิเศษท่ามกลางคนหมู่มาก"
      - third_factor: ADMETOS
        meaning_th: "ครองสถานะพิเศษในหมู่คนไม่กี่คน โดดเด่นเหนือผู้อื่น"
      - third_factor: VULKANUS
        meaning_th: "ตระหนักถึงสถานะที่แยกตัวและพิเศษของตน กลายเป็นที่รู้จักหรือฉาวโฉ่อย่างมาก ประสบการปฏิเสธและถูกกีดกัน"
