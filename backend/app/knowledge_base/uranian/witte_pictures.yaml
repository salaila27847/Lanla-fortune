      - third_factor: MOON
        meaning_th: "ผู้ช่วย ผู้ดูแลและผู้จัดการทั่วไป"
      - third_factor: NODE
        meaning_th: "กลุ่มผู้มีอำนาจด้วยกัน เชื่อมโยงกับความสามารถ"
      - third_factor: MERCURY
        meaning_th: "การจัดการวางแผน แนวความคิดที่ยิ่งใหญ่และสูงส่ง"
      - third_factor: VENUS
        meaning_th: "การให้ของขวัญ การแจกจ่าย ความโน้มเอียงสู่การกุศล"
      - third_factor: MARS
        meaning_th: "นักกีฬา นักมวยปล้ำ นักมวย ผู้กำกับการตำรวจ นายทหาร การกระทำด้วยตนเองอย่างอิสระ"
      - third_factor: JUPITER
        meaning_th: "คนมีเงิน นักการเงิน เงินหรือทรัพย์สินเพิ่มพูน ความสำเร็จผ่านความเป็นอิสระและความริเริ่ม"
      - third_factor: SATURN
        meaning_th: "เจ้าของที่ดิน การค้าผลผลิตทางการเกษตร ผู้เชี่ยวชาญด้านดิน รวมถึงการลดลงและสูญเสียจากความริเริ่มของตนเอง"
      - third_factor: URANUS
        meaning_th: "ผู้จัดการองค์กรเทคนิค ความต้องการสร้างสิ่งยิ่งใหญ่ การแสดงภาวะผู้นำอย่างฉับพลัน ความริเริ่ม"
      - third_factor: NEPTUNE
        meaning_th: "กัปตัน รวมถึงด้านการบิน ความล้มเหลวในฐานะผู้จัดการบางกรณี การไม่ได้รับการยอมรับ การแสวงหาสิ่งไม่รู้จักอย่างอิสระ"
      - third_factor: PLUTO
        meaning_th: "การเป็นหรือกลายเป็นผู้เชี่ยวชาญ"
      - third_factor: CUPIDO
        meaning_th: "อัจฉริยะทางศิลปะ ผู้นำทางสังคม พิธีกร"
      - third_factor: HADES
        meaning_th: "เจ้าของเหมือง เจ้าของเตาหลอม การได้สิ่งของจากพื้นดิน การเป็นสาเหตุแห่งความเศร้าและอุปสรรคของตนเอง"
      - third_factor: ZEUS
        meaning_th: "หัวหน้าคนงานหรือผู้จัดการโรงงานเครื่องจักร นายทหาร การเป็นผู้นำโดยไม่ผิดพลาด"
      - third_factor: APOLLON
        meaning_th: "การเป็นผู้เชี่ยวชาญด้านวิทยาศาสตร์หรือการค้า"
      - third_factor: ADMETOS
        meaning_th: "อำนาจของตนเองด้านวิทยาศาสตร์หรือการค้าที่อาจไม่ได้รับการยอมรับ"
      - third_factor: VULKANUS
        meaning_th: "อำนาจอันยิ่งใหญ่ การใช้อำนาจรัฐ อำนาจมอบฉันทะ"
      - third_factor: POSEIDON
        meaning_th: "ผู้นำทางปัญญา ผู้ชี้นำทางจิตวิญญาณ การศึกษาระดับสูง"

  - factors: [M, APOLLON]
    keyword_en: "One's own life experience. The mental horizon."
    entries:
      - third_factor: ARIES
        meaning_th: "ประสบการณ์ชีวิตที่ยิ่งใหญ่และอุดม การได้ยินและเห็นมาก"
      - third_factor: SUN
