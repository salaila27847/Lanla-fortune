      - third_factor: SATURN
        meaning_th: "พระราชกฤษฎีกาเกี่ยวกับที่ดิน กฎหมายก่อสร้าง กฎหมายด้านเกษตร กฎหมายที่เป็นอันตราย ก่อความเสียหายและเป็นอุปสรรค"
      - third_factor: URANUS
        meaning_th: "พระราชกฤษฎีกาฉุกเฉิน กฎอัยการศึก ยืนหยัดด้วยความเข้มแข็ง หยุดยั้ง เท่ากับอาทิตย์ คือวันประกาศ คำสั่งที่น่าตื่นเต้น"
      - third_factor: NEPTUNE
        meaning_th: "กฎหมายลับ ข้อตกลงลับ คำขอที่ทำลายล้างหรือไร้ผล"
      - third_factor: PLUTO
        meaning_th: "เรียนรู้ที่จะสั่งและเชื่อฟัง"
      - third_factor: CUPIDO
