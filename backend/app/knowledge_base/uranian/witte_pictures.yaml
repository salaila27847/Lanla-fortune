# witte_pictures.yaml — the actual "Rules for Planetary Pictures" glossary: for a given base pair
# (e.g. M+SUN), the SPECIFIC meaning when each other factor sits at their midpoint (a Type I
# picture, e.g. M+SUN=ARIES vs M+SUN=SATURN — genuinely different meanings). This is one level
# more granular than axis_meanings.yaml, which only gives the base pair's general theme
# ("M + SUN: ...") without breaking it down by third factor.
#
# ที่มา: "Rules for Planetary Pictures (Uranian System)" ดัดแปลง/เรียบเรียงจากคำสอนของ Alfred Witte
# โดยศิษย์ของเขา (Hans Niggemann, ต้นฉบับพิมพ์ปี 1959) — นี่คือตำรา Regelwerk fuer Planetenbilder
# ฉบับภาษาอังกฤษที่ CLAUDE.md/knowledge_base อ้างถึงว่าเป็นตำราอ้างอิงมาตรฐานของวงการยูเรเนียน
# (ละเอียดกว่า planetary_pictures.yaml ที่มีแค่ 50 คู่คัดสรรมาก) ผู้ใช้ส่งไฟล์ scan+OCR ทั้งเล่ม
# (~255 หน้า) มาให้ — คุณภาพ OCR แย่มาก มีตัวอักษรเพี้ยนแทบทุกย่อหน้า (เช่น "Witte"→"Mitte",
# "Meridian"→"tlcridlan") ทุกรายการด้านล่างผ่านการอ่านและสร้างประโยคภาษาอังกฤษที่สมเหตุสมผลใหม่ก่อน
# แปลเป็นไทย บางรายการกู้คืนจาก OCR ไม่ได้อย่างมั่นใจ จึง "ละไว้" แทนการเดา (ดูหมายเหตุ missing ต่อ
# ท้ายแต่ละคู่ที่ขาด) — มีต้นฉบับ OCR ดิบอยู่ที่ไฟล์ที่ผู้ใช้อัปโหลด ยังไม่ได้ก็อปปี้เข้า research/
# เพราะไฟล์ต้นฉบับใหญ่มาก (9599 บรรทัด) ให้ผู้ใช้ส่งซ้ำถ้าต้องการทำหมวดถัดไป
#
# สถานะ (แก้ไข 2026-08-13, Phase 15): มีเฉพาะหมวด Meridian (M + อีก 21 ปัจจัยที่เหลือทั้งหมด,
# หน้า 1-22 ของหนังสือ) — ยังไม่ได้ทำหมวด Aries/Sun/Ascendant/Moon/Node และดาวเคราะห์/TNP อีก 16
# ดวง (หน้า 23-255) ตามลำดับความสำคัญที่หนังสือเองระบุไว้ (Meridian ก่อน, ตามด้วย Cardinal/Aries,
# Sun, Ascendant, Moon, Node)
#
# engine.py ใช้ไฟล์นี้เฉพาะกับ Type I picture (pair + hit ตรงตัว) เป็นลำดับความสำคัญสูงสุด
# ก่อน planetary_pictures.yaml (คู่ทั่วไป) และก่อน fallback แบบ keyword — ดู _picture_finding()
base_pairs:
  - factors: [M, SUN]
    keyword_en: "Body and soul. Appearance of the 'I'."
    entries:
      - third_factor: ARIES
        meaning_th: "ทัศนคติกาย-จิตต่อสาธารณะโดยรวม อิทธิพลของสิ่งแวดล้อมต่อร่างกาย การสร้างความประทับใจต่อผู้อื่น"
      - third_factor: A
        meaning_th: "ทัศนคติทางความคิดและหน้าที่การงานต่อผู้อื่น"
      - third_factor: MOON
        meaning_th: "ทัศนคติส่วนตัวต่อผู้หญิง จิตใจ"
      - third_factor: NODE
        meaning_th: "สายสัมพันธ์ไม่ใช่แค่ทางกาย แต่ทางจิตใจด้วย"
      - third_factor: MERCURY
        meaning_th: "ความคล่องแคล่วของกายและจิต สภาพระบบประสาท การครุ่นคิดของตนเอง การใคร่ครวญ"
      - third_factor: VENUS
        meaning_th: "กายและจิตประสานกลมกลืน การประนีประนอม ความชื่นชอบในบางสิ่ง"
      - third_factor: MARS
        meaning_th: "การลงมือกระทำ การแสดงเจตจำนง การตัดสินใจ ทุ่มเททั้งกายและใจ ทำสิ่งใดให้สำเร็จครบถ้วน"
      - third_factor: JUPITER
        meaning_th: "ความสุขทั้งกายและใจ ความพึงพอใจ การมองโลกในแง่ดี"
      - third_factor: SATURN
        meaning_th: "ความเศร้า ความโศกเศร้า การมองโลกในแง่ร้าย การแยกจาก การล้มเลิกเป้าหมายบางอย่าง"
      - third_factor: URANUS
        meaning_th: "ความตึงเครียดทั้งกายและใจอย่างรุนแรง ความกระวนกระวาย การระเบิดอารมณ์ฉับพลัน ความขัดแย้ง"
      - third_factor: NEPTUNE
        meaning_th: "กายและจิตอ่อนไหวง่าย ตอบสนองรุนแรงต่อทุกอิทธิพลแม้เพียงเล็กน้อย ความอ่อนแอ ความไม่ชอบ สัญชาตญาณ"
      - third_factor: PLUTO
        meaning_th: "พัฒนาการของกายและจิตที่ส่งอิทธิพลต่อกัน ถูกกำหนดโดยองค์ประกอบของพลูโต การเปลี่ยนแปลงครั้งใหญ่ในชีวิต"
      - third_factor: CUPIDO
        meaning_th: "ความสุขทางกาย ความรู้สึกเชิงศิลปะ ทัศนคติต่อชีวิตแต่งงาน"
      - third_factor: HADES
        meaning_th: "ข้อบกพร่องทางกายส่งผลต่อจิตใจและย้อนกลับกันได้ ก่อความไม่สบายกาย อารมณ์ไม่ดี ความเจ็บป่วย ความน่ารังเกียจ"
      - third_factor: ZEUS
        meaning_th: "ความสามารถเชิงสร้างสรรค์ของกายและจิต ความกล้าหาญ พลังงาน ความต้องการเป็นผู้นำ"
      - third_factor: KRONOS
        meaning_th: "ความภักดีต่อผู้มีอำนาจด้วยกายและใจ ตำแหน่งหรือสถานะสูง"
      - third_factor: APOLLON
        meaning_th: "การขยายตัวครั้งใหญ่ของกายและจิต ความสำเร็จ"
      - third_factor: ADMETOS
        meaning_th: "ความอดทนพากเพียร ยึดมั่นในความคิดอย่างเหนียวแน่น"
      - third_factor: VULKANUS
        meaning_th: "การรวมพลังของกายและจิต"
      - third_factor: POSEIDON
        meaning_th: "การรวมกันของร่างกายที่บอบบางและจิตวิญญาณที่ละเอียดอ่อนสูง"

  - factors: [M, ARIES]
    keyword_en: "Individual attitude of the native toward universality. The \"I\" embodied to the world."
    # missing: NODE (OCR line dropped/merged between Moon and Mercury entries)
    entries:
      - third_factor: SUN
        meaning_th: "ร่างกายในที่สาธารณะ พฤติกรรมการแสดงออก"
      - third_factor: A
        meaning_th: "การสร้างมิตรภาพที่ส่งผลต่ออาชีพ การพบปะนอกบ้าน"
      - third_factor: MOON
        meaning_th: "การร่วมงานกับผู้อื่นในที่สาธารณะ การมีสายสัมพันธ์มากมายและได้มาง่าย"
      - third_factor: MERCURY
        meaning_th: "การแสดงออก คำกล่าว ความคิดเห็น บทสนทนาขณะพบปะผู้อื่น"
      - third_factor: VENUS
        meaning_th: "การแต่งตัวเพื่อผู้อื่น การเป็นที่ชื่นชอบ ดูน่าดึงดูดต่อสาธารณะ"
      - third_factor: MARS
        meaning_th: "การทำงานร่วมกับผู้อื่น การปล่อยให้ผู้อื่นทำงาน ดูมีพลัง กระตือรือร้น และยุ่งอยู่เสมอ"
      - third_factor: JUPITER
        meaning_th: "ความร่าเริงกับผู้อื่น ทัศนคติที่ดีต่อผู้อื่น ความรู้สึกโชคดี ประสบความสำเร็จ"
      - third_factor: SATURN
        meaning_th: "ความโศกเศร้าร่วมกับผู้อื่น การสูญเสีย การขาดการตอบสนอง หรือดูจืดชืดต่อผู้อื่น ความรู้สึกถูกทอดทิ้งหรือโดดเดี่ยว"
      - third_factor: URANUS
        meaning_th: "ประสบการณ์ร่วมกับผู้อื่น การแสดงความแปลกประหลาด การปฏิวัติ ความตื่นเต้นในที่สาธารณะ"
      - third_factor: NEPTUNE
        meaning_th: "การถูกหลอกลวงร่วมกับผู้อื่น ความสัมพันธ์ต่อสาธารณะที่ไม่แน่นอนและคลุมเครือ"
      - third_factor: PLUTO
        meaning_th: "พัฒนาการของทัศนคติตนเองต่อสาธารณชนโดยรวม"
      - third_factor: CUPIDO
        meaning_th: "ความชอบเข้าสังคม ดูและเป็นคนเข้าสังคมเก่ง การเกี่ยวข้องกับศิลปะ สมาคม หรือชุมชน"
      - third_factor: HADES
        meaning_th: "การร่วมทุกข์กับผู้อื่น การว่างงาน ความเห็นอกเห็นใจ"
      - third_factor: ZEUS
        meaning_th: "การรวมกลุ่มเหนียวแน่น มิตรภาพแบบเพื่อนร่วมรบ การเป็นผู้นำ การบรรลุเป้าหมาย"
      - third_factor: KRONOS
        meaning_th: "การอยู่ร่วมกันอย่างเป็นทางการ การดูเป็นผู้นำ"
      - third_factor: APOLLON
        meaning_th: "ประสบการณ์ชีวิตภายนอก ความโหยหาสถานที่ไกลๆ ความตั้งใจขยายตัว"
      - third_factor: ADMETOS
        meaning_th: "ยากจะเปลี่ยนใจ ไม่เปลี่ยนความคิดและทัศนคติเมื่อเผชิญสาธารณชน"
      - third_factor: VULKANUS
        meaning_th: "การใช้อำนาจโดยทั่วไป"
      - third_factor: POSEIDON
        meaning_th: "การยกระดับจิตวิญญาณ"

  - factors: [M, A]
    keyword_en: "The relationship to others. To join with others for a common objective."
    # missing: NODE (not found in OCR)
    entries:
      - third_factor: ARIES
        meaning_th: "การติดต่อทางอาชีพหรือความคิดกับสาธารณชนทั่วไป"
      - third_factor: SUN
        meaning_th: "การติดต่อทางอาชีพอย่างใกล้ชิดกับผู้อื่น การทำงานร่วมกัน พฤติกรรมต่อผู้หญิง ความสัมพันธ์ทางอาชีพกับสาธารณะและผู้หญิง"
      - third_factor: MOON
        meaning_th: "สายสัมพันธ์ผ่านความสนใจร่วม ที่กลายเป็นเรื่องส่วนตัว การรู้จักกันทางความคิด"
      - third_factor: MERCURY
        meaning_th: "บทสนทนาด้านอาชีพหรือธุรกิจ"
      - third_factor: VENUS
        meaning_th: "สายสัมพันธ์ทางอาชีพที่ราบรื่น พึงพอใจกับความสัมพันธ์ทางอาชีพ สายสัมพันธ์กลมกลืนในแวดวงใกล้ตัว"
      - third_factor: MARS
        meaning_th: "กิจกรรมทางอาชีพ การพัฒนาหรือบรรลุบางสิ่งร่วมกับผู้อื่น"
      - third_factor: JUPITER
        meaning_th: "โชคทางอาชีพ ความเพลิดเพลินในกิจกรรมร่วมกับผู้อื่น"
      - third_factor: SATURN
        meaning_th: "ความยากลำบากทางอาชีพ การแยกจากผู้อื่น"
      - third_factor: URANUS
        meaning_th: "การเผชิญหน้าผู้อื่นอย่างฉับพลัน ปัญหาทางอาชีพที่เกิดขึ้นทันที การก่อเรื่องอย่างกะทันหัน"
      - third_factor: NEPTUNE
        meaning_th: "การถูกผู้อื่นหลอกลวง การเผชิญการหลอกลวงร่วมกับผู้อื่น สภาพการงานที่ไม่มั่นคง"
      - third_factor: PLUTO
        meaning_th: "พัฒนาการหรือการเปลี่ยนแปลงในชีวิตการงานหรือความสัมพันธ์กับผู้อื่น ส่งผลต่อบุคลิกภาพผ่านการเปลี่ยนแปลงทางอาชีพ"
      - third_factor: CUPIDO
        meaning_th: "ความกระตือรือร้นในสังคม การแต่งงาน หุ้นส่วนทางอาชีพ"
      - third_factor: HADES
        meaning_th: "อารมณ์เศร้ากับผู้คนรอบตัว จากงานหรืออาชีพที่เกี่ยวข้องกับสิ่งสกปรกน่ารังเกียจ"
      - third_factor: ZEUS
        meaning_th: "การกระตุ้นปลุกเร้าผู้อื่น"
      - third_factor: KRONOS
        meaning_th: "ความยโส การชอบสั่งการผู้อื่น"
      - third_factor: APOLLON
        meaning_th: "ความสำเร็จทางอาชีพ การติดต่อกับผู้คนจำนวนมาก"
      - third_factor: ADMETOS
        meaning_th: "ความสัมพันธ์กับผู้อื่นที่มั่นคงหนักแน่น"
      - third_factor: VULKANUS
        meaning_th: "การใช้อำนาจร่วมกับผู้อื่น การดำเนินการร่วมกัน"
      - third_factor: POSEIDON
        meaning_th: "ความเห็นพ้องทางความคิด หรือความกลมกลืนทางจิตวิญญาณกับผู้อื่น"

  - factors: [M, NODE]
    keyword_en: "Soul unions."
    entries:
      - third_factor: ARIES
        meaning_th: "ความถูกคอกับผู้คนทั่วไป"
      - third_factor: SUN
        meaning_th: "การรวมจิตวิญญาณส่งผลต่อร่างกาย"
      - third_factor: A
        meaning_th: "การรวมจิตวิญญาณกับคนคุ้นเคย"
      - third_factor: MOON
        meaning_th: "อารมณ์ที่เกิดจากการรวมจิตวิญญาณ"
      - third_factor: MERCURY
        meaning_th: "แรงกระตุ้นทางความคิดจากการรวมจิตวิญญาณ การเชื่อมโยงทางความคิด"
      - third_factor: VENUS
        meaning_th: "สายสัมพันธ์ความรักส่วนตัว การรวมจิตวิญญาณด้วยความรัก"
      - third_factor: MARS
        meaning_th: "การรวมจิตวิญญาณเชิงกามารมณ์ การแสวงหามิตรภาพในการทำงาน"
      - third_factor: JUPITER
        meaning_th: "โชคและความสุขผ่านสายสัมพันธ์ของตน ความรู้สึกเป็นสุขกับผู้อื่น"
      - third_factor: SATURN
        meaning_th: "ความหม่นหมองที่ผู้อื่นนำมาให้ การสูญเสียสายสัมพันธ์"
      - third_factor: URANUS
        meaning_th: "สายสัมพันธ์ที่เกิดขึ้นฉับพลัน อารมณ์ที่เกิดขึ้นทันที"
      - third_factor: NEPTUNE
        meaning_th: "การสลายของสายสัมพันธ์ ผลกระทบต่อพัฒนาการของตนเอง"
      - third_factor: PLUTO
        meaning_th: "การเริ่มต้นหรือเปลี่ยนแปลงสายสัมพันธ์ ผลกระทบต่อพัฒนาการของตนเอง"
      - third_factor: CUPIDO
        meaning_th: "สายสัมพันธ์ทางจิตวิญญาณกับศิลปะหรือครอบครัว"
      - third_factor: HADES
        meaning_th: "การพัวพันกับสิ่งชั่วร้าย ภาวะซึมเศร้าทางจิตใจรุนแรง"
      - third_factor: ZEUS
        meaning_th: "การถูกกระตุ้นทางความคิด การถูกยั่วยุ"
      - third_factor: KRONOS
        meaning_th: "สายสัมพันธ์ทางความคิดกับผู้มีอำนาจ/ผู้บังคับบัญชา"
      - third_factor: APOLLON
        meaning_th: "สายสัมพันธ์ที่กว้างไกล เชื่อมโยงกับนักวิทยาศาสตร์ การค้าและพาณิชย์"
      - third_factor: ADMETOS
        meaning_th: "ความยากลำบากในการสร้างสายสัมพันธ์ สายสัมพันธ์ที่ไร้ผล"
      - third_factor: VULKANUS
        meaning_th: "การมีสายสัมพันธ์ที่ทรงพลังและมีอิทธิพล"
      - third_factor: POSEIDON
        meaning_th: "การมีและแสวงหาสายสัมพันธ์ทางความคิดหรือจิตวิญญาณ"

  - factors: [M, MOON]
    keyword_en: "The mental or spiritual influence of female persons. The own mind."
    # missing: NEPTUNE (OCR line dropped between Uranus and Pluto entries)
    entries:
      - third_factor: ARIES
        meaning_th: "การถูกอิทธิพลจากผู้หญิง ทัศนคติทางความคิดต่อสาธารณะโดยรวม"
      - third_factor: SUN
        meaning_th: "อิทธิพลของสภาพจิตใจต่อร่างกาย อิทธิพลรายวัน ระบบต่อมไร้ท่อ"
      - third_factor: A
        meaning_th: "ทัศนคติทางความคิดต่อผู้อื่น อิทธิพลทางความคิดจากผู้หญิง"
      - third_factor: NODE
        meaning_th: "การรวมจิตวิญญาณกับผู้หญิง สายสัมพันธ์ที่มีอิทธิพลต่อจิตใจ"
      - third_factor: MERCURY
        meaning_th: "ความคิดที่ถูกกระตุ้นโดยผู้หญิง จิตใจที่ตื่นตัว"
      - third_factor: VENUS
        meaning_th: "ความชื่นชอบผู้หญิง จิตใจที่กลมกลืนเป็นสุข"
      - third_factor: MARS
        meaning_th: "แรงกระตุ้นทางเพศจากผู้หญิง ความคิดที่ตัดสินใจแล้ว ความเป็นชาย ทัศนคติแบบทหาร"
      - third_factor: JUPITER
        meaning_th: "สภาพจิตใจที่โชคดี ความสุขของผู้หญิง การคลอดบุตร"
      - third_factor: SATURN
        meaning_th: "ความเศร้าโศกจากผู้หญิง ความหม่นหมอง ความสัมพันธ์ส่วนตัวกับสาธารณะที่ปั่นป่วนหรือถูกรบกวน"
      - third_factor: URANUS
        meaning_th: "ความรำคาญใจจากผู้หญิง ความหลอกลวงของผู้หญิง จิตใจที่วอกแวก"
      - third_factor: PLUTO
        meaning_th: "การเปลี่ยนแปลงที่ประทับใจจิตใจต่อหน้าสาธารณะ การเปลี่ยนแปลงที่เกี่ยวข้องส่วนตัวกับสาธารณะ"
      - third_factor: CUPIDO
        meaning_th: "ความกลมกลืนทางจิตใจในชีวิตแต่งงาน จิตสำนึกชุมชนที่ขับเคลื่อนด้วยจิตใจ"
      - third_factor: HADES
        meaning_th: "ความต่ำทรามของผู้หญิง ความคิดต่ำ"
      - third_factor: ZEUS
        meaning_th: "จิตใจที่ร้อนแรง สร้างสรรค์ สมองที่กระตือรือร้น การถูกผู้หญิงกระตุ้นสู่ความคิดสร้างสรรค์"
      - third_factor: KRONOS
        meaning_th: "คุณสมบัติทางความคิดที่ดี ความมีน้ำใจ"
      - third_factor: APOLLON
        meaning_th: "ใจกว้าง เปิดเผย ตรงไปตรงมา"
      - third_factor: ADMETOS
        meaning_th: "ความสงวนท่าทีและระยะห่าง การปฏิเสธ ความคิดคับแคบ"
      - third_factor: VULKANUS
        meaning_th: "พลังทางความคิด ถูกอิทธิพลจากผู้หญิงอย่างมาก สายสัมพันธ์อันแข็งแกร่งกับสาธารณะ"
      - third_factor: POSEIDON
        meaning_th: "ทัศนคติทางจิตวิญญาณ-ความคิด สื่อวิญญาณผู้มีพรสวรรค์"

  - factors: [M, MERCURY]
    keyword_en: "One's own thinking. Monologues, soliloquies. To meditate. Considerations. Observations."
    entries:
      - third_factor: ARIES
        meaning_th: "การตัดสินเกี่ยวกับเจ้าของดวง ชื่อเสียง ความคิดเห็นของตนต่อสาธารณะ"
      - third_factor: SUN
        meaning_th: "ความคิดเกี่ยวกับกายและจิต การใช้ปรัชญา ความคล่องแคล่ว ความตื่นตัว"
      - third_factor: A
        meaning_th: "การสนทนา(หรือสนุกสนาน)เกี่ยวกับผู้อื่น การคิดถึงผู้อื่นหรือคิดร่วมกับพวกเขา"
      - third_factor: MOON
        meaning_th: "ความคิดเกี่ยวกับผู้หญิง ความคิดเห็นที่ขุ่นเคืองง่าย ความคิดที่คล่องแคล่วแต่เปลี่ยนแปลงง่าย"
      - third_factor: NODE
        meaning_th: "การคิดเรื่องเริ่มต้นสายสัมพันธ์ใหม่"
      - third_factor: VENUS
        meaning_th: "ทัศนคติต่อความรักและศิลปะ การคิดถึงคนรู้จัก"
      - third_factor: MARS
        meaning_th: "ความคิดเห็นของตนเองต่อการกระทำของตนเอง การจดจ่อกับงาน"
      - third_factor: JUPITER
        meaning_th: "ความปลาบปลื้ม ความร่าเริง การคิดถึงโชคและความสำเร็จ"
      - third_factor: SATURN
        meaning_th: "ความเศร้าโศก การสูญเสีย ความทุกข์ใจ ความคิดเรื่องการแยกจากและการเดินทาง เมื่อรวมกับดวงจันทร์จะขุ่นเคืองง่าย"
      - third_factor: URANUS
        meaning_th: "ความตื่นเต้น ความโกรธ ความคิดที่เกิดขึ้นเอง การได้รับแจ้งข่าวอย่างกะทันหัน"
      - third_factor: NEPTUNE
        meaning_th: "การปลดปล่อยตนเองจากความคิด การรับรู้ด้วยสัญชาตญาณ การไม่คิดอะไรเลย การมองข้ามจุดสำคัญ"
      - third_factor: PLUTO
        meaning_th: "การสรุปความคิด ความคิดที่เปลี่ยนแปลงอยู่เสมอ การคิดอย่างเป็นเหตุเป็นผล การคิดเรื่องการเปลี่ยนแปลง"
      - third_factor: CUPIDO
        meaning_th: "การใคร่ครวญเรื่องการแต่งงานหรือศิลปะ"
      - third_factor: HADES
        meaning_th: "การวางแผนสิ่งเลวร้าย การคิดรายละเอียด การใคร่ครวญเรื่องความชั่วร้าย"
      - third_factor: ZEUS
        meaning_th: "การควบคุมตนเอง การมีวินัยในตนเอง"
      - third_factor: KRONOS
        meaning_th: "การสังเกตเรื่องอำนาจรัฐหรือผู้นำ ความคิดที่มุ่งสู่สิ่งสูงส่งของชีวิต"
      - third_factor: APOLLON
        meaning_th: "การพูดได้หลายภาษา ช่างพูด ความคิดเชิงวิทยาศาสตร์ ความคิดด้านการค้า"
      - third_factor: ADMETOS
        meaning_th: "การมีและเก็บงำความคิดจริงจัง ความหม่นหมอง อุปสรรคที่เกิดจากความคิดของตนเอง"
      - third_factor: VULKANUS
        meaning_th: "พลังทางความคิดของตนเอง ความคิดมากมาย ความคิดที่รวดเร็ว การรับรู้ที่เฉียบคม"
      - third_factor: POSEIDON
        meaning_th: "ความคิดของตนเองอยู่ในระดับจิตวิญญาณ"

  - factors: [M, VENUS]
    keyword_en: "Affections, love experiences. One's own wishes. One's own attraction."
    entries:
      - third_factor: ARIES
        meaning_th: "ความนิยม ความชอบทั่วไป การส่งมอบความรักมากมายสู่สาธารณะ"
      - third_factor: SUN
        meaning_th: "ความรักตนเอง ความหลงตัวเอง"
      - third_factor: A
        meaning_th: "การตกหลุมรักคนอื่น ความชอบสถานที่ใดสถานที่หนึ่งเป็นพิเศษ การอยู่หรือโหยหาสถานที่นั้น เมื่อรวมกับ Sun+Admetos จะเป็นความโหยหาบ้าน"
      - third_factor: MOON
        meaning_th: "ความชื่นชอบผู้หญิง เมื่อรวมกับ Aries จะเป็นคน 'เจ้าชู้'"
      - third_factor: NODE
        meaning_th: "การมอบความรักให้ใครสักคน การรู้จักผู้คนได้ง่าย"
      - third_factor: MERCURY
        meaning_th: "การพูดถึงความงาม ความเพลิดเพลินในสิ่งสวยงาม"
      - third_factor: MARS
        meaning_th: "แรงดึงดูดหรือความปรารถนาทางเพศ"
      - third_factor: JUPITER
        meaning_th: "ความรู้สึกเป็นสุขในความรัก ความปรารถนาที่โชคดีเป็นจริง"
      - third_factor: SATURN
        meaning_th: "ความเศร้าจากการแยกจากในความรัก การโหยหาการแยกจาก อุปสรรคและความเศร้าในความรัก"
      - third_factor: URANUS
        meaning_th: "ความรักที่เกิดขึ้นฉับพลัน ความหลงใหล งานอดิเรกที่ชื่นชอบ"
      - third_factor: NEPTUNE
        meaning_th: "ความเศร้าในความรัก การสละ ความรักที่สิ้นหวัง ความรักที่ไม่มีอนาคต"
      - third_factor: PLUTO
        meaning_th: "ความรักในความเปลี่ยนแปลง การโหยหาและแสวงหาการเปลี่ยนแปลง"
      - third_factor: CUPIDO
        meaning_th: "ความโน้มเอียงสู่การแต่งงาน การหมั้นหมาย"
      - third_factor: HADES
        meaning_th: "ความชอบความรักต่ำทราม ความผิดศีลธรรม ความดึงดูดต่อสิ่งเหล่านี้"
      - third_factor: ZEUS
        meaning_th: "ความปรารถนามีบุตร ความต้องการเป็นที่ปรารถนา ผู้หว่านเมล็ด เมื่อรวมกับพฤหัสบดีคือความสำเร็จ"
      - third_factor: KRONOS
        meaning_th: "มุมมองแบบอุดมคติ ความรักต่อบิดา หรือบุคคลสำคัญ"
      - third_factor: APOLLON
        meaning_th: "ความโน้มเอียงสู่ศิลปะและวิทยาศาสตร์ ความสงบ การแสวงหามิตรภาพ"
      - third_factor: ADMETOS
        meaning_th: "ความรักของตนเองไม่ได้รับการตอบสนอง"
      - third_factor: VULKANUS
        meaning_th: "ความรักของตนเองเข้มข้นเปี่ยมด้วยแรงปรารถนา ความต้องการบางสิ่งอย่างส่วนตัว"
      - third_factor: POSEIDON
        meaning_th: "การเคารพบูชาบางสิ่ง ความโน้มเอียงทางศาสนา"

  - factors: [M, MARS]
    keyword_en: "One's own action. To make arrangements. To give orders. Agitated mind."
    entries:
      - third_factor: ARIES
        meaning_th: "การออกคำสั่งกับคนจำนวนมาก การเป็นผู้บัญชาการเหนือคนหมู่มาก"
      - third_factor: SUN
        meaning_th: "ผู้บริหารงานยุติธรรม ผู้คุมเรือนจำ การต่อต้าน เมื่อรวมกับเนปจูนคือการทำสิ่งใดไม่สำเร็จ"
      - third_factor: A
        meaning_th: "การออกคำสั่งกับผู้อื่น ความกระตือรือร้นร่วมกับผู้อื่น"
      - third_factor: MOON
        meaning_th: "การออกคำสั่งกับผู้หญิง การจัดการและใช้เวลาในแต่ละวัน"
      - third_factor: NODE
        meaning_th: "การมีอำนาจในการบังคับบัญชา"
      - third_factor: MERCURY
        meaning_th: "การออกคำสั่ง การกระทำอย่างหุนหันพลันแล่น ความรวดเร็ว"
      - third_factor: VENUS
        meaning_th: "การถูกกระตุ้นทางเพศ หรือกระตุ้นผู้อื่น"
      - third_factor: JUPITER
        meaning_th: "ความตั้งใจจะหมั้นหมาย ความปรารถนาทำให้ตนเองมีความสุข การติดต่อกันอย่างซื่อสัตย์"
      - third_factor: SATURN
        meaning_th: "การหันหลังให้ ความไม่แยแส การชะลอการกระทำ การรอคอย คำสั่งที่นำมาซึ่งความสูญเสีย"
      - third_factor: URANUS
        meaning_th: "ความเป็นไปได้ที่จะรุนแรง การแสดงออกอย่างระเบิด การกระทำที่ไม่ไตร่ตรอง ผลลัพธ์ที่ตื่นเต้น"
      - third_factor: NEPTUNE
        meaning_th: "ความไม่สามารถยืนหยัดเพื่อตนเอง การยอมจำนน การกระทำหลอกลวง จิตใจอ่อนแอ"
      - third_factor: PLUTO
        meaning_th: "ทำหลายอย่างพร้อมกัน นักจัดการ การสร้างสิ่งใดสิ่งหนึ่งขึ้นมา"
      - third_factor: CUPIDO
        meaning_th: "การตัดสินใจแต่งงาน ความพร้อมลงมือทำร่วมกับผู้อื่น"
      - third_factor: HADES
        meaning_th: "หัวหน้าแก๊งโจร ฆาตกร ความโศกเศร้าหรือกังวลเต็มที่ การทำสิ่งต่างๆ อย่างเลวร้าย"
      - third_factor: ZEUS
        meaning_th: "การจัดการที่ต้องทำทันที ไม่ยอมรับการคัดค้าน การผลักดันให้สำเร็จ"
      - third_factor: KRONOS
        meaning_th: "เจ้าหน้าที่รัฐ เช่น ตำรวจ การติดต่อที่มีเกียรติและสมศักดิ์ศรี"
      - third_factor: APOLLON
        meaning_th: "ทำงานด้านวิทยาศาสตร์หรือการค้า ในสเกลใหญ่ ความรอบคอบ"
      - third_factor: ADMETOS
        meaning_th: "ถูกบังคับให้อยู่นิ่งเฉย การกระทำของตนเองพบการต่อต้านรุนแรง การวุ่นวายกับซากปรักหักพัง"
      - third_factor: VULKANUS
        meaning_th: "พลังใจอันแข็งแกร่ง"
      - third_factor: POSEIDON
        meaning_th: "แนวทางจริยธรรมของตนเอง ความกระตือรือร้นทางปัญญา"

  - factors: [M, JUPITER]
    keyword_en: "Contentment, benevolence, general good will."
    # missing: HADES (not found in OCR)
    entries:
      - third_factor: ARIES
        meaning_th: "ความพึงพอใจโดยรวม สภาพจิตใจส่งผลต่อโลกกว้าง"
      - third_factor: SUN
        meaning_th: "ความผาสุกทางร่างกาย"
      - third_factor: A
        meaning_th: "ความพึงพอใจและความกลมกลืนกับผู้อื่น ความร่าเริงกับผู้อื่น ความปรารถนาทำให้ผู้อื่นมีความสุข"
      - third_factor: MOON
        meaning_th: "สายสัมพันธ์กลมกลืนกับผู้หญิง โชคผ่านผู้หญิง"
      - third_factor: NODE
        meaning_th: "สายสัมพันธ์กลมกลืน โชคที่ได้จากสายสัมพันธ์เหล่านั้น"
      - third_factor: MERCURY
        meaning_th: "ความพึงพอใจและความสงบทางความคิด"
      - third_factor: VENUS
        meaning_th: "ความรู้สึกเป็นสุขล้นเหลือผ่านความรัก"
      - third_factor: MARS
        meaning_th: "ความปีติจากการแสดงความรัก การหมั้นหมาย"
      - third_factor: SATURN
        meaning_th: "การจากลาโดยไม่เศร้า ความยินดีต่อการแยกจาก"
      - third_factor: URANUS
        meaning_th: "ความรู้สึกเป็นสุขอย่างฉับพลัน ความสุข โชค"
      - third_factor: NEPTUNE
        meaning_th: "ลางสังหรณ์ถึงการสูญเสีย ความผิดหวังในความสุขหรือโชค"
      - third_factor: PLUTO
        meaning_th: "ความยินดีที่ความสุขเพิ่มพูน พัฒนาการของสิ่งต่างๆ ความปีติต่อการเปลี่ยนแปลงที่โชคดี"
      - third_factor: CUPIDO
        meaning_th: "พึงพอใจในสภาพที่พอเพียง"
      - third_factor: ZEUS
        meaning_th: "ความสุขจากความสำเร็จ"
      - third_factor: KRONOS
