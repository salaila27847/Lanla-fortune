        meaning_th: "เป็นสุขและโชคดีกับคนไม่กี่คน พอใจกับสิ่งเล็กน้อย มีโชคเล็กน้อยพอประมาณ"
      - third_factor: SATURN
        meaning_th: "สายสัมพันธ์ที่พลัดพรากกับคนไม่กี่คน จุดจบของความพยายามที่ย่ำแย่"
      - third_factor: URANUS
