        meaning_th: "งานที่ทำเป็นช่วงๆลดลง งานที่แผ่ขยาย"
      - third_factor: URANUS
        meaning_th: "เศษซากและผ้าขาด ฉีกหรือขาดบางสิ่งอย่างฉับพลัน ศัตรูเกิดขึ้นฉับพลัน ขอบเขตงานถูกจำกัดฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "ความล้มเหลวเล็กน้อย ความปั่นป่วนเล็กน้อย อุปสรรคไม่สำคัญ"
      - third_factor: PLUTO
        meaning_th: "แผนถูกทิ้ง พัฒนาการที่หดตัวลง สภาพปัจจุบันพังทลายลงเปลี่ยนแปลงสิ่งต่างๆ ตลาดหุ้นแสดงแนวโน้มตกต่ำ"
      - third_factor: CUPIDO
        meaning_th: "การแต่งงานที่แตกหัก บริษัทใหญ่ล้มละลาย งานร่วมมือที่ไม่สำเร็จ"
      - third_factor: HADES
        meaning_th: "บริการเล็กน้อยระดับต่ำ ถูกลดตำแหน่งในงาน ถูกทำให้ต่ำต้อยโดยคนรับใช้"
      - third_factor: ZEUS
        meaning_th: "ทำลายสิ่งต่างๆ เป็นสาเหตุของการทำลาย ย้ายของเก่าออกไปเพื่อเปิดทางให้สิ่งใหม่ ต้องการเปิดที่ว่าง"
      - third_factor: KRONOS
        meaning_th: "กิจกรรมนำในวงแคบ เป็นอิสระในวงแคบ ในห้องหรือพื้นที่จำกัด กระทำการอย่างเป็นอิสระภายใต้สถานการณ์จำกัด อิสรภาพที่ถูกจำกัด"
      - third_factor: APOLLON
        meaning_th: "กิจกรรมที่น่าพอใจในวงแคบ ผู้เชี่ยวชาญเฉพาะทางวิทยาศาสตร์"
      - third_factor: POSEIDON
        meaning_th: "การยอมจำนนทางจิตใจ การกดขี่ทางจิตใจ การกดขี่เสรีภาพทางจิตวิญญาณ"

  - factors: [MARS, VULKANUS]
    keyword_en: "Great power. Mighty activity. Act of violence. Mechanical energies."
    entries:
      - third_factor: M
        meaning_th: "พัฒนาพลังงานอันยิ่งใหญ่ ทุ่มเทความพยายามอย่างมาก คาดหวังการต่อสู้ แสดงความคิด ให้และรับความรุนแรง"
      - third_factor: ARIES
        meaning_th: "พลังงานทั่วไป ความพยายาม การกระทำรุนแรง ความร้อนและความเย็นที่รุนแรงตามสภาพอากาศ"
      - third_factor: SUN
        meaning_th: "ชายที่มีพลังกาย กิจกรรมประจำวัน"
      - third_factor: A
        meaning_th: "กิจกรรมทางกาย กระตือรือร้นมากกับผู้อื่น มีความเป็นไปได้ที่จะกลายเป็นคนรุนแรง หรือได้รับความรุนแรงจากพวกเขา"
      - third_factor: MOON
        meaning_th: "บุคคลที่อาจกลายเป็นคนรุนแรง มีพละกำลังยิ่งใหญ่ คนฉลาดและกระตือรือร้น"
      - third_factor: NODE
        meaning_th: "เชื่อมโยงกับคนแข็งแรงทางกายและกระตือรือร้น"
      - third_factor: MERCURY
        meaning_th: "ความคิดเรื่องการต่อสู้หรือการรบ การถกเถียงอย่างเข้มข้น ตื่นเต้นมาก อารมณ์สงคราม"
      - third_factor: VENUS
        meaning_th: "ความรักทางเพศอันเร่าร้อน กิจกรรมอันกลมกลืนทรงพลังกับคนรู้จักสนิทหรือญาติ เตรียมพร้อมภายในสำหรับคนรู้จักและการกระทำ มิตรที่เป็นศิลปิน"
      - third_factor: JUPITER
        meaning_th: "กิจกรรมที่ร่าเริงและเปี่ยมความหวัง ทัศนคติมองโลกในแง่ดี ยินดีในความสำเร็จของตน"
      - third_factor: SATURN
        meaning_th: "การหยุดชะงักชั่วคราวของกิจกรรมอันทรงพลัง การหยุดชะงักชั่วคราวของการถูกจองจำ อุปสรรคเป็นช่วงๆ"
      - third_factor: URANUS
        meaning_th: "การแสดงพลังครั้งใหญ่ฉับพลัน การระเบิด พลังงานปรากฏขึ้นฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "พลังงานที่สูญเปล่าอย่างมาก พลังงานและกำลังที่สูญเสียไป"
      - third_factor: PLUTO
        meaning_th: "พัฒนาพลังของตนเอง พัฒนาแผนอันยิ่งใหญ่"
      - third_factor: CUPIDO
        meaning_th: "พัฒนาพลังงานอันยิ่งใหญ่ร่วมกับผู้อื่น รวมถึงในครอบครัวหรือศิลปะ"
      - third_factor: HADES
        meaning_th: "พลังสงคราม กำลังอันตราย เคลื่อนย้ายแผ่นดินด้วยพลังกล งานขุดลอก การทำลายพื้นผิวแผ่นดิน"
      - third_factor: ZEUS
        meaning_th: "พลังกลที่ถูกกำกับหรือกำหนดทิศทาง พลังกลที่ถูกควบคุม การบริหารและกำกับดูแลสิ่งเดียวกัน"
      - third_factor: KRONOS
        meaning_th: "การใช้พลังงานที่ถูกควบคุมและบริหารโดยรัฐ กฎหมายแรงงานภาษีรัฐ การใช้แรงงานโดยตรง"
      - third_factor: APOLLON
        meaning_th: "กิจกรรมที่ประสบความสำเร็จอย่างทรงพลังในด้านวิทยาศาสตร์หรือพาณิชย์"
      - third_factor: ADMETOS
        meaning_th: "หยุดหรือจบกิจกรรมอันทรงพลัง พลังงานถูกใช้จนหมด ความเหนื่อยล้า จุดจบของสงคราม"
      - third_factor: POSEIDON
        meaning_th: "พลังงานทางจิตใจ แนวคิดทางศีลธรรม แนวคิดเชิงจริยธรรม นำเสนอสิ่งเหล่านี้ด้วยพลังอันยิ่งใหญ่ ต่อสู้เพื่อประเด็นทางศีลธรรมหรือจริยธรรม"

  - factors: [MARS, POSEIDON]
    keyword_en: "Morals. Ethics. Mental or spiritual activity. Moral behavior."
    entries:
      - third_factor: M
        meaning_th: "พฤติกรรมส่วนตัวและทางศีลธรรม กิจกรรมทางจิตใจ ถูกเปิดรับอิทธิพลทางศีลธรรม เป็นตัวอย่างทางจริยธรรมหรือศีลธรรม"
      - third_factor: ARIES
        meaning_th: "กิจกรรมทางจิตใจหรือศีลธรรมโดยทั่วไป"
      - third_factor: SUN
        meaning_th: "พฤติกรรมทางศีลธรรมของชาย งานทางจิตใจประจำวัน งานทางจิตใจของวันนั้น"
      - third_factor: A
        meaning_th: "ทัศนคติทางศีลธรรมของผู้อื่น มีอิทธิพลต่อผู้อื่นทางศีลธรรม หรือได้รับอิทธิพลเช่นนั้น"
      - third_factor: MOON
        meaning_th: "สาธารณชนมีอิทธิพลต่อมุมมองทางจิตใจหรือศีลธรรม ความขัดแย้งทางจริยธรรมภายในตนเอง"
      - third_factor: NODE
        meaning_th: "สายสัมพันธ์ที่เกี่ยวกับจริยธรรมหรือเรื่องจิตใจ"
      - third_factor: MERCURY
        meaning_th: "การนินทาเรื่องจริยธรรมและความสำคัญคุณค่าของมัน"
      - third_factor: VENUS
        meaning_th: "การรู้จักใกล้ชิดกับผู้อื่นที่มีมุมมองทางจิตใจหรือศีลธรรมคล้ายกัน"
      - third_factor: JUPITER
        meaning_th: "ความสุขผ่านกิจกรรมทางจิตใจของตนเอง เป็นสุขเพราะการกระทำที่ถูกต้อง ศีลธรรมของตนเอง"
      - third_factor: SATURN
        meaning_th: "ไม่ประสบความสำเร็จในการอบรมเลี้ยงดู การศึกษาถูกขัดจังหวะ อุปสรรคในเส้นทางพฤติกรรมทางจิตใจหรือศีลธรรม"
      - third_factor: URANUS
        meaning_th: "การกระทำที่น่าประหลาดใจซึ่งนำมาซึ่งความชัดเจนในพฤติกรรมทางศีลธรรม"
      - third_factor: NEPTUNE
        meaning_th: "กิจกรรมทางจิตใจหรือจิตวิญญาณที่ไม่สำเร็จ ศีลธรรมที่น่าสงสัย ศีลธรรมจอมปลอม"
      - third_factor: PLUTO
        meaning_th: "เริ่มต้น วางแผน พัฒนากิจกรรมทางจิตใจหรือศีลธรรม การเปลี่ยนแปลงในศีลธรรม"
      - third_factor: CUPIDO
        meaning_th: "การแต่งงาน คนรู้จักที่เกิดจากทัศนคติคล้ายกัน ทำงาน มุ่งมั่นเพื่ออุดมการณ์"
      - third_factor: HADES
        meaning_th: "การกระทำที่ต่ำทรามทางศีลธรรม ขาดจริยธรรมหรือศีลธรรม"
      - third_factor: ZEUS
        meaning_th: "ผู้อื่นตัดสินใจแทนคุณ หรือคุณตัดสินใจแทนพวกเขา นำในการต่อสู้เชิงอุดมการณ์"
      - third_factor: KRONOS
        meaning_th: "เป็นผู้นำเพราะกิจกรรมทางจิตใจ โดดเด่นด้านศีลธรรม ศีลธรรมของรัฐ"
      - third_factor: APOLLON
        meaning_th: "รากฐานทางปรัชญา ศีลธรรม และจริยธรรมในการทำงานร่วมกับผู้อื่น"
      - third_factor: ADMETOS
        meaning_th: "กิจกรรมทางจิตใจกับคนไม่กี่คน วงแคบที่มีมุมมองเฉพาะ หลักสูตรสำหรับผู้เข้าร่วมจำนวนน้อย"
      - third_factor: VULKANUS
        meaning_th: "กิจกรรมทางจิตใจอันทรงพลัง อำนาจของหลักคำสอน จริยธรรม หรือประมวลศีลธรรมหนึ่ง"
  - factors: [JUPITER, SATURN]
    keyword_en: "Happiness and separation. Change of residence. Buildings. Inconstant success. 'Ripe Old Age'."
    entries:
      - third_factor: M
        meaning_th: "กังวลจากความสูญเสีย"
      - third_factor: ARIES
        meaning_th: "การพลัดพรากที่ได้รับความช่วยเหลือจากโชคดี การเปลี่ยนสถานที่ อสังหาริมทรัพย์"
      - third_factor: SUN
        meaning_th: "การล้มเลิกการหมั้นหรือการแต่งงาน ชายโสด เท่ากับอาทิตย์หรือมิเดียม คือบ้าน"
      - third_factor: A
        meaning_th: "พลัดพรากจากบุคคล เปลี่ยนที่อยู่อาศัย"
      - third_factor: MOON
        meaning_th: "การพลัดพรากอันโชคดีจากผู้หญิง จากบ้านหนึ่งสู่อีกบ้าน เข้าออก การพลัดพรากอันโชคดีจากผู้อื่น อาคารสาธารณะ"
      - third_factor: NODE
        meaning_th: "การพลัดพรากของการรวมกันที่เป็นสุข หรือการพลัดพรากที่เป็นสุขของการรวมกัน ผู้อาศัยร่วม"
      - third_factor: MERCURY
        meaning_th: "การจากลาอย่างร่าเริง หาบ้าน ทำความคิดให้เป็นจริง"
      - third_factor: VENUS
        meaning_th: "การแตกหักของความสุขแห่งความรัก การล้มเลิกการหมั้น ความกลมกลืนชั่วคราว ความสุขแห่งความรักที่กำลังสุกงอม"
      - third_factor: MARS
        meaning_th: "การหมั้นที่ตามด้วยการพลัดพราก กิจกรรมอันเป็นสุขระยะสั้น ผลของกิจกรรมปรากฏภายหลังเท่านั้น"
      - third_factor: URANUS
        meaning_th: "การพลัดพรากฉับพลันที่ได้รับความช่วยเหลือจากโชคดี ความสูญเสียทางวัตถุฉับพลันหรืออาคารเสียหาย มาถึงการตัดสินใจ"
      - third_factor: NEPTUNE
        meaning_th: "การพลัดพรากที่มุ่งร้าย ความสูญเสียเงินจากการฉ้อโกง การทำลายอาคาร เรื่องหนึ่งใช้เวลานานมากในการสุกงอม เวลาแห่งผลลัพธ์อยู่ในอนาคตอันไกล รอคอยนานให้สิ่งต่างๆสุกงอม เลื่อนการตัดสินใจ"
      - third_factor: PLUTO
        meaning_th: "เรื่องที่สำเร็จอย่างรวดเร็ว"
      - third_factor: CUPIDO
        meaning_th: "การยุติการแต่งงานด้วยข้อตกลง หลายคนอยู่ใต้หลังคาเดียวกัน ครอบครัวเริ่มแยกจากกัน จุดเริ่มต้นของการรวมกันที่จะได้รับการยอมรับช้าและในภายหลัง"
      - third_factor: HADES
        meaning_th: "พอใจกับสิ่งเล็กน้อย โชคร้ายในหรือกับอาคาร ผลของความผิดพลาดในอดีตปรากฏขึ้น"
      - third_factor: ZEUS
        meaning_th: "รับมรดก เตรียมการให้บิดามารดาในการแลกที่ดิน อาคารไฟไหม้ การหยุดชะงักของกิจกรรมสร้างสรรค์ เลื่อนการเสร็จสิ้นออกไป"
      - third_factor: KRONOS
        meaning_th: "ที่ดินได้รับการจัดการผ่านศาลพินัยกรรม อาคารรัฐบาล ถูกแยกโดยผู้มีอำนาจเป็นเวลานาน เท่ากับอาริส คืออาคารรัฐบาล เท่ากับจันทร์ คืออาคารราชการ"
      - third_factor: APOLLON
        meaning_th: "การพลัดพรากที่เป็นสุขของหลายคนหรือสำหรับหลายคน"
      - third_factor: ADMETOS
        meaning_th: "รวมตัวกับคนไม่กี่คนในความสงบสุขท่ามกลางพื้นที่แออัดจำกัด"
      - third_factor: VULKANUS
        meaning_th: "อาคารเก็บซ่อน อาคารที่มีการเฝ้าระวัง คลังอาวุธ"
      - third_factor: POSEIDON
        meaning_th: "การสุกงอมทางจิตใจหรือจิตวิญญาณ"

  - factors: [JUPITER, URANUS]
    keyword_en: "Sudden luck; or misfortune if Jupiter is posited in poor pictures."
