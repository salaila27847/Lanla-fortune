      - third_factor: SATURN
        meaning_th: "คนจรจัด คนพเนจร ถูกรังเกียจ สูญเสียเพราะนักต้มตุ๋นหรือการใส่ร้าย"
      - third_factor: URANUS
        meaning_th: "ความคิดเรื่องฆาตกรรมหรือการฆ่าคน ความคิดเศร้าหมองฉับพลัน"
