        meaning_th: "โน้มเอียงสู่ความโกรธฉับพลัน การกระทำที่ทำสำเร็จอย่างฉับพลัน คลุ้มคลั่ง"
      - third_factor: NEPTUNE
        meaning_th: "กระทำผิดพลาด ถูกหลอกลวง ตื่นเต้นกับเรื่องไม่มีสาระ ความปรารถนาที่จะทำลาย"
      - third_factor: PLUTO
        meaning_th: "แสดงพลังใจในหลายสาขา กระทำตามแผนที่วางไว้อย่างดี"
      - third_factor: CUPIDO
        meaning_th: "ถกเถียงเรื่องศิลปะและการแต่งงาน การกระทำอันทรงพลังขององค์กร"
      - third_factor: HADES
        meaning_th: "พร้อมสำหรับการกระทำผิด ร้องขอความช่วยเหลือ เท่ากับฮาเดส/เสาร์ คือกลายเป็นฆาตกรจากผลของการทะเลาะ"
      - third_factor: ZEUS
        meaning_th: "ความโกรธที่นำไปสู่ความรุนแรง"
      - third_factor: KRONOS
        meaning_th: "การกระทำที่ถูกสั่งโดยผู้มีอำนาจ ผู้เผด็จการ คำสั่งของรัฐบาล"
      - third_factor: APOLLON
        meaning_th: "ความพยายามเชิงวิทยาศาสตร์ที่ประสบความสำเร็จ"
      - third_factor: ADMETOS
        meaning_th: "กิจกรรมถูกระงับหรือขัดขวาง ไม่สามารถกระทำการได้"
      - third_factor: VULKANUS
        meaning_th: "การกระทำที่รีบร้อนและรวดเร็ว คิดบางสิ่งได้เร็ว"
      - third_factor: POSEIDON
        meaning_th: "การกระทำที่รีบร้อนเกินไปจนถูกวิพากษ์วิจารณ์ด้านศีลธรรม ผิดขั้นตอนด้านพฤติกรรม"

  - factors: [MERCURY, JUPITER]
    keyword_en: "Talent for speech. Fluent speech. Cheerful mood. Loquacity."
    entries:
      - third_factor: M
        meaning_th: "อยู่ในอารมณ์เป็นสุขและพึงพอใจ การมองโลกในแง่ดี"
      - third_factor: ARIES
        meaning_th: "ความรื่นเริง บทสนทนาที่มีชีวิตชีวา"
      - third_factor: SUN
        meaning_th: "อารมณ์เป็นสุข ร่างกายมีชีวิตชีวาและคล่องแคล่ว"
      - third_factor: A
        meaning_th: "ความบันเทิงและบทสนทนาที่เป็นสุขและร่าเริง"
      - third_factor: MOON
        meaning_th: "ผู้หญิงช่างพูด"
      - third_factor: NODE
        meaning_th: "พิธีกร หัวหน้าเชียร์ คิดถึงสายสัมพันธ์อันเป็นสุข"
      - third_factor: VENUS
        meaning_th: "บทสนทนาของคู่รัก การหยอกล้อ บทสนทนาที่น่ายินดี ความคิดเห็นตรงกัน"
      - third_factor: MARS
        meaning_th: "กิจกรรมที่มาพร้อมการพูดคุยร่าเริง เท่ากับอังคาร คือนักพูด นักปราศรัย เท่ากับมิเดียม คือพ่อค้า มาถึงการตัดสินใจ"
      - third_factor: SATURN
        meaning_th: "อำลาอย่างเต็มใจ เดินทางปลอดภัย"
      - third_factor: URANUS
        meaning_th: "นักพูด โต้ตอบไว นักปลุกระดม เท่ากับพลูโต คือปรับความคิดใหม่อย่างฉับพลัน คล่องแคล่วทางความคิดอย่างมาก ตระหนักรู้ฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "ช่างจินตนาการ พูดคล่อง นักปราศรัย พยายามชักจูง คาดเดา"
      - third_factor: PLUTO
        meaning_th: "ตระหนักถึงการเปลี่ยนแปลงอันโชคดี"
      - third_factor: CUPIDO
        meaning_th: "คำกล่าวในงานแต่งงาน ความร่าเริงในงานแต่งงาน"
      - third_factor: HADES
        meaning_th: "เรื่องตลกลามก ความบันเทิงต่ำทรามและสนุกสนาน ตื่นเต้นกับความโหดร้าย"
      - third_factor: ZEUS
        meaning_th: "ตัวตลกที่พาผู้ฟังไปด้วยคำพูดและท่าทาง"
      - third_factor: KRONOS
        meaning_th: "การเฉลิมฉลองในราชสำนัก ผู้ปกครองที่ช่างพูด การเฉลิมฉลองระดับชาติ ศิลปินด้านถ้อยคำ"
      - third_factor: APOLLON
        meaning_th: "ความสำเร็จผ่านความรู้ด้านภาษา ความบันเทิงอันโชคดีกับคนจำนวนมาก"
      - third_factor: ADMETOS
        meaning_th: "โชคผ่านการคิดลึกซึ้ง บทสนทนาที่เงียบสงบและน่ายินดีกับมิตรไม่กี่คน"
      - third_factor: VULKANUS
        meaning_th: "ความคิดเชิงสร้างสรรค์และมองโลกในแง่ดี"
      - third_factor: POSEIDON
        meaning_th: "ความสุขผ่านบทสนทนาเชิงจิตวิญญาณ ถกเถียงความคิดกับคนรอบคอบและมีปรัชญา"

  - factors: [MERCURY, SATURN]
    keyword_en: "Thoughts of separation. Travel. Parting. Logic. Philosophical thinking. Competence to form an opinion, to pass judgement. To ponder. Deliberation."
    entries:
      - third_factor: M
        meaning_th: "ชอบการเดินทาง ไม่ตั้งหลักแหล่ง ไม่แน่นอน มีแนวโน้มเชิงปรัชญา"
      - third_factor: ARIES
        meaning_th: "ท่องเที่ยวไปมา การเดินทาง การอพยพของผู้คน การย้ายสถานที่ การเคลื่อนย้าย"
      - third_factor: SUN
        meaning_th: "บุคคลที่กำลังจากไป แขกที่ไม่สงบนิ่ง ไม่อยู่ที่ใดนาน ท่องเที่ยวไปมา"
      - third_factor: A
        meaning_th: "อำลา ย้ายที่ เดินทาง ท่องเที่ยว"
      - third_factor: MOON
        meaning_th: "ผู้หญิงที่กำลังอำลา แขกหญิงที่ไม่สงบนิ่ง กำลังเดินทาง ขับรถเร็ว เพื่อนร่วมเดินทาง"
      - third_factor: NODE
        meaning_th: "เพื่อนร่วมเดินทาง การเตรียมตัวเดินทาง"
      - third_factor: VENUS
        meaning_th: "กลายเป็นคนไม่ซื่อสัตย์ เสนอหย่าร้าง การพลัดพรากจากหรือผ่านคนรู้จัก มิตรใหม่ที่ตนแยกจาก"
      - third_factor: MARS
        meaning_th: "พลัดพรากเพราะทะเลาะหรือขัดแย้ง การเดินทางที่ต้องทำ เท่ากับอังคาร/เสาร์ คือการเดินทางสู่ความตาย"
      - third_factor: JUPITER
        meaning_th: "ทริปพักร้อน ทริปเพื่อความเพลิดเพลิน วันที่โชคดีและเป็นสุข"
      - third_factor: URANUS
        meaning_th: "การจากไปอย่างฉับพลัน แยกทางกันฉับพลัน เริ่มความขัดแย้ง เท่ากับอังคาร/เสาร์ คือการเดินทางสู่ความตาย"
      - third_factor: NEPTUNE
        meaning_th: "คิดถึงบ้าน เศร้าสร้อย ทริปด้วยเครื่องบิน ทริปที่ไร้ความหวัง การเดินเรือ เท่ากับพลูโต คือกำลังค้นหาบางสิ่ง เท่ากับพฤหัสบดี คือพบมัน"
      - third_factor: PLUTO
        meaning_th: "ความเศร้าของการอำลา ไม่แน่ใจในอนาคตอันใกล้ แตกหัก ย้ายออกไป"
      - third_factor: CUPIDO
        meaning_th: "ทริปฮันนีมูน ทัวร์ของศิลปิน การเดินทางของครอบครัว เดินทางกับผู้อื่น"
      - third_factor: HADES
        meaning_th: "การเดินทางสู่การถูกคุมขัง เท่ากับอาเซนแดนต์ คือทริปที่ไม่เป็นสุข ความไม่น่ายินดีขณะเดินทาง ความเป็นศัตรูและการใส่ร้ายในเรื่องนั้น"
      - third_factor: ZEUS
        meaning_th: "การเดินทางที่ถูกบังคับ ถูกขับไล่ สัญญาณเตือนไฟไหม้ เท่ากับจันทร์/เนปจูน คือถูกเรียกไปดับไฟ"
      - third_factor: KRONOS
        meaning_th: "การเดินทางที่เกิดจากผู้มีอำนาจ หรือการเดินทางครั้งใหญ่ ได้รับเงินบำนาญ"
      - third_factor: APOLLON
        meaning_th: "ความคิดเชิงวิทยาศาสตร์อย่างมีเหตุผล ความคิดเชิงการศึกษา หยุดการสอน ความคิดเรื่องการพลัดพรากมากมาย สนทนาเรื่องการพลัดพราก"
      - third_factor: ADMETOS
        meaning_th: "ความคิดเชิงปรัชญาที่ลึกซึ้งมาก"
      - third_factor: VULKANUS
        meaning_th: "ความพยายามทุกอย่าง ความคิดที่ตึงเครียด การเดินทางไกลอย่างรวดเร็ว"
      - third_factor: POSEIDON
        meaning_th: "แนวคิดด้านการศึกษาที่นำไปสู่การเดินทาง ตรรกะในความคิด แยกความคิดออกจากสิ่งเชิงจิตใจหรือจิตวิญญาณ"

  - factors: [MERCURY, URANUS]
    keyword_en: "Telegrams. Practical thinking. Logic. Original, revolutionary thoughts. Good mathematician. Rhyme."
    entries:
      - third_factor: M
        meaning_th: "พรสวรรค์ด้านเทคนิคหรือคณิตศาสตร์ มีความคิดริเริ่ม คิดอย่างกระตือรือร้น"
      - third_factor: ARIES
        meaning_th: "ข่าวสารทั่วไป"
      - third_factor: SUN
        meaning_th: "ร่างกายกระทำการรวดเร็ว คล่องแคล่ว ผู้ส่งสาร ไวต่อการตอบสนอง"
      - third_factor: A
        meaning_th: "ถูกถามอย่างฉับพลันโดยผู้อื่น"
      - third_factor: MOON
        meaning_th: "การแลกเปลี่ยนความคิดที่รวดเร็ว ผู้หญิงมีชีวิตชีวา ผู้หญิงที่เอาจริงเอาจัง คิดเชิงคณิตศาสตร์ ทฤษฎีและการปฏิบัติผสานกันดี เท่ากับซุส คือสัญญาณเตือนไฟไหม้"
      - third_factor: NODE
        meaning_th: "สายสัมพันธ์ความคิดฉับพลัน การสื่อสารฉับพลัน"
      - third_factor: VENUS
        meaning_th: "ความรักฉับพลัน สัมผัสด้านจังหวะหรือความงามเชิงศิลปะ การร้องเพลง ข่าวดีฉับพลัน ข่าวฉับพลันจากมิตร ความตื่นเต้นกับหรือผ่านคนรู้จัก"
      - third_factor: MARS
        meaning_th: "การกระทำที่ทำสำเร็จอย่างฉับพลัน ยุยงสู่ความรุนแรง เท่ากับฮาเดส คือเสียงไซเรนเตือนภัย ความตกใจที่ส่งผลต่อระบบย่อยอาหาร เท่ากับศุกร์ คือการร้องเพลง"
      - third_factor: JUPITER
        meaning_th: "นักพูด โต้ตอบไว ความรื่นเริงฉับพลัน ข่าวดี ปรารถนากระทำการรวดเร็ว"
      - third_factor: SATURN
        meaning_th: "คำเตือนฉับพลันให้หลบหนี ให้เดินทาง ช่วยตัวเองให้ดีที่สุด ข่าวร้ายฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "ความคิดเชิงตรรกะที่เกี่ยวกับอภิปรัชญา คำร้องขอที่ไร้ผล"
      - third_factor: PLUTO
        meaning_th: "พร้อมเสมอ ปรับความคิดของตนเองใหม่ทันที"
      - third_factor: CUPIDO
        meaning_th: "โทรเลขงานแต่งงาน ศิลปะเชิงเทคนิค ศิลปะการแสดง เท่ากับศุกร์ คือจังหวะในศิลปะ"
      - third_factor: HADES
        meaning_th: "ผู้ยุยงให้ปล้นและฆ่า ข่าวสารแห่งความชั่วร้าย เส้นประสาทระบบย่อยอาหาร เท่ากับอังคาร/เสาร์ คือโทษประหารชีวิต"
      - third_factor: ZEUS
        meaning_th: "ระเบิดด้วยวัตถุระเบิด การจัดเตรียมฉับพลัน สัญญาณเตือนไฟไหม้ สงครามฉับพลัน"
      - third_factor: KRONOS
        meaning_th: "คำสั่งฉับพลันจากผู้ปกครอง โทรเลขราชการ เท่ากับฮาเดส คือโทษที่รุนแรง"
      - third_factor: APOLLON
        meaning_th: "คนจำนวนมากต้องการรับข่าวฉับพลัน โทรเลข ข่าวฉับพลันมากมาย"
      - third_factor: ADMETOS
        meaning_th: "รู้สึกหดหู่มาก ประสบภัยพิบัติ อยู่ภายใต้ความประทับใจของเหตุการณ์เศร้าเป็นเวลาหนึ่ง"
      - third_factor: VULKANUS
        meaning_th: "ข่าวฉับพลันที่สร้างความตื่นเต้นครั้งใหญ่ ความคิดรวดเร็ว"
      - third_factor: POSEIDON
        meaning_th: "ความคิดใหม่ริเริ่ม ความคิดใหม่ฉับพลัน ความชัดเจนของแนวทางความคิดฉับพลัน ตระหนักถึงความจริงอย่างฉับพลัน"

  - factors: [MERCURY, NEPTUNE]
    keyword_en: "Conceit. Lies. Imagination. Confusion. Want of clearness. Uncertainty."
    # missing: NODE, PLUTO, CUPIDO (บรรทัด OCR หายไประหว่างช่วงต่างๆ)
    entries:
      - third_factor: M
        meaning_th: "โน้มเอียงสู่การพูดไม่จริง เปี่ยมจินตนาการและสัญชาตญาณ"
      - third_factor: ARIES
        meaning_th: "ความรับรู้ไว เรื่องไร้สาระ"
      - third_factor: SUN
        meaning_th: "ความรับรู้ต่อความคิด นักเขียน"
      - third_factor: A
        meaning_th: "ถูกคนรู้จักหลอกลวง ถูกเอาชนะด้วยเล่ห์เหลี่ยม เท่ากับซุส คือถูกยิงตายด้วยเล่ห์กล"
      - third_factor: MOON
        meaning_th: "จับความหมายได้ง่ายและวาดภาพด้วยคำพูดได้ดี"
      - third_factor: VENUS
        meaning_th: "ความฝันแห่งรัก บทกวีแห่งรัก การบูชา เท่ากับมิเดียม คือแม่เหล็กจิต คนรู้จักผิวเผิน"
      - third_factor: MARS
        meaning_th: "ทำให้ความคิดสร้างสรรค์เป็นจริง อัจฉริยภาพ"
      - third_factor: JUPITER
        meaning_th: "จินตนาการที่โชคดี สร้างวิมานในอากาศ"
      - third_factor: SATURN
        meaning_th: "สภาพจิตใจป่วย(เจ็บป่วย) คลั่งสะสมของ ใช้ผลงานทางความคิดของผู้อื่น เท่ากับพฤหัสบดี คือประสบความสำเร็จ"
      - third_factor: URANUS
        meaning_th: "วิศวกรโยธาผู้มีพรสวรรค์ เท่ากับอาทิตย์ คือนักประดิษฐ์ เท่ากับพุธ คือโรคลมชัก เท่ากับอังคาร คือกระทำการทรยศฉับพลัน เท่ากับอังคาร/เสาร์ คือส่งผลถึงความตาย"
      - third_factor: HADES
        meaning_th: "วางแผนกลอุบายสกปรก ความคิดคลุมเครือก่อให้เกิดอุปสรรคและความไม่น่ายินดี"
      - third_factor: ZEUS
        meaning_th: "ปัญหามากมายที่ไม่ตระหนักรู้ ความคิดสร้างสรรค์ที่ไม่มีจุดจบ"
      - third_factor: KRONOS
