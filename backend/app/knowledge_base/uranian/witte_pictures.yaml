  - factors: [NODE, POSEIDON]
    keyword_en: "Mental connections. Spiritual unions."
    entries:
      - third_factor: M
        meaning_th: "สายสัมพันธ์ทางจิตใจส่งผลต่อเจ้าของดวง เจ้าของดวงมีและแสวงหาสายสัมพันธ์ทางจิตใจและจิตวิญญาณ"
      - third_factor: ARIES
        meaning_th: "สภาพจิตใจโดยทั่วไป ความคิดเห็นโดยทั่วไป มุมมองโลก ความสัมพันธ์เชิงศาสนา"
      - third_factor: SUN
        meaning_th: "อยู่ร่วมกับผู้อื่นที่มีจิตใจหรือความคิดแบบเดียวกัน สัมผัสทางกายกับคนที่มีระดับจิตใจสูง"
      - third_factor: A
        meaning_th: "เข้าร่วมทางจิตวิญญาณกับผู้อื่น แก้ปัญหาในธรรมชาติเช่นนั้น"
      - third_factor: MOON
        meaning_th: "เชื่อมโยงกับคนทั่วไปที่มีทัศนคติทางจิตใจเดียวกัน"
      - third_factor: MERCURY
        meaning_th: "สายสัมพันธ์ทางจิตใจผ่านการพูด การติดต่อจดหมาย เชื่อมโยงกับสิ่งเหล่านั้น"
      - third_factor: VENUS
        meaning_th: "สายสัมพันธ์อันกลมกลืนทางจิตวิญญาณ ผูกพันกับคนศาสนาเดียวกัน"
      - third_factor: MARS
        meaning_th: "ได้สายสัมพันธ์ผ่านความสำเร็จทางจิตใจของตนเอง"
      - third_factor: JUPITER
        meaning_th: "สอดคล้องกับคนมีเหตุผลและรอบคอบ เชื่อมโยงกับคนมีการศึกษา"
      - third_factor: SATURN
        meaning_th: "ต้องจัดการกับนักการศึกษาและลูกศิษย์ สายสัมพันธ์กับความคิดที่ยังไม่เติบโต"
      - third_factor: URANUS
        meaning_th: "เชื่อมโยงทางจิตใจกับผู้อื่นในแบบที่น่าประหลาดใจ ความชัดเจนฉับพลันในความสัมพันธ์กับผู้อื่น"
      - third_factor: NEPTUNE
        meaning_th: "ความสัมพันธ์กับคนมีจิตใจสูง การล่มสลายของความสัมพันธ์ปัจจุบัน"
      - third_factor: PLUTO
        meaning_th: "การแปรสภาพและการเปลี่ยนแปลงในความสัมพันธ์ทางจิตใจ"
      - third_factor: CUPIDO
        meaning_th: "สายสัมพันธ์ผ่านสมาคมทางจิตใจ ลัทธิ ฯลฯ สมาชิกของลัทธิ"
      - third_factor: HADES
        meaning_th: "ถูกผูกมัดกับคนที่จิตใจต่ำกว่าเจ้าของดวงมาก"
      - third_factor: ZEUS
        meaning_th: "โดดเด่นในสายสัมพันธ์ทางจิตใจ ครองความเป็นผู้นำทางความคิด"
      - third_factor: KRONOS
        meaning_th: "สายสัมพันธ์กับคนที่เหนือกว่าทางจิตใจ ปล่อยให้ผู้อื่นมีอิทธิพลต่อตนเอง ถูกจัดว่าด้อยกว่าทางจิตใจ"
      - third_factor: APOLLON
        meaning_th: "เชื่อมโยงทางจิตใจกับคนจำนวนมาก สายสัมพันธ์ที่เกิดจากมุมมองคล้ายกันเรื่องกิจการโลก"
      - third_factor: ADMETOS
        meaning_th: "เชื่อมโยงกับคนมีวัฒนธรรม"
      - third_factor: VULKANUS
        meaning_th: "อิทธิพลจากหรือผ่านสายสัมพันธ์ทางจิตใจ ถูกสังเกตเห็นในสายสัมพันธ์ทางจิตใจผ่านความกระตือรือร้นและความตื่นตัว"
