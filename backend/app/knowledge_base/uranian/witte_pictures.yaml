        meaning_th: "รักษาสายสัมพันธ์ทางสังคมไว้น้อย ความโดดเดี่ยวในสายสัมพันธ์กับคนไม่กี่คน"
      - third_factor: HADES
        meaning_th: "ทนทุกข์ขาดปัจจัยยังชีพร่วมกับคนไม่กี่คน"
      - third_factor: ZEUS
        meaning_th: "เริ่มงานกับคนไม่กี่คน จุดเริ่มต้นของงานที่ยากลำบากกับผู้อื่น"
