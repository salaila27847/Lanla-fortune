      - third_factor: NEPTUNE
        meaning_th: "การล่มสลายของสายสัมพันธ์กับคนไม่กี่คน"
      - third_factor: PLUTO
        meaning_th: "การเปลี่ยนแปลงพื้นฐานในสายสัมพันธ์กับคนไม่กี่คน"
