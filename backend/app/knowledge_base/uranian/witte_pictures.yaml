        meaning_th: "กฎหมาย พระราชกฤษฎีกา คำสั่ง"
      - third_factor: SUN
        meaning_th: "คำสั่งประจำวัน ความยุติธรรม(ผู้พิพากษา) ผู้บังคับบัญชาโดยตรง ถูกตัดสินโทษ"
      - third_factor: A
