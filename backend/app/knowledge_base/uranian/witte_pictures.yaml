      - third_factor: NEPTUNE
        meaning_th: "นิยายศิลปะ นิทาน แผนร่วมที่ไม่สำเร็จ"
      - third_factor: PLUTO
        meaning_th: "สนทนาเรื่องบรรพบุรุษ มรดก ลูกหลาน"
      - third_factor: HADES
        meaning_th: "ศิลปะโบราณ ความหยาบคายในบทกวี บทสนทนาร่วมเรื่องอดีต ของเก่า"
      - third_factor: ZEUS
