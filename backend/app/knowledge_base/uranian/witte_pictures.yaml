        meaning_th: "ความคิดเรื่องการหมั้น สร้างบางสิ่ง เพิ่มพูนครอบครัว การกระทำอันโชคดีที่เกี่ยวข้อง การเกิดของบุตรชาย"
      - third_factor: VENUS
        meaning_th: "ความสุขแห่งความรักที่พ่วงด้วยการมีเพศสัมพันธ์ การตั้งครรภ์ การเกิดของบุตรสาว งานที่ประสบความสำเร็จและน่ายินดี"
      - third_factor: SATURN
        meaning_th: "การล้มเลิกการหมั้น การพลัดพรากความสัมพันธ์ การคลอดหรือสิ้นสุดการตั้งครรภ์ ผลไม้ที่สุกงอม สำเร็จกิจกรรมหนึ่ง การตัดสินใจที่ไม่น่ายินดีแต่ได้ผลดี"
      - third_factor: URANUS
        meaning_th: "การหมั้นฉับพลัน การรบกวนการตั้งครรภ์ การแท้งบุตร จุดเริ่มต้นของกิจกรรมที่เป็นสุขอย่างน่าประหลาดใจ กิจกรรมตื่นเต้นที่ประสบความสำเร็จ"
      - third_factor: NEPTUNE
        meaning_th: "การปฏิเสธการหมั้น การล้มเลิกข้อตกลงหรือความเข้าใจ ความสัมพันธ์ที่สิ้นหวัง ความอ่อนแอทางเพศ การแท้งบุตร เจตนาที่ไม่สำเร็จ จุดจบของกิจกรรมที่เป็นสุข"
      - third_factor: PLUTO
        meaning_th: "จุดเริ่มต้นของกิจกรรมอันโชคดี การสร้างที่สำเร็จ คู่รักหรือคู่แข่งหลายคน"
      - third_factor: CUPIDO
        meaning_th: "การหมั้นที่ตามด้วยการแต่งงาน กิจกรรมอันเป็นสุขที่นำไปสู่การกระทำที่ยั่งยืน กิจกรรมศิลปะที่ประสบความสำเร็จ"
      - third_factor: HADES
        meaning_th: "การหมั้นพร้อมความยากลำบาก การแท้งบุตร ผลลัพธ์หรือความสำเร็จของงานที่แย่หรือปานกลาง ผลไม้ที่ไม่ได้เก็บเกี่ยว"
      - third_factor: ZEUS
        meaning_th: "การหมั้นโดยถูกบังคับ(ทางศีลธรรม) บังคับให้จ่ายค่าตอบแทนกิจกรรมหรืองาน เท่ากับเสาร์ คือไร้บุตร ประสบความสำเร็จผ่านการรู้ความสามารถและผลงานของตน"
      - third_factor: KRONOS
        meaning_th: "ผ่านกิจกรรมอันเป็นสุขสู่ความเป็นอิสระ ความเป็นผู้นำผ่านกิจกรรมอันโชคดีของตน ผลดี ผลงานที่ดี การตัดสินโดยผู้มีอำนาจ"
      - third_factor: APOLLON
        meaning_th: "งานที่ประสบความสำเร็จในวิทยาศาสตร์และการค้า ผลมากมาย การเกิดมากมาย"
      - third_factor: ADMETOS
        meaning_th: "การหยุดชะงักของกิจกรรมอันโชคดี การแท้งบุตร อัตราการเกิดลดลง ผลแย่"
      - third_factor: VULKANUS
        meaning_th: "อำนาจผ่านความสำเร็จ ถูกบังคับ การมองโลกในแง่ดีที่เพิ่มขึ้น คำมั่นสัญญาผลลัพธ์อันยิ่งใหญ่"
      - third_factor: POSEIDON
        meaning_th: "การกระทำที่ถูกกำหนดโดยเหตุผล-ความชอบธรรมทางศีลธรรม"

  - factors: [MARS, SATURN]
    keyword_en: "Sickness. Separation. Death. Action of separation, action of interruption. Interruption of work. Acute sicknesses or matters. Forced separation. Periodic work."
    entries:
      - third_factor: M
        meaning_th: "ความตายของตนเอง หรือความตายของผู้อื่นที่ประทับใจจิตใจของเจ้าของดวงอย่างลึกซึ้ง สาเหตุแห่งความตาย ความเศร้าโศก การตาย ทนทุกข์จากการพลัดพรากหรือการกระทำที่แยกจากกัน"
      - third_factor: ARIES
        meaning_th: "ความเจ็บป่วย การพลัดพราก ความตาย การหยุดชะงักงานโดยทั่วไป หรือการทำงานเป็นช่วงๆโดยทั่วไป"
      - third_factor: SUN
        meaning_th: "ความเจ็บป่วย ความตาย ความยากลำบากส่วนตัว"
      - third_factor: A
        meaning_th: "กรณีเจ็บป่วย การสูญเสีย ความตายในครอบครัวหรือของคนรู้จัก การกระทำของผู้อื่นที่นำความเศร้ามาสู่ตน"
      - third_factor: MOON
        meaning_th: "ความเจ็บป่วยหรือความตายของผู้หญิง ชั่วโมงแห่งความตาย ความตายในหมู่ประชาชน หรือความตายของบุคคลสาธารณะ การเปลี่ยนแปลงที่น่าผิดหวังในเรื่องงาน"
      - third_factor: NODE
        meaning_th: "ล้มป่วย กรณีความตาย งานศพ การตัดขาดของสายสัมพันธ์ การทะเลาะ เท่ากับอาเซนแดนต์ คือเชื่อมโยงกับผู้อื่นผ่านงานที่ทำเป็นช่วงๆ"
      - third_factor: MERCURY
        meaning_th: "ความคิดหรือข่าวเรื่องความเจ็บป่วย การพลัดพรากและความตาย การเรียกไปดูอาการป่วย เท่ากับพฤหัสบดี คือความหวังที่ถูกทำลาย คำพูดรุนแรงนำความเศร้ามา"
      - third_factor: VENUS
        meaning_th: "ความตายของผู้หญิง รวมถึงของแม่"
      - third_factor: JUPITER
        meaning_th: "ความตายอย่างรวดเร็ว การหยุดชะงักของงานที่น่ายินดี วันหยุด เท่ากับฮาเดส คือผ่านสถานการณ์แปลกประหลาด การกระทำดีที่ไม่ได้รับการชื่นชม"
      - third_factor: URANUS
        meaning_th: "การพลัดพรากและความตายอย่างรุนแรง ความตายฉับพลัน การกระทำฉับพลันที่แยกจากกัน เท่ากับยูเรนัส/ซุส/มิเดียม คือด้วยอาวุธปืน การกระทำตื่นเต้นที่นำความเศร้ามา"
      - third_factor: NEPTUNE
        meaning_th: "ความตายด้วยยาพิษ แก๊ส โรคระบาด หรือเล่ห์เหลี่ยม(การทรยศ) เท่ากับซุส คือถูกยิงจากที่ซุ่มโจมตี ความสูญเสียจากการทรยศ"
      - third_factor: PLUTO
        meaning_th: "ล้มเลิกกิจกรรมหนึ่งในหลายกิจกรรม จุดเริ่มต้นของการพลัดพรากในภายหลัง การหยุดชะงักของพัฒนาการ"
      - third_factor: CUPIDO
        meaning_th: "การพลัดพรากในชีวิตแต่งงาน การหย่าร้าง ความตายในครอบครัว ความตายในหมู่คณะของผู้อื่น ความตายเป็นหมู่ การทะเลาะในชุมชน การหยุดชะงักหรือจุดจบของกิจกรรม"
      - third_factor: HADES
        meaning_th: "ความตายผิดปกติ ความตายจากความเจ็บป่วยรุนแรงหรือการขาดแคลน ความเจ็บป่วยจากความเหนื่อยล้าหรือการขาดแคลน เท่ากับยูเรนัส/เนปจูน คือผ่านการบาดเจ็บ"
      - third_factor: ZEUS
        meaning_th: "ความตายด้วยอาวุธปืน ไฟ การลอบสังหาร การทะเลาะและความเป็นศัตรูร้ายแรงที่ไม่เคยลืม"
      - third_factor: KRONOS
        meaning_th: "ความตายของผู้อาวุโสหรือบรรพบุรุษ เช่น บิดา เท่ากับคิวปิโด คือความตายของหัวหน้าครอบครัว การทะเลาะกับผู้บังคับบัญชา"
      - third_factor: APOLLON
        meaning_th: "ความเจ็บป่วย การพลัดพราก หรือการหยุดชะงักสำหรับหลายคน ความปั่นป่วนและการหยุดชะงักขณะสอน ความไม่น่ายินดีในสายสัมพันธ์เช่นนั้น"
      - third_factor: ADMETOS
        meaning_th: "ความเจ็บป่วย การพลัดพราก หรือการหยุดชะงักของงานที่ยาวนานมาก จุดเริ่มต้นของช่วงเวลาเศร้ามาก"
      - third_factor: VULKANUS
        meaning_th: "ความตายในการถูกกักขังหรือคุก ความขัดแย้งเรื่องความสามารถ ความเห็นต่างเรื่องการเป็นส่วนหนึ่งของสถานที่หรือประเทศหนึ่ง"
      - third_factor: POSEIDON
        meaning_th: "การหยุดชะงักของกิจกรรมทางจิตใจ ความเจ็บป่วยทางจิต ความคลั่ง"

  - factors: [MARS, URANUS]
    keyword_en: "Energetic act. Sudden events. Bloody injury. Exciting action."
    entries:
      - third_factor: M
        meaning_th: "การกระทำความรุนแรงส่วนตัว รุนแรงมาก จิตใจไม่ยั้งคิด ประสบความรุนแรงจากผู้อื่น ตื่นเต้นขณะทำงาน"
      - third_factor: ARIES
        meaning_th: "ความวุ่นวาย การก่อกบฏ หงุดหงิดเรื่องบางสิ่ง ความตื่นเต้นโดยทั่วไป"
      - third_factor: SUN
        meaning_th: "การบาดเจ็บฉับพลันของร่างกาย ชายผู้กระตือรือร้นหรือดุดัน การกระทำทางกายฉับพลัน เท่ากับซุส คือบาดเจ็บทางกายจากไฟหรือการผ่าตัด เท่ากับศุกร์/อาเซนแดนต์ คือเกี่ยวข้องกับผู้หญิง"
      - third_factor: A
        meaning_th: "เกี่ยวข้องกับเหตุการณ์ฉับพลัน ก่อกบฏร่วมกับผู้อื่นหรือผู้อื่นก่อกบฏต่อเจ้าของดวง ศุกร์ผ่านผู้หญิงหรือเหตุการณ์กับผู้หญิง"
      - third_factor: MOON
        meaning_th: "อุบัติเหตุหรือการผ่าตัดของผู้หญิง การผ่าตัดมดลูก บุคคลตื่นเต้นที่เป็นผู้หญิง ศุกร์ คือการคลอด"
      - third_factor: NODE
        meaning_th: "ถูกพัวพันในเหตุการณ์หนึ่ง การผ่าตัดไส้ติ่ง สายสัมพันธ์ที่น่าประหลาดใจกับผู้อื่น"
      - third_factor: MERCURY
        meaning_th: "การผ่าตัดศัลยกรรม พฤหัสบดี สำเร็จ เจตนาทำร้ายหรือบาดเจ็บ ซุสด้วยอาวุธปืน ข่าวฉับพลันที่น่าตกใจหรือน่าตื่นตระหนก การโต้เถียงรุนแรง"
      - third_factor: VENUS
        meaning_th: "การข่มขืน การคลอดโดยเครื่องมือ สูติแพทย์ เข้าสู่ความสัมพันธ์ใกล้ชิดอย่างฉับพลัน"
      - third_factor: SATURN
        meaning_th: "การพลัดพรากอย่างรุนแรง การผ่าตัดคลอด การตัดแขนขา หยุดหรือขัดจังหวะงานอย่างฉับพลัน"
      - third_factor: JUPITER
        meaning_th: "บาดเจ็บจากไฟหรือฟ้าผ่า"
      - third_factor: NEPTUNE
        meaning_th: "การต่อสู้หรืออุบัติเหตุที่นำไปสู่ความตาย บาดเจ็บจากการทรยศ การกระทำอันกระตือรือร้นที่ผิดทิศทาง พลังงานที่สูญเปล่า"
      - third_factor: PLUTO
        meaning_th: "วางแผนซุ่มโจมตี โจมตีแบบไม่ทันตั้งตัว วางแผนที่ดำเนินการเร็วเกินไป การกระทำที่น่าประหลาดใจซึ่งเริ่มพัฒนาการใหม่"
      - third_factor: CUPIDO
        meaning_th: "งานแต่งงานฉับพลัน รวมถึงการทะเลาะในชีวิตแต่งงาน การกระทำที่น่าประหลาดใจร่วมกับผู้อื่นที่เกิดขึ้นอย่างฉับพลัน ศิลปะที่ทำร่วมกับผู้อื่น"
      - third_factor: HADES
        meaning_th: "ฆาตกรรมและการฆ่าคน ความตายจากอุบัติเหตุ เนปจูน ผ่านการทรยศ บาดเจ็บรุนแรง ซุส ด้วยไฟ การทำลายฉับพลัน การกระทำหยาบคาย"
      - third_factor: ZEUS
        meaning_th: "บาดเจ็บจากพลังระเบิด ผ่านฟ้าผ่า ผ่านไฟฉับพลันหรืออาวุธปืน ยูเรนัส ผ่านอุบัติเหตุรถยนต์"
      - third_factor: KRONOS
        meaning_th: "ความวุ่นวายที่เกิดจากผู้มีอำนาจ หัวหน้า เจ้านาย ผู้บังคับบัญชา อังคาร/เสาร์ คือบาดเจ็บสาหัสของผู้บังคับบัญชา อังคารหรือพุธ คือศัลยแพทย์"
      - third_factor: APOLLON
        meaning_th: "วัตถุระเบิดจำนวนมาก การระเบิดหลายครั้ง การกระทำที่น่าประหลาดใจของหลายคน ความสนใจหรืออาชีพด้านโหราศาสตร์ฉับพลัน"
      - third_factor: ADMETOS
        meaning_th: "ความเป็นศัตรูครั้งใหญ่ฉับพลัน การกดขี่ที่รุนแรงหรือจริงจังฉับพลัน"
      - third_factor: VULKANUS
        meaning_th: "การชนกันครั้งใหญ่หรือการระเบิดขนาดใหญ่ ด้วยพลังที่น่าประหลาดใจอย่างมาก"
      - third_factor: POSEIDON
        meaning_th: "การกระทำที่กลมกลืนกับศีลธรรมและความจริง ความซื่อสัตย์ ความตรงไปตรงมาและความจริง"

  - factors: [MARS, NEPTUNE]
    keyword_en: "Infection. Destruction. Denial. Rejection."
    entries:
      - third_factor: M
        meaning_th: "เศร้าเพราะโรค ตัวเจ้าของดวงเองอยู่ในอารมณ์ปฏิเสธ ประสบความล้มเหลวและความสูญเสีย ความหวังที่พิสูจน์ว่าเป็นเท็จ"
      - third_factor: ARIES
        meaning_th: "การติดเชื้อ การทำลาย หรือการล่มสลายโดยทั่วไป"
      - third_factor: SUN
        meaning_th: "การติดเชื้อที่ดวงตา ไวต่อโรค"
      - third_factor: A
        meaning_th: "การปฏิเสธคนรู้จัก ถูกติดเชื้อจากผู้อื่น ความตาย"
      - third_factor: MOON
        meaning_th: "การติดเชื้อของผู้หญิง สมองฝ่อ เท่ากับฮาเดส คือความเสียหายที่ตาซ้ายของชาย ความปั่นป่วนของระบบต่อม อุปนิสัยผิดปกติของบุคคล"
      - third_factor: NODE
        meaning_th: "การรวมกันที่ถูกปฏิเสธ การรวมกันกับคนติดเชื้อ ทั้งทางกายและทางจิตใจ"
      - third_factor: MERCURY
        meaning_th: "การทำงานของสมองถูกขัดขวาง เส้นแบ่งระหว่างอัจฉริยะกับความบ้า เท่ากับฮาเดส คือความปัญญาอ่อน"
      - third_factor: VENUS
        meaning_th: "การทำลายด้วยโรคติดต่อทางเพศ การปฏิเสธความรัก โรคไตจากความเย็น ความอ่อนแอของอวัยวะดูดซึม"
      - third_factor: JUPITER
        meaning_th: "การปฏิเสธโชค ความสุขที่ผสมกับความผิดหวังครั้งใหญ่ ปอดอ่อนแอ"
      - third_factor: SATURN
        meaning_th: "ความตายอย่างช้าๆจากโรคระบาด ฟันผุ โรคไขข้ออักเสบ งานทำลายที่กินเวลานาน"
      - third_factor: URANUS
        meaning_th: "การทำลายฉับพลัน อุบัติเหตุ พยายามลอบสังหาร เท่ากับอังคาร/เสาร์ คือความตายจากการลอบสังหาร เท่ากับซุส คือด้วยอาวุธปืน"
      - third_factor: PLUTO
        meaning_th: "งานไม่เคยเสร็จสิ้น แผนลับ ปฏิเสธแผน การทำลายก่อนเสร็จสิ้น"
      - third_factor: CUPIDO
        meaning_th: "การทำลายความสุขในครอบครัว การหย่าร้าง อุบัติเหตุ บริษัทถูกยุบ ความเข้าใจผิดร้ายแรงในบริษัท"
      - third_factor: HADES
        meaning_th: "การทำลายด้วยการจมน้ำ โรคระบาด ความโหดร้าย หรือสงคราม พบกับคนใจร้ายชั่วร้ายและทนทุกข์จากพวกเขา"
      - third_factor: ZEUS
        meaning_th: "โรคทางพันธุกรรม ภาวะเป็นหมัน การทำลายด้วยไฟ แก๊สระเบิด"
      - third_factor: KRONOS
        meaning_th: "การติดเชื้อของบิดามารดาหรือบรรพบุรุษ การทำลายอำนาจรัฐบาล"
      - third_factor: APOLLON
        meaning_th: "การติดเชื้อและการทำลายของหลายคน หลายคนอยู่ภายใต้มนต์สะกดของความหวังลวง การทำลาย"
      - third_factor: ADMETOS
        meaning_th: "ความเสียหายจากความเย็น ความเจ็บป่วยจากความเย็น ตายเพราะหนาว การทำลายวัตถุดิบ ความสูญเสียครั้งใหญ่"
      - third_factor: VULKANUS
        meaning_th: "ความอ่อนแอครั้งใหญ่จากโรคระบาด การทำลายครั้งใหญ่"
      - third_factor: POSEIDON
        meaning_th: "ความบ้าคลั่ง ความเจ็บป่วยทางจิต หรืออุปนิสัยเคร่งศาสนาและจิตใจสูงส่ง"

  - factors: [MARS, PLUTO]
    keyword_en: "Plans. Filing. Organizing. To lead, to do, or to supervise several activities at the same time. To copy, to split, to duplicate, to repeat, to divide, to branch off."
    entries:
      - third_factor: M
        meaning_th: "ผู้จัดระเบียบ ผู้วางแผน ดูแลหลายงานพร้อมกัน"
      - third_factor: ARIES
        meaning_th: "แผนและองค์กรที่เกี่ยวข้องกับส่วนรวม การบริหารทั่วไป"
      - third_factor: SUN
        meaning_th: "ชายที่รับใช้การบริหารพลเรือน ตารางเวลาประจำวัน"
      - third_factor: A
        meaning_th: "วางแผนร่วมกับผู้อื่น มีบางสิ่งอยู่ในใจ"
      - third_factor: MOON
        meaning_th: "ตารางเวลา การบริหารและจัดระเบียบงานที่เกี่ยวกับสาธารณะ การเปลี่ยนแปลงการบริหารงานสาธารณะ จัดงบประมาณค่าใช้จ่าย"
      - third_factor: NODE
        meaning_th: "วางแผนร่วมกับผู้อื่น"
      - third_factor: MERCURY
        meaning_th: "วิพากษ์วิจารณ์ ถกเถียงและคัดค้านแผน"
      - third_factor: VENUS
        meaning_th: "มันพัฒนาไปตามที่วางแผนไว้ การเปลี่ยนแปลงที่น่ายินดีในความสัมพันธ์กับคนสนิท"
      - third_factor: JUPITER
        meaning_th: "แผนที่ดำเนินไปสำเร็จ แผนนำมาหรือควรนำมาซึ่งโชคดีและความสุข เท่ากับจันทร์ คือความยินดีในการวางแผน"
      - third_factor: SATURN
        meaning_th: "แผนถูกขัดขวางในการพัฒนา แผนงานที่ทำเป็นช่วงๆ แผนสำหรับอนาคตอันไกล"
      - third_factor: URANUS
        meaning_th: "แผนที่เกิดขึ้นโดยไม่คาดคิด ด้นสด"
      - third_factor: NEPTUNE
        meaning_th: "แผนลับ แผนที่มุ่งสู่การทำลาย แผนที่ไม่ได้ดำเนินการ เท่ากับยูเรนัส คือรัฐบาลหุ่นเชิด"
      - third_factor: CUPIDO
        meaning_th: "การวางแผนชุมชน แผนศิลปะ แผนแต่งงาน แผนชุมชน"
      - third_factor: HADES
        meaning_th: "แผนที่ไร้ค่า ทำไม่ได้ ล้าสมัย"
      - third_factor: ZEUS
        meaning_th: "แผนเพิ่มผลผลิต แผนจัดหางาน การวางแผนสงคราม การกระจายงาน"
      - third_factor: KRONOS
        meaning_th: "แผนใหญ่ นักจัดระเบียบผู้ยิ่งใหญ่ แผนของรัฐบาล แผนของผู้นำ เท่ากับวัลคานัส คือนักจัดระเบียบที่เชี่ยวชาญและสำเร็จ อำนาจรัฐบาลถูกแบ่งหรือกระจายในหมู่หลายคน เท่ากับซุส คือแผนสงคราม"
      - third_factor: APOLLON
        meaning_th: "การวางแผนงานวิทยาศาสตร์ แผนละเอียด"
      - third_factor: ADMETOS
        meaning_th: "แผนที่สำเร็จเพียงบางส่วน(ในระดับเล็กลง) เท่ากับมิเดียม คือลดขนาด"
      - third_factor: VULKANUS
        meaning_th: "แผนใหญ่ ในระดับมหาศาล แผนสำหรับอนาคตไกล ดำเนินแผนที่ต้องการการเปลี่ยนแปลงครั้งใหญ่"
      - third_factor: POSEIDON
        meaning_th: "งานเตรียมการทางจิตใจ ความพยายามทางจิตใจที่เป็นพันธะทางศีลธรรม ถูกบังคับให้ปฏิบัติตาม"

  - factors: [MARS, CUPIDO]
    keyword_en: "Marriage. Marriage partnership. Work partnership. Art activities."
    entries:
      - third_factor: M
        meaning_th: "ความตั้งใจแต่งงาน กิจกรรมในชุมชน"
      - third_factor: ARIES
        meaning_th: "การแต่งงาน การทำงานร่วมกับผู้อื่นโดยทั่วไป"
      - third_factor: SUN
        meaning_th: "การแต่งงานของตนเอง ของบิดา ชายที่กระตือรือร้นในชุมชน ความสำเร็จประจำวัน"
      - third_factor: A
        meaning_th: "สายสัมพันธ์ส่วนตัวที่นำไปสู่การแต่งงาน การแต่งงานของผู้อื่น ร่วมงานกับผู้อื่นที่มีผลประโยชน์ร่วมกัน"
      - third_factor: MOON
        meaning_th: "การแต่งงานของผู้หญิง การแต่งงานใหม่ของแม่ กิจกรรมกับผู้อื่นที่เกี่ยวกับสาธารณะ"
      - third_factor: NODE
        meaning_th: "สายสัมพันธ์สู่การแต่งงาน สายสัมพันธ์ผ่านกิจกรรมชุมชน"
      - third_factor: MERCURY
        meaning_th: "ความคิดเรื่องการแต่งงาน วิพากษ์เรื่องการทำงานร่วมกัน การถกเถียงในครอบครัวอย่างรุนแรง"
      - third_factor: VENUS
        meaning_th: "แต่งงานเพื่อความรัก ผ่านศิลปะครอบครัวทำงานร่วมกัน"
      - third_factor: JUPITER
        meaning_th: "การแต่งงานที่เป็นสุข งานแต่ง ทำงานร่วมกันอย่างเป็นสุข ผลของการทำงานร่วมกัน"
      - third_factor: SATURN
        meaning_th: "คำมั่นแต่งงานที่ผิดสัญญา ความตายยุติการแต่งงาน จุดจบของหุ้นส่วนงาน"
      - third_factor: URANUS
        meaning_th: "งานแต่งฉับพลัน พบสายสัมพันธ์การทำงานใหม่ที่รวดเร็วอย่างน่าประหลาดใจ"
      - third_factor: NEPTUNE
        meaning_th: "ความตั้งใจแต่งงานจางหายไป จุดจบของการล่มสลายความสัมพันธ์การทำงานในครอบครัว"
      - third_factor: PLUTO
        meaning_th: "แผนการแต่งงานหรืองานแต่ง การเปลี่ยนแปลงในหุ้นส่วนงาน เพื่อจุดประสงค์ทางศิลปะ"
      - third_factor: HADES
        meaning_th: "ความเจ็บป่วยและความทุกข์ในชีวิตแต่งงาน จุดจบของการแต่งงาน โชคร้ายจากความตายผิดปกติ การแต่งงานของหญิงม่าย จุดจบและโชคร้ายในการทำงานร่วมกับผู้อื่น"
      - third_factor: ZEUS
        meaning_th: "การแต่งงานจากผลของความรัก การแต่งงานโดยถูกบังคับ ไฟในสถานประกอบการของบริษัท การฝึกทหาร การสืบพันธุ์ในชีวิตแต่งงาน ผลของการทำงาน"
      - third_factor: KRONOS
        meaning_th: "ชีวิตแต่งงานของบิดา เท่ากับอังคาร/อพอลโล คือการแต่งงานที่ถูกกฎหมายถูกปฏิเสธ โครงการงานที่รัฐสนับสนุน"
      - third_factor: APOLLON
        meaning_th: "การแต่งงานหมู่ หุ้นส่วนงาน"
      - third_factor: ADMETOS
        meaning_th: "จุดจบของการแต่งงานหรือข้อตกลงงาน เดินทางในทางของตนเอง แต่รักษาสายสัมพันธ์ไว้เพื่อรักษาหน้า"
      - third_factor: VULKANUS
        meaning_th: "หุ้นส่วนงานที่แข็งแกร่งทรงพลัง มีอิทธิพลใหญ่ในองค์กรเช่นนั้น แต่งงานเข้าสู่ครอบครัวที่มีอิทธิพลใหญ่ อิทธิพลผ่านความสามารถทางศิลปะอันยิ่งใหญ่"
      - third_factor: POSEIDON
        meaning_th: "การผูกพันทางศีลธรรม จิตใจ หรือจิตวิญญาณของครอบครัว การแต่งงาน ศิลปะ หรือหุ้นส่วนงาน ทำงานร่วมกันในเรื่องศีลธรรม สรุปการแต่งงานด้วยเหตุผลทางศีลธรรม"

  - factors: [MARS, HADES]
    keyword_en: "Murder. Homicide. Sudden attacks. Serious sickness. Atrocity. Vulgar acts. Unusual death. To cause damages. Base services. Male servant. Weariness, fatigue, slaves."
    entries:
      - third_factor: M
        meaning_th: "โน้มเอียงสู่ความโหดร้ายหรือฆาตกรรม ต้องการแก้แค้น ตาต่อตา ถูกตัดขาดทางจิตใจจากการกระทำใจร้ายของผู้อื่น เบื่อหน่าย รำคาญง่ายและอ่อนล้า ทนทุกข์จากการกระทำใจร้ายของผู้อื่น การกระทำน่าเกลียดที่ย้อนกลับมา"
      - third_factor: ARIES
        meaning_th: "อาชญากรรมร้ายแรง โชคร้ายรุนแรง แผ่นดินไหว การกระทำที่ส่วนรวมต้องทนทุกข์ เท่ากับซุส คือความตายจากแก๊สพิษ"
      - third_factor: SUN
        meaning_th: "ความเจ็บป่วยรุนแรง บาดเจ็บจากการโจมตีฉับพลัน ชายที่มีงานสกปรกหรือใจร้ายผิดปกติ งานสกปรกประจำวัน ชายที่เหนื่อยง่ายขณะทำงาน"
      - third_factor: A
        meaning_th: "อันตรายจากการถูกฆาตกรรม รวมถึงอันตรายที่ผู้อื่นถูกฆาตกรรม การกระทำหยาบคายและชั่วร้ายของผู้อื่น"
      - third_factor: MOON
        meaning_th: "ความตายอันยากลำบากของภรรยา บุคคล โดยเฉพาะผู้หญิง ที่กระทำการใจร้าย"
      - third_factor: NODE
        meaning_th: "เชื่อมโยงกับฆาตกรรมหรือเรื่องน่าเกลียด สายสัมพันธ์ที่ทำให้ความสำเร็จยากหรือเป็นไปไม่ได้"
      - third_factor: MERCURY
        meaning_th: "ความคิดทางอาชญากรรม ความคิดเรื่องฆาตกรรม การฆ่าตัวตาย คิดถึงกิจกรรมที่ก่อความสูญเสียหรือความเสียหาย คำพูดหยาบคาย ด่าทออย่างชั่วร้าย พบเจอความโง่เขลาต้องห้ามที่เป็นอันตรายต่อทุกคน"
      - third_factor: VENUS
        meaning_th: "การทำร้ายผิดศีลธรรมพร้อมการบาดเจ็บ การแท้ง(ทารกเพศหญิง) ตำแหน่งรับใช้ที่นำไปสู่ความสัมพันธ์ใกล้ชิด ผูกติดกับญาติสายเลือด"
      - third_factor: JUPITER
        meaning_th: "โทษประหารชีวิต การพิพากษา การฆ่า ความตายผิดปกติที่รวดเร็ว เท่ากับคิวปิโด คือในหมู่คณะของผู้อื่น"
      - third_factor: SATURN
        meaning_th: "ความตายจากฆาตกรรมหรือการฆ่าตัวตาย หรือถูกบดขยี้ กิจกรรมที่ดำเนินด้วยการขาดทุน ทำงานโดยไม่ได้ค่าจ้าง"
      - third_factor: URANUS
        meaning_th: "การฆ่าตัวตาย ฆาตกรรม ความตื่นเต้น หรือกิจกรรมที่ก่อความสูญเสีย ความโหดร้ายในสงคราม"
      - third_factor: NEPTUNE
        meaning_th: "ความตายด้วยยาพิษ ฆาตกรรมโดยการจมน้ำหรือผ่านการทรยศ ความตายผิดปกติด้วยแก๊สพิษ ถูกโกงค่าจ้าง"
      - third_factor: PLUTO
        meaning_th: "การหย่อนยานในการบริการ เกิดจากทำงานหนักเกินไป ความล้มเหลวจากภาระหนัก จมลงสู่สภาพผู้รับใช้"
      - third_factor: CUPIDO
        meaning_th: "สูญเสียสามีจากการฆาตกรรม ความตายในงานเลี้ยงสังคม พบปะกับคนต่ำต้อย กิจกรรมกับผู้อื่นในสภาพแวดล้อมทางสังคมต่ำ"
      - third_factor: ZEUS
        meaning_th: "เป็นทหาร ราชการทหาร ราชการสงคราม ตายจากการเผาไหม้ เท่ากับอาริส คือแก๊สพิษ ความตายจากเครื่องจักร รถยนต์ อาวุธปืน(ฆาตกรรม) ความตายของความสามารถในการสืบพันธุ์"
      - third_factor: KRONOS
