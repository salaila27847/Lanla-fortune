        meaning_th: "การร่วมกิจกรรมศิลปะทั่วไป เมื่อรวมกับ Kronos คือการแต่งงาน การร่วมกิจการที่มีผลประโยชน์ร่วมกัน"
      - third_factor: SUN
        meaning_th: "นักแสดงศิลปะ สมาชิกชุมชน สมาคม หรือองค์กร การแต่งงาน"
      - third_factor: A
        meaning_th: "การคบหาผู้ชื่นชอบศิลปะ การคบหาผู้อื่น"
      - third_factor: MOON
        meaning_th: "นักแสดงศิลปะหญิง การติดต่อกับกลุ่มผู้หญิง การอยู่ท่ามกลางผู้หญิง"
      - third_factor: NODE
        meaning_th: "การคบหาด้านศิลปะ การแสวงหาความสัมพันธ์กับศิลปิน"
      - third_factor: MERCURY
        meaning_th: "ความคิดด้านศิลปะและสังคม ผู้ชื่นชอบศิลปะ มือสมัครเล่น"
      - third_factor: VENUS
        meaning_th: "รสนิยมความงาม ความกระตือรือร้น การชอบเข้าสังคม"
      - third_factor: MARS
        meaning_th: "ความตั้งใจแต่งงาน การทำงานร่วมกับผู้อื่น ตำแหน่งทหารผ่านศึก"
      - third_factor: JUPITER
        meaning_th: "ความพึงพอใจและความสุขจากงานด้านศิลปะ การแต่งงาน หรือชุมชน"
      - third_factor: SATURN
        meaning_th: "จิตสำนึกชุมชนเผชิญอุปสรรค ความชอบดนตรีงานศพ สภาพจิตใจหลังหย่าร้าง มิตรภาพที่จริงจัง"
      - third_factor: URANUS
        meaning_th: "รสนิยมศิลปะจังหวะ การแต่งงานฉับพลัน ความคิดริเริ่มและกล้าลงมือทำ"
      - third_factor: NEPTUNE
        meaning_th: "การเป็นมือสมัครเล่นในศิลปะตลอดไป การเลิกทำศิลปะ การมีส่วนร่วมในการยุบองค์กร การถูกหลอกลวงหรือความไม่ชัดเจนของหุ้นส่วน"
      - third_factor: PLUTO
        meaning_th: "ความเข้าใจศิลปะพัฒนาขึ้น การเปลี่ยนแปลงทางสังคม"
      - third_factor: HADES
        meaning_th: "ความชอบศิลปะและสังคมหยาบคาย เพลงยอดนิยมหรือหยาบคาย รสนิยมของเก่าและวัตถุโบราณ การสะสม"
      - third_factor: ZEUS
        meaning_th: "ความต้องการสร้างงานศิลปะร่วมกับผู้อื่น เมื่อรวมกับพฤหัสบดีคือชัยชนะ การสร้างสรรค์สำเร็จ ผู้นำทางสังคม"
      - third_factor: KRONOS
        meaning_th: "พรสวรรค์ด้านศิลปะสูง อัจฉริยะทางศิลปะ การคบหาคนที่เป็นอิสระ"
      - third_factor: APOLLON
        meaning_th: "ความบันเทิงทางสังคมมาก ความสุขท่ามกลางคนหมู่มาก สมาชิกครอบครัวจำนวนมาก ความสนใจร่วมกับนักวิทยาศาสตร์และนักธุรกิจ"
      - third_factor: ADMETOS
        meaning_th: "การถูกหลีกเลี่ยง ความปรารถนาในครอบครัวหรือชุมชนถูกปฏิเสธ"
      - third_factor: VULKANUS
        meaning_th: "จิตสำนึกชุมชนสูง อิทธิพลอันยิ่งใหญ่ผ่านสายสัมพันธ์ทางสังคม"
      - third_factor: POSEIDON
        meaning_th: "ชุมชนทางจิตวิญญาณหรือศาสนา การแสวงหาสิ่งเหล่านั้น ความสนใจในนิกายศาสนา"

  - factors: [M, HADES]
