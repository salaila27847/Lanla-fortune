        meaning_th: "รักษาความสงบใจภายใต้ความชั่วร้ายและสถานการณ์เลวร้าย ไม่ถูกข่มขู่จากโชคร้ายหรือการคุกคาม"
      - third_factor: ZEUS
        meaning_th: "โชคดีในการเอาชนะสถานการณ์ที่ถูกจำกัด ฟื้นฟูประเด็นที่ตายแล้ว ทำให้บางสิ่งเคลื่อนไหวอีกครั้ง ความจำเป็นต้องใช้เงิน"
      - third_factor: KRONOS
        meaning_th: "ใช้จ่ายเงินมาก ค่าใช้จ่าย ระบบราชการ"
      - third_factor: APOLLON
        meaning_th: "นิสัย เท่ากับยูเรนัส คือถูกดึงออกหรือทำให้ตกใจออกจากนิสัย"
      - third_factor: VULKANUS
        meaning_th: "ใช้จ่ายเงินมาก ซื้อของมาก ไปไม่ถึงเป้าหมาย ความเฉยเมยอันยิ่งใหญ่"
      - third_factor: POSEIDON
        meaning_th: "เฉยเมยทางจิตใจหรือจิตวิญญาณ แต่ก็มีความเข้าใจและปัญญาลึกซึ้งด้วย"

  - factors: [JUPITER, VULKANUS]
    keyword_en: "Mighty luck. Success by force. Might of money and finances. Confidence. Optimism."
    entries:
      - third_factor: M
        meaning_th: "มีโชคดี เป็นคนมองโลกในแง่ดี ไว้ใจผู้อื่น และได้รับความไว้ใจ"
      - third_factor: ARIES
        meaning_th: "ความมั่นใจและการมองโลกในแง่ดีโดยทั่วไป"
      - third_factor: SUN
        meaning_th: "ความเป็นอยู่ที่ดีทางกาย รู้สึกแข็งแรง ชายที่เพลิดเพลินกับสุขภาพและความแข็งแกร่งของร่างกาย วันเวลาแห่งความสุขในชีวิต ชีวิตนี้ดี"
      - third_factor: A
        meaning_th: "ปลูกฝังความหวังและความไว้ใจในผู้อื่น ให้กำลังใจพวกเขาก้าวต่อไป ได้รับอิทธิพลจากผู้อื่น"
      - third_factor: MOON
        meaning_th: "ผู้หญิงและสาธารณชนเปี่ยมมองโลกในแง่ดีและความมั่นใจ"
      - third_factor: NODE
        meaning_th: "เชื่อมโยงกับคนที่ไว้ใจได้"
      - third_factor: MERCURY
        meaning_th: "ความหวัง ความปรารถนาอันยิ่งใหญ่ บทสนทนามองโลกในแง่ดี"
      - third_factor: VENUS
        meaning_th: "ความรักอันโชคดียิ่งใหญ่"
      - third_factor: MARS
        meaning_th: "ความสำเร็จทางธุรกิจครั้งใหญ่ผ่านความสำเร็จของตนเอง"
      - third_factor: SATURN
        meaning_th: "โชคดีคือผู้พิทักษ์ การพลัดพรากที่ภายหลังพิสูจน์ว่าโชคดี โชคในการพลัดพรากนี้ต้องสุกงอม"
      - third_factor: URANUS
        meaning_th: "เหตุผลฉับพลันสำหรับการมองโลกในแง่ดีครั้งใหญ่ โชคดีครั้งใหญ่เริ่มต้นฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "โชคดีหรือโชคชะตาอันยิ่งใหญ่ที่ไม่ถูกจดจำในทันที แต่จะเผยตัวในอนาคต จุดเริ่มต้นของการหาเงินหรือได้เงินก้อนใหญ่อย่างง่ายดาย รวมถึงการสูญเสียเงินก้อนใหญ่"
      - third_factor: PLUTO
        meaning_th: "โชคดีครั้งใหญ่เริ่มพัฒนา"
      - third_factor: CUPIDO
        meaning_th: "ความสุขและความยินดีอันยิ่งใหญ่ผ่านศิลปะ ครอบครัว หรือชุมชน"
      - third_factor: HADES
        meaning_th: "หนีจากการทรยศ หรือประสบความสำเร็จด้วยการกระทำที่ทรยศ"
      - third_factor: ZEUS
        meaning_th: "ความสุขครั้งใหญ่ผ่านการสร้างสรรค์ที่สำเร็จ ทำงานที่สำเร็จให้เสร็จสิ้น"
      - third_factor: KRONOS
        meaning_th: "มีความเชื่อมั่นของรัฐ โชคหรือกำไรเงินอันยิ่งใหญ่ผ่านอำนาจรัฐ ใช้อำนาจรัฐอย่างสำเร็จ"
      - third_factor: APOLLON
        meaning_th: "โชคดีและความสุขผ่านเงิน รายได้มาก ทรัพย์สินเพิ่มขึ้น"
      - third_factor: ADMETOS
        meaning_th: "ถูกปล่อยให้อยู่อย่างสงบ ไม่ถูกรบกวนจากใคร เป็นสุขกับคนไม่กี่คน"
      - third_factor: POSEIDON
        meaning_th: "ความสุขผ่านเหตุผล ปัญญา สติปัญญาอันชอบธรรม เหตุผล ปัญญา ศรัทธาอันยิ่งใหญ่"

  - factors: [JUPITER, POSEIDON]
    keyword_en: "Mental happiness. Common sense. Wisdom. Intelligence. Conscience. Justice."
    entries:
      - third_factor: M
        meaning_th: "ฟังเสียงมโนธรรมและเหตุผล มีปัญญาและสติปัญญา ความสามารถตัดสินว่าอะไรถูกผิด"
      - third_factor: ARIES
        meaning_th: "สภาพกฎหมายโดยทั่วไป เหตุผลและสติปัญญาโดยทั่วไป มโนธรรมของโลก"
      - third_factor: SUN
        meaning_th: "เสียงแห่งมโนธรรม ชายที่ทำตามเสียงมโนธรรมของตน ผู้รู้ถูกผิด ผู้ฟังเหตุผล วันที่อุทิศให้การไตร่ตรอง"
      - third_factor: A
        meaning_th: "สิทธิของผู้อื่น จัดการกับผู้มีเหตุผลและสติปัญญา ได้รับการปฏิบัติดีจากผู้อื่น"
      - third_factor: MOON
        meaning_th: "บุคคลที่มีเหตุผล ฉลาดและมีสติปัญญา สาธารณชนเข้าหาสิ่งต่างๆด้วยเหตุผล"
      - third_factor: NODE
        meaning_th: "ความสุขทางจิตใจผ่านสายสัมพันธ์ สายสัมพันธ์กับผู้มีสติปัญญาและเหตุผล"
      - third_factor: MERCURY
        meaning_th: "ความคิดที่มีเหตุผล บทสนทนากับผู้มีสติปัญญาและเหตุผล"
      - third_factor: VENUS
        meaning_th: "เป็นสุขในศาสนา ศรัทธา ทัศนคติต่อชีวิตของตน"
      - third_factor: MARS
        meaning_th: "กิจกรรมทางจิตใจที่สำเร็จ ประสบความสำเร็จในสาขาอภิปรัชญา"
      - third_factor: SATURN
        meaning_th: "ต้องปิดเหตุผลและสติปัญญาของตนเองกับผู้ที่ยังต้องเติบโต ให้การศึกษาผู้อื่นสู่เหตุผลและสติปัญญา"
      - third_factor: URANUS
        meaning_th: "ความเข้าใจฉับพลัน ปัญญาและความเข้าใจมาถึงอย่างน่าประหลาดใจ"
      - third_factor: NEPTUNE
        meaning_th: "ความละเอียดอ่อนต่อความถูกต้องและความยุติธรรม มีความรู้สึกหรือมองเห็นความจริงเชิงอภิปรัชญาทางจิตใจ จิตใจที่พัฒนาเพียงพอจะรับรู้สิ่งที่สูงกว่า"
      - third_factor: PLUTO
        meaning_th: "พัฒนาการอันเป็นสุขของเหตุผล สติปัญญา ปัญญาและมโนธรรม"
      - third_factor: CUPIDO
        meaning_th: "ความสัมพันธ์และการรวมตัวกับผู้มีสติปัญญาและเหตุผล"
      - third_factor: HADES
        meaning_th: "ความไม่น่ายินดีและความยากลำบากจากการขาดเหตุผลและสติปัญญา(กับผู้อื่นหรือกับตนเอง)"
      - third_factor: ZEUS
        meaning_th: "ทำตามสัญชาตญาณที่ดีกว่า ความสำเร็จผ่านการรับรู้สิ่งต่างๆอย่างถูกต้อง"
      - third_factor: KRONOS
        meaning_th: "หัวหน้าผู้ชาญฉลาด ผู้บังคับบัญชา ผู้บังคับบัญชา รัฐบาลที่มีวิจารณญาณ ความเป็นผู้นำที่ถูกต้องและสำเร็จผ่านการตัดสินใจที่ดี"
      - third_factor: APOLLON
        meaning_th: "หลายคนมีความเห็นเดียวกัน การตัดสินเดียวกัน หลายคนมีสามัญสำนึก"
      - third_factor: ADMETOS
        meaning_th: "ปฏิเสธความคิดที่มีเหตุผล ปราศจากสามัญสำนึกหรือสติปัญญา"
      - third_factor: VULKANUS
        meaning_th: "ความดีเป็นสิ่งที่แพร่หลายที่สุด"
  - factors: [SATURN, URANUS]
    keyword_en: "Sudden separation. Quarrels. To part and die."
    entries:
      - third_factor: M
        meaning_th: "ถูกพลัดพรากฉับพลัน ทนทุกข์จากการทะเลาะ จัดการกับคนขี้ทะเลาะ"
      - third_factor: ARIES
        meaning_th: "เหตุการณ์ฉับพลันพร้อมความสูญเสียทรัพย์สิน ส่วนรวมจากไป"
      - third_factor: SUN
        meaning_th: "การพลัดพรากทางกายฉับพลัน ชายที่ถูกพลัดพรากฉับพลัน วันแห่งความตื่นเต้น การพลัดพราก อุปสรรค เท่ากับฮาเดส คือถูกพลัดพรากทางกายจากโชคร้าย"
      - third_factor: A
        meaning_th: "การพลัดพรากฉับพลันจากผู้อื่น ความเข้าใจผิดร้ายแรงกับผู้อื่น ลบด้วยอังคาร/เสาร์ คือด้วยความตาย"
      - third_factor: MOON
        meaning_th: "การพลัดพรากฉับพลันจากผู้หญิงคนหนึ่งหรือหลายคน ถอนตัวจากชีวิตสาธารณะ"
      - third_factor: NODE
        meaning_th: "อยู่ในเหตุการณ์การพลัดพราก สายสัมพันธ์ถูกฉีกขาด"
      - third_factor: MERCURY
        meaning_th: "จากลาฉับพลัน ถูกบังคับให้เดินทาง ความคิดหงุดหงิด"
      - third_factor: VENUS
        meaning_th: "การแตกหักฉับพลันในความรัก การพลัดพรากจากสิ่งที่ปรารถนา"
      - third_factor: MARS
        meaning_th: "จุดจบฉับพลันจากการบาดเจ็บ การกระทำหรือการกระทำที่พลัดพรากฉับพลัน เท่ากับพฤหัสบดี คือโชคดีในความโชคร้าย"
      - third_factor: JUPITER
        meaning_th: "การพลัดพรากจากความสุขฉับพลัน ความสูญเสียเงินหรืออสังหาริมทรัพย์ฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "ถูกพลัดพรากฉับพลันจากความไม่จริงหรือความเท็จ รวมถึงผ่านยาสลบ"
      - third_factor: PLUTO
        meaning_th: "พัฒนาการที่ถูกขัดขวางและช้าถูกนำเข้าสู่การเคลื่อนไหวอย่างฉับพลัน การเปลี่ยนแปลงในสถานการณ์ของการทะเลาะหรือคดีความ"
      - third_factor: CUPIDO
        meaning_th: "การยุติชีวิตแต่งงานอย่างรวดเร็ว การระงับสโมสรและสมาคม"
      - third_factor: HADES
        meaning_th: "ความสูญเสียจากความรุนแรง ประสบอุบัติเหตุฉับพลัน การพลัดพรากฉับพลันผ่านความหยาบคายและการทรยศ"
      - third_factor: ZEUS
        meaning_th: "ความสูญเสียจากเพลิงไหม้ การกระทำในสงคราม การพลัดพรากที่ถูกบังคับพร้อมความสูญเสีย"
      - third_factor: KRONOS
        meaning_th: "การแทรกแซงโดยอำนาจรัฐ ความสูญเสียดินแดนหรือความสูญเสียของรัฐบาล การสูญเสียบิดาหรือหัวหน้า"
      - third_factor: APOLLON
        meaning_th: "การพลัดพรากฉับพลันจากหลายคน ความไม่ลงรอยของหลายคน แบ่งกำลังของตน ถูกชักนำผิดทาง ละทิ้งวิธีที่ได้รับการอนุมัติ"
      - third_factor: ADMETOS
        meaning_th: "การพลัดพรากฉับพลันของคนไม่กี่คน เข้าหรือออกจากสถานการณ์ยากลำบากอย่างไม่คาดคิด"
      - third_factor: VULKANUS
        meaning_th: "ละทิ้งอิสรภาพของตน ถูกทำให้ประหลาดใจเข้าสู่สภาวะพึ่งพา การถูกจองจำ"
      - third_factor: POSEIDON
        meaning_th: "ความเชื่อมั่นและศรัทธาแตกสลายฉับพลัน การพลัดพรากฉับพลันในระดับจิตใจและจิตวิญญาณ ความเห็นหรือความเชื่อมั่นแตกแยก"

  - factors: [SATURN, NEPTUNE]
    keyword_en: "Sickness. Pestilence. Long diseases. Treacherous diseases of long duration. Chronic conditions. Habits."
    entries:
      - third_factor: M
        meaning_th: "ป่วย รู้สึกไม่สบาย อยู่ภายใต้มนต์สะกดหรือความประทับใจของสภาพเรื้อรังที่ยาวนานและไม่น่ายินดี"
      - third_factor: ARIES
        meaning_th: "โรคระบาดทั่วไป ความเจ็บป่วยรุนแรงในครอบครัว"
      - third_factor: SUN
        meaning_th: "ความเจ็บป่วยของร่างกาย ชายที่รู้สึกป่วยและอ่อนแอ วันเวลาผ่านไปภายใต้สถานการณ์ที่ไม่โชคดี"
      - third_factor: A
        meaning_th: "ความเจ็บป่วยของผู้อื่น ถูกติดเชื้อ ฉีดวัคซีน"
      - third_factor: MOON
        meaning_th: "โรคของมดลูก ผู้หญิงที่ทรยศ ความเจ็บป่วยของผู้คน บุคคลที่อ่อนแอและเจ็บป่วย"
      - third_factor: NODE
        meaning_th: "สายสัมพันธ์กับคนป่วย กับคนเจ็บ"
      - third_factor: MERCURY
        meaning_th: "ความเจ็บป่วยทางจิต ความคิดที่ทรยศ เท่ากับมิเดียม คือครุ่นคิดเรื่องความเจ็บป่วย เท่ากับอาเซนแดนต์ คือไม่ถูกเข้าใจโดยผู้อื่น"
      - third_factor: VENUS
        meaning_th: "โรคเบาหวาน โรคติดต่อทางเพศ"
      - third_factor: MARS
        meaning_th: "โรคติดต่อทางเพศของชาย เท่ากับอาริส คือความเจ็บป่วยเฉียบพลัน บาดแผลที่หายช้ามาก"
      - third_factor: JUPITER
        meaning_th: "โรคปอด เท่ากับอังคาร คือปอดบวม เท่ากับยูเรนัส/เสาร์ คือพิษแก๊ส"
      - third_factor: URANUS
        meaning_th: "โรคระบาดปรากฏขึ้นฉับพลัน เท่ากับจันทร์ คือหวัด"
      - third_factor: PLUTO
