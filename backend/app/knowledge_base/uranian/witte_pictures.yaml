        meaning_th: "ความเครียดและความต้องการของผู้คนปรากฏขึ้นฉับพลัน การตายฉับพลันของผู้หญิง ความวุ่นวายในหมู่ผู้คนที่เกี่ยวข้องกับฆาตกรรมและการก่อกบฏ ความตาย"
      - third_factor: NEPTUNE
        meaning_th: "ชาติที่เผชิญความหายนะและเคราะห์ร้าย อนาคตที่มืดมนไม่แน่นอน ชั่วโมงแห่งความสิ้นหวัง ถูกหลอกโดยสภาพของตนเอง หลงผิด การตัดสินใจที่ผิดพลาด"
      - third_factor: PLUTO
        meaning_th: "หลุดพ้นจากสภาพแออัด ได้รับอิสระมากขึ้น สภาพที่เปลี่ยนแปลงไป"
      - third_factor: CUPIDO
        meaning_th: "ชุมชนในสภาพแออัด หมู่บ้านที่รวมตัวเป็นนิติบุคคล ชุมชนที่ต้องการพึ่งตนเอง"
      - third_factor: HADES
        meaning_th: "ผู้คนขาดแคลนพื้นที่และวัตถุดิบ ชั่วโมงที่ปราศจากความหวัง"
      - third_factor: ZEUS
        meaning_th: "รู้สึกหดหู่ในที่ทำงาน ทำงานภายใต้แรงกดดัน แรงงานเกณฑ์"
      - third_factor: KRONOS
        meaning_th: "ชาติใหญ่ที่แออัด ปราศจากสถานะทางการเมือง ชาติที่เคยยิ่งใหญ่แต่สูญเสียเอกราชและใช้ชีวิตอยู่กับอดีต ระบบราชการ ใจแคบ"
      - third_factor: APOLLON
        meaning_th: "ผู้คนที่พอใจกับพื้นที่เล็กน้อย พอใจกับสภาพที่เป็นอยู่"
      - third_factor: VULKANUS
        meaning_th: "ความพยายามอย่างสิ้นหวังที่จะหลุดพ้นจากสภาพแออัด การต่อต้านสภาพเช่นนั้น"
      - third_factor: POSEIDON
        meaning_th: "ข้อจำกัดของอิสรภาพทางจิตใจและจิตวิญญาณ ถูกกดขี่ทางจิตใจ"

  - factors: [MOON, VULKANUS]
    keyword_en: "Mighty nation. Public influence. Personage of public might. Female influence. The superior. The executive power. Great reputation. To be sensational."
    entries:
      - third_factor: M
        meaning_th: "มีอิทธิพลร่วมกันอันทรงพลังและความสนใจระหว่างสาธารณชนกับเจ้าของดวง การติดต่อกับผู้มีอิทธิพลสาธารณะ และได้รับความประทับใจจากพวกเขา เจ้าของดวงเป็นสาเหตุของความประหลาดใจครั้งใหญ่ต่อสาธารณชน"
      - third_factor: ARIES
        meaning_th: "ชาติที่ทรงอำนาจ เหตุการณ์ใหญ่โดยทั่วไป บุคคลผู้ทรงอำนาจสาธารณะยิ่งใหญ่ สาธารณชนโดยรวมตื่นเต้นกับเจ้าของดวง"
      - third_factor: SUN
        meaning_th: "เหตุการณ์ทรงพลังที่เกิดซ้ำทุกวัน การอยู่ร่วมกับผู้มีความสนใจและอิทธิพลสาธารณะทุกวัน ชายผู้ก่อให้เกิดความสนใจสาธารณะ"
      - third_factor: A
        meaning_th: "ประสบเหตุการณ์ใหญ่ร่วมกับผู้อื่น เชื่อมโยงกับผู้อื่นผ่านเหตุการณ์ใหญ่และมีอิทธิพลสาธารณะร่วมกัน พบปะผู้คนเหล่านี้ทางสังคม ก่อความสนใจสาธารณะผ่านผู้อื่น หรือผู้อื่นก่อความสนใจสาธารณะให้เจ้าของดวง"
      - third_factor: NODE
        meaning_th: "เชื่อมโยงกับผู้มีอำนาจ เป็นหุ้นส่วนในอิทธิพลสาธารณะ ติดต่อกับผู้มีความสนใจสาธารณะ สายสัมพันธ์ก่อความสนใจสาธารณะ"
      - third_factor: MERCURY
        meaning_th: "พูดต่อสาธารณะเกี่ยวกับเรื่องอื้อฉาวที่น่าตื่นเต้น ความคิดเห็นสาธารณะและการพูดถึงมัน กิจกรรมทางความคิดอันทรงพลัง การสนทนากับบุคคลที่มีความสนใจสาธารณะ"
      - third_factor: VENUS
        meaning_th: "มีอิทธิพลใหญ่ต่อผู้หญิง ประทับใจพวกเธออย่างมาก ทำได้ดีกับผู้หญิงและผู้มีความสนใจและอิทธิพลสาธารณะ การดูแลอันยิ่งใหญ่ หน่วยงานสวัสดิการที่สร้างความสนใจมาก"
      - third_factor: MARS
        meaning_th: "ชาติที่ทรงอำนาจในสงคราม ทุ่มเทความพยายามอย่างมาก พัฒนาพลังงานมหาศาล ใช้อิทธิพลใหญ่ต่อผู้ชาย หรือตัวแทนสาธารณะหรือผู้มีอำนาจติดอาวุธ การกระทำที่สร้างความสนใจสาธารณะใหญ่หลวง"
      - third_factor: JUPITER
        meaning_th: "แผ่ขยายทัศนคติที่ดีรอบตัว ติดต่อกับผู้หญิงที่มองโลกในแง่ดี ใช้เวลาแห่งความสุขร่วมกับพวกเธอ โชคดีกับตัวแทนสาธารณะและผู้มีอำนาจทางการเงิน ก่อความสนใจสาธารณะผ่านโชคดีของตนเอง"
      - third_factor: SATURN
        meaning_th: "ทำหน้าที่เฝ้ายาม สูญเสียอิทธิพลใหญ่เหนือผู้หญิงหรือสาธารณชน แยกจากพวกเขาอย่างน่าเกลียดหรือดังอึกทึก ถูกพลัดพรากอย่างโอ่อ่าและมีเสียงดัง"
      - third_factor: URANUS
        meaning_th: "ต้องเกี่ยวข้องกับผู้มีอาวุธ กับทหารอย่างฉับพลัน ติดต่อกับตัวแทนด้านเทคนิคหรืออุตสาหกรรม ปัญหากับผู้บังคับบัญชา แสดงตัวอย่างไม่ดีอย่างฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "ถอนตัวจากอิทธิพลสาธารณะ ในขณะเดียวกันไม่ต่อต้านอิทธิพลสาธารณะ ติดต่อกับตัวแทนสาธารณะที่สับสนและหน้าซื่อใจคด ประสาทสัมผัสและความไวอันประณีต ถูกสังเกตเห็นจุดอ่อน ความขาดแคลน และความไม่เหมาะสม พิษแก๊ส"
      - third_factor: PLUTO
        meaning_th: "การเปลี่ยนแปลงครั้งใหญ่ในชาติที่เกี่ยวกับอำนาจ เหตุการณ์ทรงพลังกำลังก่อตัว การเปลี่ยนแปลงในหมู่ตัวแทนอำนาจสาธารณะเริ่มปรากฏ ผู้อื่นเตรียมพร้อมยึดอำนาจ พัฒนาการเป็นไปอย่างรุนแรงและอึกทึก"
      - third_factor: CUPIDO
        meaning_th: "ชั่วโมงแห่งงานเฉลิมฉลองของสังคมใหญ่ การพบปะทางสังคมกับตัวแทนอำนาจสาธารณะหรือผู้บังคับบัญชา ชุมชน สโมสร ศิลปินหรือศิลปะที่สร้างความสนใจและความตื่นเต้น"
      - third_factor: HADES
        meaning_th: "เหตุการณ์ใหญ่ที่มีความเสียหายมากและมีผู้เสียชีวิต ความต่ำทรามของตัวแทนอำนาจสาธารณะ การกระทำที่น่ารังเกียจและชั่วร้าย ความรังเกียจและความเกลียดชังอย่างมาก"
      - third_factor: ZEUS
        meaning_th: "ความสุขหรือเหตุการณ์สำคัญที่กำหนดโดยกฎธรรมชาติ ความช่วยเหลือใหญ่จากตัวแทนอำนาจสาธารณะ การสร้างสรรค์ ความสำเร็จ และการกระทำที่น่าตื่นตะลึง"
      - third_factor: KRONOS
        meaning_th: "อำนาจและอิทธิพลของข้าราชการชั้นสูง สมาชิกคณะรัฐมนตรี หรือนักการทูต ความชื่นชมและความประหลาดใจอย่างมาก"
      - third_factor: APOLLON
        meaning_th: "มีอิทธิพลต่อสาธารณชนได้สำเร็จ ขยายอิทธิพลนี้ ความเมตตาและความน่าพอใจของอำนาจสาธารณะ ถูกสังเกตเห็นหรือถูกอิจฉาเพราะโชคดีของตนเอง"
      - third_factor: ADMETOS
        meaning_th: "ปราศจากอิทธิพลโดยสิ้นเชิง อุปสรรคและขวากหนามใหญ่จากบุคคลผู้มีอำนาจสาธารณะ ถูกกล่าวถึงเพียงเล็กน้อยในวงแคบ"
      - third_factor: POSEIDON
        meaning_th: "ผู้หญิง ผู้บังคับบัญชา หรือสาธารณชนที่สนใจทางจิตใจหรือจิตวิญญาณ สร้างความประหลาดใจแก่ผู้อื่นด้วยการนำเสนอ พฤติกรรม หรือมุมมองโลกของตนเอง"

  - factors: [MOON, POSEIDON]
    keyword_en: "To be a medium. The influence of the spirit upon the soul. People who are susceptible to mental and spiritual things."
    entries:
      - third_factor: M
        meaning_th: "เตรียมพร้อมทางจิตใจ อ่อนไหวต่อสิ่งเชิงจิตวิญญาณ"
      - third_factor: ARIES
        meaning_th: "ร่างทรง ชายผู้เปี่ยมจิตวิญญาณ"
      - third_factor: SUN
        meaning_th: "ชั่วโมงแห่งความอ่อนไหวที่เกิดซ้ำทุกวัน การอยู่ร่วมกับคนเช่นนั้น"
      - third_factor: A
        meaning_th: "ความสัมพันธ์กับผู้ที่อ่อนไหวต่อสิ่งเชิงจิตใจและจิตวิญญาณ การมีอิทธิพลทางจิตใจต่อผู้อื่น"
      - third_factor: NODE
        meaning_th: "รักษาการติดต่อกับผู้ที่เตรียมพร้อมทางจิตใจ"
      - third_factor: MERCURY
        meaning_th: "ร่างทรงที่พูดหรือเขียน นักวิเคราะห์ลายมือโดยกำเนิด เตรียมพร้อมสำหรับแนวคิด บทสนทนากับผู้ที่ได้รับแรงบันดาลใจทางจิตใจ งานเขียนลึกลับ"
      - third_factor: VENUS
        meaning_th: "ผู้หญิงที่โน้มเอียงสู่วิชาไสยศาสตร์ ผู้หญิงที่อ่อนไหวสูง"
      - third_factor: MARS
        meaning_th: "กิจกรรมในด้านไสยศาสตร์ กิจกรรมทางปัญญาระดับสูง ปฏิบัติตามการชี้นำที่ได้รับแรงบันดาลใจโดยไม่รู้ตัวในกิจกรรมทางปัญญา กระทำตามสัญชาตญาณ ต่อสู้เพื่อสิ่งเชิงจิตวิญญาณ"
      - third_factor: JUPITER
        meaning_th: "แรงบันดาลใจอันโชคดี การนำทางที่ถูกต้องด้วยสัญชาตญาณ"
      - third_factor: SATURN
        meaning_th: "ไม่มีการติดต่อทางจิตใจหรือจิตวิญญาณ ไม่มีความสามารถโดยสัญชาตญาณ เผชิญการปฏิเสธหรือความเข้าใจผิดทางจิตใจหรือจิตวิญญาณ"
      - third_factor: URANUS
        meaning_th: "ถูกเปิดรับอิทธิพลทางจิตใจที่ไม่รู้จัก ความสามารถในการนำเสนอสิ่งค้นพบใหม่ที่ปฏิวัติวงการทางความคิด ได้รับการติดต่อทางจิตใจอย่างฉับพลัน มองทะลุ เข้าใจ และรู้แจ้ง"
      - third_factor: NEPTUNE
        meaning_th: "ความสามารถอันประณีตและอ่อนไหวสูงในการหาทาง ปรับจูนสูง ความละเอียดอ่อนของความรู้สึก เปี่ยมด้วยไหวพริบและความเกรงใจ ปลายนิ้วที่อ่อนไหว"
      - third_factor: PLUTO
        meaning_th: "มองเห็นและตระหนักถึงพัฒนาการใหม่ทางจิตใจหรือจิตวิญญาณ การแปรเปลี่ยนของสภาพจิตใจ"
      - third_factor: CUPIDO
        meaning_th: "ชุมชนทางจิตวิญญาณ โบสถ์ ฯลฯ"
      - third_factor: HADES
        meaning_th: "ผู้ที่ไม่สามารถรับรู้หรือเข้าใจสิ่งเชิงจิตวิญญาณ ขาดความสามารถทางจิตใจ คลำทางพัฒนาตนเอง หูตึงทางศีลธรรม ตาบอดทางจิตใจ"
      - third_factor: ZEUS
        meaning_th: "ความสำเร็จทางความคิดสร้างสรรค์ การบังคับสถานการณ์ด้วยจิตใจ"
      - third_factor: KRONOS
        meaning_th: "ปรับจูนทางจิตใจสูง คบหาสมาคมกับคนเช่นนั้น"
      - third_factor: APOLLON
        meaning_th: "สัมผัสรับรู้วิทยาการใหม่ คลำทางเข้าสู่สาขาใหม่"
      - third_factor: ADMETOS
        meaning_th: "เจาะลึก ไปให้ถึงก้นบึ้งด้วยความช่วยเหลือของไหวพริบและความรู้สึกอันประณีต"
      - third_factor: VULKANUS
        meaning_th: "ความอ่อนไหวสูงต่อผู้คนและสิ่งต่างๆ"
  - factors: [NODE, MERCURY]
    keyword_en: "Connections of thoughts. Correspondence."
    entries:
      - third_factor: M
        meaning_th: "การติดต่อจดหมายหรือการแลกเปลี่ยนความคิดของตนเอง"
      - third_factor: ARIES
        meaning_th: "การแลกเปลี่ยนความคิด ข่าวสาร"
      - third_factor: SUN
        meaning_th: "การแลกเปลี่ยนความคิดด้วยวาจา"
      - third_factor: A
        meaning_th: "ต้องการพบปะ ข้อตกลง การนัดหมาย เท่ากับมิเดียม คือการเจรจา"
      - third_factor: MOON
        meaning_th: "สายสัมพันธ์ทางความคิดของผู้หญิงกับผู้หญิง หรือกับคนจำนวนมาก"
      - third_factor: VENUS
        meaning_th: "มีใจโน้มเอียงสู่สายสัมพันธ์ทางความรักเชิงความคิด การจีบกัน การแลกเปลี่ยนความคิดที่ปนความรัก"
      - third_factor: MARS
        meaning_th: "การสรรหาผู้ร่วมงาน การหาคู่หู เท่ากับอาเซนแดนต์ คือผู้สมัคร ผู้แข่งขัน ผู้ลงสมัคร การทำงานความคิดเดียวกันร่วมกับผู้อื่น การติดต่อจดหมาย"
      - third_factor: JUPITER
        meaning_th: "พบบทสนทนาที่ดี เท่ากับอาเซนแดนต์ คือการสัมภาษณ์ที่สำเร็จ คิดถึงสายสัมพันธ์อันโชคดี"
      - third_factor: SATURN
