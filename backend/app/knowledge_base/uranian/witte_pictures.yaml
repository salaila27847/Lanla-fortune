      - third_factor: NODE
        meaning_th: "ความต้องการเคลื่อนไหวร่วมกับคนหมู่มาก งานชุมชน"
      - third_factor: MERCURY
        meaning_th: "ความต้องการเริ่มสิ่งใหม่เสมอ การเสนอความคิด ความคิดสร้างสรรค์"
      - third_factor: VENUS
        meaning_th: "โรครัก ความปรารถนาสร้างสิ่งสวยงาม"
      - third_factor: MARS
        meaning_th: "พร้อมช่วยเหลือเสมอ นักวางแผนที่ดี ผู้นำ คนกล้าบ้าบิ่น การบังคับให้สิ่งใดเป็นไปตามเจตจำนง"
      - third_factor: JUPITER
        meaning_th: "การส่งเสริมความสุข การกระตุ้นให้ผู้อื่นร่าเริง"
      - third_factor: SATURN
        meaning_th: "กิจกรรมที่มาพร้อมอุปสรรค ความเศร้า ความสูญเสียเงิน การสูญเสียจากสิ่งประดิษฐ์หรือการละเมิดสิทธิบัตร"
      - third_factor: URANUS
        meaning_th: "ความต้องการสร้างสรรค์ฉับพลัน แรงกระตุ้นสู่ความสำเร็จยิ่งใหญ่ทันที การบังคับเจตจำนงต่อผู้อื่น"
      - third_factor: NEPTUNE
        meaning_th: "ความไร้ความสามารถ ความอ่อนแอทางเจตจำนง การล้มเลิกแผนการ การวางแผนมากเกินไป"
      - third_factor: PLUTO
        meaning_th: "แรงกระตุ้นเพิ่มขึ้นเพื่อบรรลุบางสิ่ง การนำมาซึ่งการเปลี่ยนแปลง"
      - third_factor: CUPIDO
        meaning_th: "ความร่วมมือทางศิลปะ การนำสิ่งใหม่มาสู่ศิลปะ การทำงานร่วมกับผู้อื่นรอบตัว"
      - third_factor: HADES
        meaning_th: "การสร้างศิลปะหยาบคาย เรื่องเล่าหยาบโลน การทำงานกับถ่านหินหรือสิ่งสกปรก ความเศร้าและอุปสรรคในงาน ความปรารถนาช่วยเหลือผู้ป่วย"
      - third_factor: KRONOS
        meaning_th: "นักประดิษฐ์ผู้ยิ่งใหญ่ การสร้างสิ่งที่ยิ่งใหญ่ ผู้จัดการองค์กรเทคนิคขนาดใหญ่ การทำงานอย่างอิสระ"
      - third_factor: APOLLON
        meaning_th: "การเป็นนักวิจัยวิทยาศาสตร์"
      - third_factor: ADMETOS
        meaning_th: "การต่อสู้กับการต่อต้านที่รุนแรงที่สุด การเอาชนะความยากลำบากในช่วงเริ่มต้น"
      - third_factor: VULKANUS
