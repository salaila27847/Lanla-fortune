      - third_factor: HADES
        meaning_th: "การมีเพศสัมพันธ์นอกกฎหมาย การมั่วสุม โชคร้ายและความไม่น่ายินดีกับหรือผ่านคนรู้จักสนิทหรือญาติ"
      - third_factor: ZEUS
        meaning_th: "กิจกรรมทางเพศเพื่อการสืบพันธุ์ในหมู่ญาติใกล้ชิดหรือในชีวิตแต่งงาน เท่ากับพุธ/ซุส คือการทำหมัน สายสัมพันธ์ใกล้ชิดกับผู้นำ"
      - third_factor: KRONOS
        meaning_th: "ผู้หญิงที่ถูกครอบงำด้วยความรัก ความสัมพันธ์หรือความรู้จักสนิทกับบุคคลผู้มีอำนาจ"
      - third_factor: APOLLON
