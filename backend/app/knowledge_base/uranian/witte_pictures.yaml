        meaning_th: "กลมกลืนทางจิตใจหรือจิตวิญญาณกับคนไม่กี่คน งานเชิงวัฒนธรรมในเมืองเล็ก"

  - factors: [NODE, VULKANUS]
    keyword_en: "Eagerness and haste. Mighty influential connections. Application of force."
