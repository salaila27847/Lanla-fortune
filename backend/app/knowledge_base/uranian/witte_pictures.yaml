      - third_factor: KRONOS
        meaning_th: "การใส่ร้ายและเสียดสีผู้ปกครอง"
      - third_factor: APOLLON
        meaning_th: "ความคิดที่น่าเกลียดของคนจำนวนมาก หลายคนผิดพลาด อุปสรรคในการคิดชัดเจน มองไม่เห็นทางออก ไม่มีทางแก้ปัญหา"
      - third_factor: VULKANUS
        meaning_th: "ความคิดทางอาชญากรรม ความชั่วร้าย"
      - third_factor: POSEIDON
        meaning_th: "ความคิดเท็จ ต่ำทราม หยาบคาย ความคิดทำลายล้าง"

  - factors: [MERCURY, ZEUS]
    keyword_en: "To command. To threaten. Dictator. Creative thinking."
    entries:
