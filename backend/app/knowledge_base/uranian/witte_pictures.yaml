        meaning_th: "ใช้อิทธิพลอันทรงพลังผ่านการปรากฏตัวหรือการมีส่วนร่วมส่วนตัว ผู้อื่นตื่นเต้นอย่างมากกับเจ้าของดวง กระตือรือร้น"
      - third_factor: A
        meaning_th: "อยู่ร่วมกับผู้อื่นในสภาวะตื่นเต้นอย่างมาก เปี่ยมด้วยความกระตือรือร้น ทำบางสิ่งสำเร็จร่วมกับผู้อื่น ตั้งใจทำให้สำเร็จ"
      - third_factor: MERCURY
        meaning_th: "ผู้มีอำนาจสาธารณะตื่นเต้นและกระตือรือร้นเกี่ยวกับเจ้าของดวง"
      - third_factor: VENUS
        meaning_th: "ให้ความช่วยเหลือ การกุศลด้วย เท่ากับอังคาร คือญาติตื่นเต้น"
      - third_factor: MARS
        meaning_th: "แสดงการกระทำที่กระตือรือร้น ขยันขันแข็งมาก"
      - third_factor: JUPITER
        meaning_th: "ผูกพันอย่างเป็นสุขกับผู้ทรงอิทธิพล"
      - third_factor: SATURN
        meaning_th: "ถูกบังคับ ยอมจำนนต่อแรงบังคับ"
      - third_factor: URANUS
        meaning_th: "ถูกตรวจสอบอย่างเข้มงวดฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "การล่มสลายของสายสัมพันธ์อันทรงพลัง เชื่อมโยงกับอำนาจที่สับสน สายสัมพันธ์อันทรงพลังที่แปดเปื้อน ยากจะถูกจับได้ผ่านการใช้กำลัง"
      - third_factor: PLUTO
        meaning_th: "พัฒนาความกระตือรือร้น การเปลี่ยนแปลงที่ถูกบังคับ"
      - third_factor: CUPIDO
        meaning_th: "การกระทำรุนแรงผ่านบริษัทโดยองค์กร อิทธิพลอันทรงพลังของพลังที่รวมกัน"
      - third_factor: HADES
        meaning_th: "การกระทำชั่วร้ายโดยผู้มีอำนาจ"
      - third_factor: ZEUS
        meaning_th: "ถูกกดดันหรือบังคับโดยองค์กรใหญ่ การขู่เข็ญ"
      - third_factor: KRONOS
        meaning_th: "ถูกอยู่ใต้อำนาจของรัฐ เชื่อมโยงกับกองกำลังติดอาวุธของรัฐ"
      - third_factor: APOLLON
        meaning_th: "ความตื่นเต้นอันทรงพลังจากคนจำนวนมาก"
      - third_factor: ADMETOS
        meaning_th: "จุดจบของการรวมกันหรือสายสัมพันธ์อันทรงพลัง"
