      - third_factor: POSEIDON
        meaning_th: "งานหรือการสร้างสรรค์ทางความคิด การเป็นพยาน"

  - factors: [M, KRONOS]
    keyword_en: "Authority, to be independent. To direct and accomplish something."
    entries:
      - third_factor: ARIES
        meaning_th: "ผู้อยู่เหนือผู้อื่น ผู้มีอำนาจต่อผู้อื่น เมื่อรวมกับ Cupido คือการแต่งงาน"
      - third_factor: SUN
        meaning_th: "การใช้อำนาจส่วนตัว ความมุ่งมั่นสู่ความเป็นอิสระ"
      - third_factor: A
