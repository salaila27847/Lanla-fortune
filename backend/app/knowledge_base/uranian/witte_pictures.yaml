      - third_factor: SUN
        meaning_th: "อารมณ์ไม่ดีเพราะความเจ็บป่วย ความเศร้าจากสภาพร่างกายที่ย่ำแย่ของตนเองหรือผู้ชาย"
      - third_factor: A
        meaning_th: "การร่วมทุกข์กับผู้อื่น ความเศร้าจากทัศนคติหรือสภาพแวดล้อม"
      - third_factor: MOON
        meaning_th: "การตกที่นั่งลำบากเพราะผู้หญิง ความกังวลเรื่องผู้หญิง ความเศร้าเรื่องสภาพสาธารณะ ประชาชนที่โศกเศร้า"
      - third_factor: NODE
        meaning_th: "ความเศร้าร่วมกับผู้อื่น"
      - third_factor: MERCURY
        meaning_th: "ความปรารถนาร้ายต่อผู้อื่น ความคิดหนักอึ้ง ความโง่เขลา การเก็บสิ่งเลวร้ายไว้กับตัว การครุ่นคิดเรื่องน่าสังเวช"
      - third_factor: VENUS
        meaning_th: "ความพอใจในความรักหยาบคาย ความเศร้าในความรัก ตัณหาและความรู้สึกต่ำทราม"
      - third_factor: MARS
        meaning_th: "ความต้องการทำสิ่งชั่วร้าย ความริเริ่มน้อย ความขี้เกียจ ความเศร้าหรือความเสียหายจากการกระทำของตนเอง"
      - third_factor: JUPITER
        meaning_th: "ความเศร้าเรื่องเงินหรือความสูญเสีย ความสุขที่มัวหมอง"
      - third_factor: SATURN
        meaning_th: "การว่างงาน ความเศร้าจากความเจ็บป่วยและการแยกจาก คนแปลกหน้า ความเศร้าจากการกระทำหรืออุปสรรคของตนเอง"
      - third_factor: URANUS
        meaning_th: "ความเศร้าและทุกข์ทรมานจากความตายฉับพลันและสภาพที่เลวร้าย"
      - third_factor: NEPTUNE
        meaning_th: "การละทิ้งความหวังสุดท้าย ความรู้สึกกำลังจมน้ำ ความเศร้าจากความเท็จ การหลอกลวง หรือความไม่มั่นคง"
      - third_factor: PLUTO
        meaning_th: "ความเศร้าจากความเสื่อมถอยของตนเอง การปฏิเสธตนเอง การเปลี่ยนแปลงที่น่าเศร้า"
      - third_factor: CUPIDO
        meaning_th: "ความเศร้าจากชีวิตแต่งงาน องค์กร หรือสมาคม 'ฉันกังวลเรื่องอนาคต'"
      - third_factor: ZEUS
        meaning_th: "แรงกระตุ้นสู่การกระทำชั่ว การถูกบังคับให้เริ่มสิ่งเลวร้าย การสร้างความไม่ลงรอย"
      - third_factor: KRONOS
        meaning_th: "อารมณ์ไม่ดีจากการแทรกแซงของผู้มีอำนาจหรือรัฐบาล ความเสียหายจากการดำเนินการอย่างอิสระ"
      - third_factor: APOLLON
        meaning_th: "วิทยาการลับ การหมกมุ่นกับประวัติศาสตร์ วิทยาศาสตร์ หรือโบราณวัตถุ ช่วงเวลาไม่ดีสำหรับการค้า"
      - third_factor: ADMETOS
        meaning_th: "การขาดแคลนปัจจัยพื้นฐานของชีวิต ความเศร้า ความอดอยาก ความหนาวเย็น"
      - third_factor: VULKANUS
        meaning_th: "ความเศร้าจากการพึ่งพาผู้อื่น"
      - third_factor: POSEIDON
        meaning_th: "ความรู้ลับเกี่ยวกับความบกพร่องทางจิต การพึ่งพาผู้อื่น บุคลิกแปลกประหลาด"

  - factors: [M, ZEUS]
