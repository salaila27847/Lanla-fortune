        meaning_th: "ประสบการเปลี่ยนแปลงอันน่ายินดีในสภาพที่เป็นอยู่"
      - third_factor: MARS
        meaning_th: "การเปลี่ยนแปลงพื้นฐานของสภาพการทำงาน ดวงลักษณะนี้ส่วนใหญ่ไม่น่ายินดี — อังคาร แอดมิโตส และพลูโตรวมกันหมายถึงการกดขี่"
      - third_factor: JUPITER
        meaning_th: "การเปลี่ยนแปลงโชคชะตาอันโชคดี ข้อควรระวัง ตรวจสอบให้แน่ใจว่าพลูโตซึ่งเป็นตัวแทนการเปลี่ยนแปลงถึงราก ไม่ปรากฏในภาพที่ไม่ดี"
      - third_factor: SATURN
        meaning_th: "การเปลี่ยนแปลงสภาพที่เป็นอยู่ผ่านการพลัดพราก"
      - third_factor: URANUS
        meaning_th: "การเปลี่ยนแปลงสภาพที่เป็นอยู่ซึ่งเกิดจากการแตกหักหรือพลัดพรากฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "ประสบการเปลี่ยนแปลงลึกซึ้งในอนาคตอันใกล้ เหตุการณ์ที่กำลังจะมาถึงก่อตัวอยู่ใต้ผิวหน้าและอาจสังเกตได้จากอาการเล็กๆ น้อยๆ"
      - third_factor: CUPIDO
        meaning_th: "การเปลี่ยนแปลงในความสัมพันธ์ทางสังคมหรือครอบครัว"
      - third_factor: HADES
        meaning_th: "การเปลี่ยนแปลงชั่วร้ายของสภาพที่เป็นอยู่ สิ่งเลวร้าย ความโศกเศร้า และความเสียใจกำลังจะมาถึง"
      - third_factor: ZEUS
        meaning_th: "เพิ่มผลผลิตหรืองานภายใต้สถานการณ์ที่ยากลำบากและทดสอบใจที่สุด ถูกบังคับให้ชดเชยเวลาที่เสียไป"
      - third_factor: KRONOS
        meaning_th: "ในชีวิตของประชาชาติ คือการเปลี่ยนแปลงครั้งใหญ่ในรูปแบบการปกครองที่เป็นอยู่ ในดวงส่วนบุคคล คือผ่านการเปลี่ยนแปลงเช่นนั้น หรือทัศนคติของเจ้าของดวงต่อผู้บังคับบัญชาที่เปลี่ยนไป ได้เจ้านายหรือผู้บังคับบัญชาคนใหม่"
      - third_factor: APOLLON
        meaning_th: "การเปลี่ยนแปลงที่นำมาซึ่งความสุข ความอิ่มเอิบใจ และความพึงพอใจ"
      - third_factor: VULKANUS
        meaning_th: "การเปลี่ยนแปลงครั้งใหญ่ภายใต้อุปสรรคและสิ่งกีดขวางร้ายแรง"
      - third_factor: POSEIDON
        meaning_th: "การเปลี่ยนแปลงลึกซึ้งในศาสนา ในทัศนคติทางจิตใจและจิตวิญญาณ และในมโนทัศน์โลกของตน"

  - factors: [PLUTO, VULKANUS]
    keyword_en: "Mighty changes or transformations, which occur with great speed. Unhealthy, rushed development. Hothouse development."
    entries:
      - third_factor: M
        meaning_th: "ตกอยู่ใต้ความประทับใจและอิทธิพลของการเปลี่ยนแปลงครั้งใหญ่ ไม่ทัศนคติทางจิตใจของเราเปลี่ยนไปจากเหตุการณ์ภายนอก ก็ทัศนคติทางจิตใจของเราทำให้เรามองโลกภายนอกแตกต่างออกไป"
      - third_factor: ARIES
        meaning_th: "ประสบการเปลี่ยนแปลงครั้งใหญ่โดยทั่วไป การแปรสภาพครั้งใหญ่โดยรวม"
      - third_factor: SUN
        meaning_th: "ชายที่ร่างกายมีความสามารถในการฟื้นฟูตัวเองอย่างผิดปกติ ผู้เปลี่ยนไปสู่วิธีบำรุงร่างกายแบบใหม่หรือแตกต่าง ผู้ปฏิรูปชีวิต วันที่นำมาซึ่งการเปลี่ยนแปลงครั้งใหญ่ เท่ากับเสาร์ คือความสามารถในการฟื้นฟูตัวเองอย่างมากในบั้นปลายชีวิต เท่ากับโพไซดอน คือจิตเหนือกว่าวัตถุ"
      - third_factor: A
        meaning_th: "การแปรสภาพครั้งใหญ่ในสภาพแวดล้อม ประสบร่วมกับผู้อื่น"
      - third_factor: MOON
        meaning_th: "การเปลี่ยนแปลงครั้งใหญ่ในสภาพสาธารณะโดยทั่วไป ผู้คนเปลี่ยนตัวตนของตน"
      - third_factor: NODE
        meaning_th: "เข้าไปอยู่ในกระแสตัดขวาง ถูกพัดพาไป เป็นส่วนหนึ่งของมัน"
      - third_factor: MERCURY
        meaning_th: "มุ่งความคิดไปที่การเปลี่ยนแปลงครั้งใหญ่ พูดคุย สนทนา และถกเถียงเรื่องนั้น ต้องเปลี่ยนใจอย่างรวดเร็ว"
      - third_factor: VENUS
        meaning_th: "การเปลี่ยนแปลงที่ปรารถนามานาน การสมหวังในความปรารถนาที่มีมานาน"
      - third_factor: MARS
        meaning_th: "การเปลี่ยนแปลงครั้งใหญ่ในกิจกรรม"
      - third_factor: JUPITER
        meaning_th: "ประสบการเปลี่ยนแปลงครั้งใหญ่อันน่ายินดี"
      - third_factor: SATURN
        meaning_th: "รักษาบางสิ่งไว้ไม่ให้ถึงจุดเดือด ให้เคี่ยวไปเรื่อยๆ ทำให้การแปรสภาพครั้งใหญ่ล่าช้าลง อุปสรรคและสิ่งกีดขวางที่เกิดขึ้นต้านการเปลี่ยนแปลง"
      - third_factor: URANUS
        meaning_th: "การเปลี่ยนแปลงสภาพอย่างฉับพลันและน่าประหลาดใจ"
      - third_factor: NEPTUNE
        meaning_th: "หลอกตัวเองเรื่องความเป็นไปได้ของการเปลี่ยนแปลงและการแปรสภาพ มองไม่เห็นทางออกจากวิกฤต"
      - third_factor: CUPIDO
        meaning_th: "การเปลี่ยนแปลงครั้งใหญ่มากในครอบครัวหรือสังคม"
      - third_factor: HADES
        meaning_th: "สิ่งชั่วร้ายเพิ่มขึ้นมาก สถานการณ์กำลังเลวร้ายลง อันตรายที่เพิ่มขึ้น"
      - third_factor: ZEUS
        meaning_th: "สถานการณ์ดีขึ้นเนื่องจากผลงานที่เพิ่มขึ้นอย่างมาก"
      - third_factor: KRONOS
        meaning_th: "การพัฒนาความสามารถของตนอย่างมาก การทดสอบความสามารถเหล่านั้น การเปลี่ยนแปลงของรัฐบาล"
      - third_factor: APOLLON
        meaning_th: "สัญญาณเริ่มแรกของการเปลี่ยนแปลงครั้งใหญ่ที่จะตามมาในภายหลัง"
      - third_factor: ADMETOS
        meaning_th: "การล่มสลายของพัฒนาการอันยิ่งใหญ่ หรือการเพิกถอนหรือการเปลี่ยนแปลงที่เกิดจากแรงต้านทานมากเกินไป"
      - third_factor: POSEIDON
        meaning_th: "การแปรสภาพครั้งใหญ่ของสถาบันที่เกี่ยวกับศาสนาหรือมโนทัศน์โลกของตน"

  - factors: [PLUTO, POSEIDON]
    keyword_en: "Mental, intellectual and spiritual transformations and changes. Change of religion, of view of the world, of life. The development of spiritual and religious behavior and inclinations."
    entries:
      - third_factor: M
        meaning_th: "ความสามารถในการเปลี่ยนแปลงและพัฒนาทางจิตใจ ปรับตัวทางจิตใจเข้ากับสภาพแวดล้อมที่แตกต่าง หากเจ้าของดวงอยู่ในระดับพัฒนาการทางจิตใจหรือจิตวิญญาณที่สูงอยู่แล้ว ดวงลักษณะนี้จะยกระดับเขาให้สูงขึ้นไปอีก แต่หากอยู่ในระดับพัฒนาการต่ำ จะนำมาซึ่งความไม่แน่นอนและความเฉยเมย"
      - third_factor: ARIES
        meaning_th: "การแปรสภาพโดยทั่วไปของศาสนาหรือมโนทัศน์โลก"
      - third_factor: SUN
        meaning_th: "ชายที่มีใจเปิดกว้างและโน้มเอียงที่จะปฏิรูปชีวิตของตน ผู้ที่จะส่งอิทธิพลต่อร่างกายผ่านจิตใจ วันที่เอื้อต่อการพัฒนาทางจิตใจอย่างยิ่ง"
      - third_factor: A
        meaning_th: "ผู้คนรอบตัวเจ้าของดวงเปลี่ยนแปลงและพัฒนาทางจิตใจ"
      - third_factor: MOON
        meaning_th: "การติดต่อทางอารมณ์และจิตใจกับผู้หญิง อิทธิพลทางจิตใจของผู้หญิง การแปรสภาพทางการเมือง ศาสนา หรือทางโลกของสาธารณชน"
      - third_factor: NODE
        meaning_th: "การเปลี่ยนความคิดหรือหัวใจของผู้อื่นบังคับให้เจ้าของดวงเปลี่ยนความคิดหรือหัวใจของตนเอง หรืออาจเป็นในทางกลับกัน"
      - third_factor: MERCURY
        meaning_th: "ความคิด ความคิดเห็น และบทสนทนาเกี่ยวกับการเปลี่ยนแปลงและการแปรสภาพในเรื่องศาสนาหรือทางโลก ก่อให้เกิดการเปลี่ยนแปลงในเรื่องเหล่านั้นผ่านการพูดคุยกันตัวต่อตัว"
      - third_factor: VENUS
        meaning_th: "การแปรสภาพและพัฒนาการอันกลมกลืนของมุมมองต่อชีวิตของตน"
      - third_factor: MARS
        meaning_th: "นำความเป็นระเบียบเข้าสู่เรื่องจิตใจ ปฏิบัติตามแผนในการพัฒนาทางจิตใจ"
      - third_factor: JUPITER
        meaning_th: "เหตุผลและวิจารณญาณที่ดีนำไปสู่การเปลี่ยนแปลงหรือการแปรสภาพอันโชคดีในทัศนคติทางศาสนาของตน รวมถึงทัศนคติต่อโลก"
      - third_factor: SATURN
        meaning_th: "การเติบโตทางจิตใจถูกขัดจังหวะ พลัดพรากเพราะความเชื่อที่แตกต่างกัน ไม่อาจตามทันผู้อื่นในการพัฒนาทางจิตใจ ถูกทิ้งไว้ข้างหลัง ซึ่งก่อให้เกิดความโดดเดี่ยวและความขุ่นเคืองในทัศนคติต่อโลก"
      - third_factor: URANUS
        meaning_th: "ความเข้าใจที่ได้มาฉับพลันอย่างน่าประหลาดใจเรียกร้องให้มีการผลักดันในทัศนคติทางจิตใจและอารมณ์ของตน"
      - third_factor: NEPTUNE
        meaning_th: "สภาวะที่คืบคลานและวิกฤตในทัศนคติทางอารมณ์-จิตใจ อันเกิดจากมโนทัศน์ที่ผิดพลาด หรือจุดเริ่มต้นอันช้าและไม่มีใครสังเกตของการแปรสภาพหรือพัฒนาการทางจิตใจขั้นสูง"
      - third_factor: CUPIDO
        meaning_th: "พัฒนามุมมองต่อชีวิตที่แตกต่าง หลักคำสอนทางการเมือง หรือศาสนา ร่วมมือกับผู้อื่น"
      - third_factor: HADES
        meaning_th: "ล้มเหลวในทัศนคติทางอารมณ์หรือจิตใจของตน"
      - third_factor: ZEUS
        meaning_th: "เป็นผู้นำบางส่วน (ด้วยความเชื่อมั่นภายใน) ในการพัฒนามุมมองใหม่ต่อชีวิต"
      - third_factor: KRONOS
        meaning_th: "ผู้นำที่ได้รับการยอมรับในเรื่องมโนทัศน์และความหมายของชีวิต ทัศนคติแบบเผด็จการในเรื่องจิตใจและอารมณ์"
      - third_factor: APOLLON
        meaning_th: "ประสบการแปรสภาพทางจิตใจและอารมณ์ร่วมกับคนหมู่มาก"
      - third_factor: ADMETOS
        meaning_th: "เช่นเดียวกัน แต่ในวงแคบ"
      - third_factor: VULKANUS
        meaning_th: "การแปรสภาพครั้งใหญ่ในทัศนคติทางจิตใจหรืออารมณ์ของตน"
  - factors: [CUPIDO, HADES]
    keyword_en: "Poor societies or associations. Marriage in poverty. Unfortunate concern. Sad environment. Storage of supply. To stock, to hoard. Low and vile company. Collection of antiques. Museums. Paupers."
    entries:
      - third_factor: M
        meaning_th: "ไม่เต็มใจแต่งงาน ทายาทของครอบครัวยากจน ศิลปินข้างถนนที่มีชื่อเสียง เป็นส่วนหนึ่งของโศกนาฏกรรม"
      - third_factor: ARIES
        meaning_th: "บริษัทมหาชนที่ดิ้นรนอย่างหนัก ประชาชนที่ยากจน"
      - third_factor: SUN
        meaning_th: "ศิลปินเร่ร่อน สามีที่ยากจน หาเลี้ยงชีพด้วยการเร่ร่อน ชายที่รู้สึกถึงการพึ่งพาผู้อื่นอย่างมากเพราะความยากจน"
      - third_factor: A
        meaning_th: "สายสัมพันธ์การแต่งงานที่น่าสังเวช ความเจ็บป่วยในครอบครัว ความไม่กลมกลืนจากสภาพบ้าน ไม่มีความสุขในบ้านของตนเอง ชีวิตในบ้านไม่เข้าสังคม ห้องใต้ดินหรือห้องใต้หลังคา (ห้องเก็บเสบียง)"
      - third_factor: MOON
        meaning_th: "ศิลปินหญิงที่ยากจน ศิลปะยอดนิยม ความเชื่อมโยงระหว่างประชาชนกับบรรษัทที่ถูกโชคร้ายตามติด ประชาชนหรือสาธารณชนภายใต้ผลกระทบของเหตุการณ์โศกเศร้า"
      - third_factor: NODE
        meaning_th: "เป็นสมาชิกของสมาคมที่ยากจน รักศิลปะยอดนิยมราคาถูก เป็นพยานในเหตุการณ์โชคร้ายหรือโศกเศร้า"
      - third_factor: MERCURY
        meaning_th: "ทรมานตนเองด้วยความคิดทางศิลปะ เท่ากับอาเซนแดนต์ คือถูกเยาะเย้ยเพราะศิลปะ"
      - third_factor: VENUS
        meaning_th: "ความสัมพันธ์ทางความรักที่น่าสังเวช การค้าประเวณี ที่อยู่อาศัยย่ำแย่ ถูกบังคับให้พอใจกับสิ่งใดก็ได้"
      - third_factor: MARS
        meaning_th: "การทะเลาะและความบาดหมางในครอบครัวหรือสมาคมที่ยากจน ถูกบังคับให้ทำงานให้บริษัทที่ยากจน เท่ากับซุส คือปั๊มน้ำมัน คลังเชื้อเพลิง"
      - third_factor: JUPITER
        meaning_th: "เงินจากศิลปะยอดนิยมหรือหยาบคาย โชคลาภในชีวิตแต่งงานที่ไม่เหมาะสม มีความสุขและรู้สึกมีความสุขในสภาพแวดล้อมที่โศกเศร้า"
      - third_factor: SATURN
        meaning_th: "ความเศร้าโศกในครอบครัวที่ยากจน หรือการพลัดพรากของครอบครัวนั้น ครอบครัวที่หดหู่เพราะความยากจน"
      - third_factor: URANUS
