# witte_pictures.yaml — the actual "Rules for Planetary Pictures" glossary: for a given base pair
# (e.g. M+SUN), the SPECIFIC meaning when each other factor sits at their midpoint (a Type I
# picture, e.g. M+SUN=ARIES vs M+SUN=SATURN — genuinely different meanings). This is one level
# more granular than axis_meanings.yaml, which only gives the base pair's general theme
# ("M + SUN: ...") without breaking it down by third factor.
#
# ที่มา: "Rules for Planetary Pictures (Uranian System)" ดัดแปลง/เรียบเรียงจากคำสอนของ Alfred Witte
# โดยศิษย์ของเขา (Hans Niggemann, ต้นฉบับพิมพ์ปี 1959) — นี่คือตำรา Regelwerk fuer Planetenbilder
# ฉบับภาษาอังกฤษที่ CLAUDE.md/knowledge_base อ้างถึงว่าเป็นตำราอ้างอิงมาตรฐานของวงการยูเรเนียน
# (ละเอียดกว่า planetary_pictures.yaml ที่มีแค่ 50 คู่คัดสรรมาก) ผู้ใช้ส่งไฟล์ scan+OCR ทั้งเล่ม
# (~255 หน้า) มาให้ — คุณภาพ OCR แย่มาก มีตัวอักษรเพี้ยนแทบทุกย่อหน้า (เช่น "Witte"→"Mitte",
# "Meridian"→"tlcridlan") ทุกรายการด้านล่างผ่านการอ่านและสร้างประโยคภาษาอังกฤษที่สมเหตุสมผลใหม่ก่อน
# แปลเป็นไทย บางรายการกู้คืนจาก OCR ไม่ได้อย่างมั่นใจ จึง "ละไว้" แทนการเดา (ดูหมายเหตุ missing ต่อ
# ท้ายแต่ละคู่ที่ขาด) — มีต้นฉบับ OCR ดิบอยู่ที่ไฟล์ที่ผู้ใช้อัปโหลด ยังไม่ได้ก็อปปี้เข้า research/
# เพราะไฟล์ต้นฉบับใหญ่มาก (9599 บรรทัด) ให้ผู้ใช้ส่งซ้ำถ้าต้องการทำหมวดถัดไป
#
# สถานะ (แก้ไข 2026-08-13, Phase 20): ผู้ใช้ขอให้ทำต่อจนจบทั้งเล่ม — มีหมวด Meridian ครบ (M + อีก
# 21 ปัจจัย, หน้า 1-22), Aries ครบ (ARIES + อีก 20 ปัจจัย, หน้า 23-43), Sun เกือบครบ (SUN + อีก 17
# ปัจจัยจาก 19 ที่เป็นไปได้, หน้า 44-63), Ascendant (A + 15 ปัจจัยจาก 18 ที่เป็นไปได้, หน้า 64-82),
# Moon เกือบครบ (MOON + อีก 17 ปัจจัยที่เหลือ, หน้า 83-102 — ทุกคู่ยกเว้น MERCURY/SATURN/HADES/ZEUS/
# KRONOS มีรายการครบหรือเกือบครบ), และ Node ครบทั้ง 16 หมวด (NODE + ปัจจัยที่เหลือทั้งหมด, หน้า
# 102-118 — ทุกคู่มีรายการครบหรือเกือบครบ) — คู่ที่ข้ามไปหรือรายการที่ขาดในแต่ละหมวดคือจุดที่ OCR
# เสียหายจนตัวบ่งชี้ปัจจัยที่ 3 ("-XX") หายไปทั้งหมดหรือปนกันจนแยกไม่ออก ไม่มีทางระบุลำดับได้อย่างมั่นใจ
# (ดู comment `# missing:` ต่อคู่) — ยังไม่ได้ทำดาวเคราะห์/TNP อีก 16 ดวง (หน้า 119-255)
# ตามลำดับที่หนังสือระบุไว้ คุณภาพ OCR แย่ลงเรื่อยๆ ตามหลัง
# เล่ม
#
# engine.py ใช้ไฟล์นี้เฉพาะกับ Type I picture (pair + hit ตรงตัว) เป็นลำดับความสำคัญสูงสุด
# ก่อน planetary_pictures.yaml (คู่ทั่วไป) และก่อน fallback แบบ keyword — ดู _picture_finding()
base_pairs:
  - factors: [M, SUN]
    keyword_en: "Body and soul. Appearance of the 'I'."
    entries:
      - third_factor: ARIES
        meaning_th: "ทัศนคติกาย-จิตต่อสาธารณะโดยรวม อิทธิพลของสิ่งแวดล้อมต่อร่างกาย การสร้างความประทับใจต่อผู้อื่น"
      - third_factor: A
        meaning_th: "ทัศนคติทางความคิดและหน้าที่การงานต่อผู้อื่น"
      - third_factor: MOON
        meaning_th: "ทัศนคติส่วนตัวต่อผู้หญิง จิตใจ"
      - third_factor: NODE
        meaning_th: "สายสัมพันธ์ไม่ใช่แค่ทางกาย แต่ทางจิตใจด้วย"
      - third_factor: MERCURY
        meaning_th: "ความคล่องแคล่วของกายและจิต สภาพระบบประสาท การครุ่นคิดของตนเอง การใคร่ครวญ"
      - third_factor: VENUS
        meaning_th: "กายและจิตประสานกลมกลืน การประนีประนอม ความชื่นชอบในบางสิ่ง"
      - third_factor: MARS
        meaning_th: "การลงมือกระทำ การแสดงเจตจำนง การตัดสินใจ ทุ่มเททั้งกายและใจ ทำสิ่งใดให้สำเร็จครบถ้วน"
      - third_factor: JUPITER
        meaning_th: "ความสุขทั้งกายและใจ ความพึงพอใจ การมองโลกในแง่ดี"
      - third_factor: SATURN
        meaning_th: "ความเศร้า ความโศกเศร้า การมองโลกในแง่ร้าย การแยกจาก การล้มเลิกเป้าหมายบางอย่าง"
      - third_factor: URANUS
        meaning_th: "ความตึงเครียดทั้งกายและใจอย่างรุนแรง ความกระวนกระวาย การระเบิดอารมณ์ฉับพลัน ความขัดแย้ง"
      - third_factor: NEPTUNE
        meaning_th: "กายและจิตอ่อนไหวง่าย ตอบสนองรุนแรงต่อทุกอิทธิพลแม้เพียงเล็กน้อย ความอ่อนแอ ความไม่ชอบ สัญชาตญาณ"
      - third_factor: PLUTO
        meaning_th: "พัฒนาการของกายและจิตที่ส่งอิทธิพลต่อกัน ถูกกำหนดโดยองค์ประกอบของพลูโต การเปลี่ยนแปลงครั้งใหญ่ในชีวิต"
      - third_factor: CUPIDO
        meaning_th: "ความสุขทางกาย ความรู้สึกเชิงศิลปะ ทัศนคติต่อชีวิตแต่งงาน"
      - third_factor: HADES
        meaning_th: "ข้อบกพร่องทางกายส่งผลต่อจิตใจและย้อนกลับกันได้ ก่อความไม่สบายกาย อารมณ์ไม่ดี ความเจ็บป่วย ความน่ารังเกียจ"
      - third_factor: ZEUS
        meaning_th: "ความสามารถเชิงสร้างสรรค์ของกายและจิต ความกล้าหาญ พลังงาน ความต้องการเป็นผู้นำ"
      - third_factor: KRONOS
        meaning_th: "ความภักดีต่อผู้มีอำนาจด้วยกายและใจ ตำแหน่งหรือสถานะสูง"
      - third_factor: APOLLON
        meaning_th: "การขยายตัวครั้งใหญ่ของกายและจิต ความสำเร็จ"
      - third_factor: ADMETOS
        meaning_th: "ความอดทนพากเพียร ยึดมั่นในความคิดอย่างเหนียวแน่น"
      - third_factor: VULKANUS
        meaning_th: "การรวมพลังของกายและจิต"
      - third_factor: POSEIDON
        meaning_th: "การรวมกันของร่างกายที่บอบบางและจิตวิญญาณที่ละเอียดอ่อนสูง"

  - factors: [M, ARIES]
    keyword_en: "Individual attitude of the native toward universality. The \"I\" embodied to the world."
    # missing: NODE (OCR line dropped/merged between Moon and Mercury entries)
    entries:
      - third_factor: SUN
        meaning_th: "ร่างกายในที่สาธารณะ พฤติกรรมการแสดงออก"
      - third_factor: A
        meaning_th: "การสร้างมิตรภาพที่ส่งผลต่ออาชีพ การพบปะนอกบ้าน"
      - third_factor: MOON
        meaning_th: "การร่วมงานกับผู้อื่นในที่สาธารณะ การมีสายสัมพันธ์มากมายและได้มาง่าย"
      - third_factor: MERCURY
        meaning_th: "การแสดงออก คำกล่าว ความคิดเห็น บทสนทนาขณะพบปะผู้อื่น"
      - third_factor: VENUS
        meaning_th: "การแต่งตัวเพื่อผู้อื่น การเป็นที่ชื่นชอบ ดูน่าดึงดูดต่อสาธารณะ"
      - third_factor: MARS
        meaning_th: "การทำงานร่วมกับผู้อื่น การปล่อยให้ผู้อื่นทำงาน ดูมีพลัง กระตือรือร้น และยุ่งอยู่เสมอ"
      - third_factor: JUPITER
        meaning_th: "ความร่าเริงกับผู้อื่น ทัศนคติที่ดีต่อผู้อื่น ความรู้สึกโชคดี ประสบความสำเร็จ"
      - third_factor: SATURN
        meaning_th: "ความโศกเศร้าร่วมกับผู้อื่น การสูญเสีย การขาดการตอบสนอง หรือดูจืดชืดต่อผู้อื่น ความรู้สึกถูกทอดทิ้งหรือโดดเดี่ยว"
      - third_factor: URANUS
        meaning_th: "ประสบการณ์ร่วมกับผู้อื่น การแสดงความแปลกประหลาด การปฏิวัติ ความตื่นเต้นในที่สาธารณะ"
      - third_factor: NEPTUNE
        meaning_th: "การถูกหลอกลวงร่วมกับผู้อื่น ความสัมพันธ์ต่อสาธารณะที่ไม่แน่นอนและคลุมเครือ"
      - third_factor: PLUTO
        meaning_th: "พัฒนาการของทัศนคติตนเองต่อสาธารณชนโดยรวม"
      - third_factor: CUPIDO
        meaning_th: "ความชอบเข้าสังคม ดูและเป็นคนเข้าสังคมเก่ง การเกี่ยวข้องกับศิลปะ สมาคม หรือชุมชน"
      - third_factor: HADES
        meaning_th: "การร่วมทุกข์กับผู้อื่น การว่างงาน ความเห็นอกเห็นใจ"
      - third_factor: ZEUS
        meaning_th: "การรวมกลุ่มเหนียวแน่น มิตรภาพแบบเพื่อนร่วมรบ การเป็นผู้นำ การบรรลุเป้าหมาย"
      - third_factor: KRONOS
        meaning_th: "การอยู่ร่วมกันอย่างเป็นทางการ การดูเป็นผู้นำ"
      - third_factor: APOLLON
        meaning_th: "ประสบการณ์ชีวิตภายนอก ความโหยหาสถานที่ไกลๆ ความตั้งใจขยายตัว"
      - third_factor: ADMETOS
        meaning_th: "ยากจะเปลี่ยนใจ ไม่เปลี่ยนความคิดและทัศนคติเมื่อเผชิญสาธารณชน"
      - third_factor: VULKANUS
        meaning_th: "การใช้อำนาจโดยทั่วไป"
      - third_factor: POSEIDON
        meaning_th: "การยกระดับจิตวิญญาณ"

  - factors: [M, A]
    keyword_en: "The relationship to others. To join with others for a common objective."
    # missing: NODE (not found in OCR)
    entries:
      - third_factor: ARIES
        meaning_th: "การติดต่อทางอาชีพหรือความคิดกับสาธารณชนทั่วไป"
      - third_factor: SUN
        meaning_th: "การติดต่อทางอาชีพอย่างใกล้ชิดกับผู้อื่น การทำงานร่วมกัน พฤติกรรมต่อผู้หญิง ความสัมพันธ์ทางอาชีพกับสาธารณะและผู้หญิง"
      - third_factor: MOON
        meaning_th: "สายสัมพันธ์ผ่านความสนใจร่วม ที่กลายเป็นเรื่องส่วนตัว การรู้จักกันทางความคิด"
      - third_factor: MERCURY
        meaning_th: "บทสนทนาด้านอาชีพหรือธุรกิจ"
      - third_factor: VENUS
        meaning_th: "สายสัมพันธ์ทางอาชีพที่ราบรื่น พึงพอใจกับความสัมพันธ์ทางอาชีพ สายสัมพันธ์กลมกลืนในแวดวงใกล้ตัว"
      - third_factor: MARS
        meaning_th: "กิจกรรมทางอาชีพ การพัฒนาหรือบรรลุบางสิ่งร่วมกับผู้อื่น"
      - third_factor: JUPITER
        meaning_th: "โชคทางอาชีพ ความเพลิดเพลินในกิจกรรมร่วมกับผู้อื่น"
      - third_factor: SATURN
        meaning_th: "ความยากลำบากทางอาชีพ การแยกจากผู้อื่น"
      - third_factor: URANUS
        meaning_th: "การเผชิญหน้าผู้อื่นอย่างฉับพลัน ปัญหาทางอาชีพที่เกิดขึ้นทันที การก่อเรื่องอย่างกะทันหัน"
      - third_factor: NEPTUNE
        meaning_th: "การถูกผู้อื่นหลอกลวง การเผชิญการหลอกลวงร่วมกับผู้อื่น สภาพการงานที่ไม่มั่นคง"
      - third_factor: PLUTO
        meaning_th: "พัฒนาการหรือการเปลี่ยนแปลงในชีวิตการงานหรือความสัมพันธ์กับผู้อื่น ส่งผลต่อบุคลิกภาพผ่านการเปลี่ยนแปลงทางอาชีพ"
      - third_factor: CUPIDO
        meaning_th: "ความกระตือรือร้นในสังคม การแต่งงาน หุ้นส่วนทางอาชีพ"
      - third_factor: HADES
        meaning_th: "อารมณ์เศร้ากับผู้คนรอบตัว จากงานหรืออาชีพที่เกี่ยวข้องกับสิ่งสกปรกน่ารังเกียจ"
      - third_factor: ZEUS
        meaning_th: "การกระตุ้นปลุกเร้าผู้อื่น"
      - third_factor: KRONOS
        meaning_th: "ความยโส การชอบสั่งการผู้อื่น"
      - third_factor: APOLLON
        meaning_th: "ความสำเร็จทางอาชีพ การติดต่อกับผู้คนจำนวนมาก"
      - third_factor: ADMETOS
        meaning_th: "ความสัมพันธ์กับผู้อื่นที่มั่นคงหนักแน่น"
      - third_factor: VULKANUS
        meaning_th: "การใช้อำนาจร่วมกับผู้อื่น การดำเนินการร่วมกัน"
      - third_factor: POSEIDON
        meaning_th: "ความเห็นพ้องทางความคิด หรือความกลมกลืนทางจิตวิญญาณกับผู้อื่น"

  - factors: [M, NODE]
    keyword_en: "Soul unions."
    entries:
      - third_factor: ARIES
        meaning_th: "ความถูกคอกับผู้คนทั่วไป"
      - third_factor: SUN
        meaning_th: "การรวมจิตวิญญาณส่งผลต่อร่างกาย"
      - third_factor: A
        meaning_th: "การรวมจิตวิญญาณกับคนคุ้นเคย"
      - third_factor: MOON
        meaning_th: "อารมณ์ที่เกิดจากการรวมจิตวิญญาณ"
      - third_factor: MERCURY
        meaning_th: "แรงกระตุ้นทางความคิดจากการรวมจิตวิญญาณ การเชื่อมโยงทางความคิด"
      - third_factor: VENUS
        meaning_th: "สายสัมพันธ์ความรักส่วนตัว การรวมจิตวิญญาณด้วยความรัก"
      - third_factor: MARS
        meaning_th: "การรวมจิตวิญญาณเชิงกามารมณ์ การแสวงหามิตรภาพในการทำงาน"
      - third_factor: JUPITER
        meaning_th: "โชคและความสุขผ่านสายสัมพันธ์ของตน ความรู้สึกเป็นสุขกับผู้อื่น"
      - third_factor: SATURN
        meaning_th: "ความหม่นหมองที่ผู้อื่นนำมาให้ การสูญเสียสายสัมพันธ์"
      - third_factor: URANUS
        meaning_th: "สายสัมพันธ์ที่เกิดขึ้นฉับพลัน อารมณ์ที่เกิดขึ้นทันที"
      - third_factor: NEPTUNE
        meaning_th: "การสลายของสายสัมพันธ์ ผลกระทบต่อพัฒนาการของตนเอง"
      - third_factor: PLUTO
        meaning_th: "การเริ่มต้นหรือเปลี่ยนแปลงสายสัมพันธ์ ผลกระทบต่อพัฒนาการของตนเอง"
      - third_factor: CUPIDO
        meaning_th: "สายสัมพันธ์ทางจิตวิญญาณกับศิลปะหรือครอบครัว"
      - third_factor: HADES
