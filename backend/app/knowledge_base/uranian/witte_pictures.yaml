      - third_factor: PLUTO
        meaning_th: "การเป็นหรือกลายเป็นผู้เชี่ยวชาญ"
      - third_factor: CUPIDO
        meaning_th: "อัจฉริยะทางศิลปะ ผู้นำทางสังคม พิธีกร"
      - third_factor: HADES
