      - third_factor: NODE
        meaning_th: "เกี่ยวข้องกับการเปลี่ยนแปลงฉับพลัน"
      - third_factor: MERCURY
        meaning_th: "เปลี่ยนความคิดเห็นและความรู้ฉับพลัน ซึมซับสิ่งใหม่อย่างรวดเร็ว ความคิดที่ไม่ปะติดปะต่อหรือถูกรบกวน"
      - third_factor: VENUS
        meaning_th: "ความรักและมิตรภาพสูญเสียไปฉับพลันอย่างไม่ทันตั้งตัว"
      - third_factor: MARS
        meaning_th: "การเปลี่ยนแปลงฉับพลันในกิจกรรม ดำเนินกิจกรรมที่วางแผนไว้"
      - third_factor: JUPITER
        meaning_th: "การเปลี่ยนแปลงฉับพลันที่นำโชคดีมาให้"
      - third_factor: SATURN
        meaning_th: "การพัฒนาถูกขัดจังหวะอย่างฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "การเริ่มต้นพัฒนาการฉับพลันซึ่งยังไม่อาจตัดสินได้ว่าจะกินเวลานานเท่าใด มีทิศทางอย่างไร หรือดำเนินไปอย่างไร ก้าวเข้าสู่สิ่งไม่รู้จัก"
      - third_factor: CUPIDO
        meaning_th: "การเปลี่ยนแปลงที่น่าประหลาดใจในครอบครัวหรือชุมชน เช่น การแต่งงาน การเกิด หรือความตาย"
      - third_factor: HADES
        meaning_th: "การเปลี่ยนแปลงฉับพลันที่ไม่น่าพอใจอย่างยิ่ง การเปลี่ยนแปลงที่ถูกยอมรับอย่างไม่เต็มใจ"
      - third_factor: ZEUS
        meaning_th: "การเปลี่ยนแปลงที่กระทบกระเทือนพร้อมผลลัพธ์ร้ายแรง การเปลี่ยนแปลงที่นำไปสู่การเปลี่ยนแปลงอื่นต่อไป"
      - third_factor: KRONOS
        meaning_th: "การเปลี่ยนแปลงฉับพลันในอำนาจรัฐหรือผู้มีอำนาจ ตั้งตนเป็นผู้นำ การพัฒนาอำนาจอย่างฉับพลัน"
      - third_factor: APOLLON
        meaning_th: "สิ่งที่เริ่มต้นขึ้นฉับพลัน การศึกษาหรือกิจการที่เริ่มจากขนาดเล็กมากแล้วเติบโตจนใหญ่โต"
      - third_factor: ADMETOS
        meaning_th: "การสูญเสียฉับพลัน การหลุดพ้น การเปลี่ยนแปลงอย่างสมบูรณ์"
      - third_factor: VULKANUS
        meaning_th: "การเปลี่ยนแปลงกำลังหรือทิศทาง การก้าวกระโดดไปข้างหน้าอย่างมหาศาล"
      - third_factor: POSEIDON
        meaning_th: "ได้รับความเข้าใจลึกซึ้งในเรื่องจิตใจหรือจิตวิญญาณ"

  - factors: [URANUS, CUPIDO]
    keyword_en: "Sudden marriage. Sudden wedding. Sudden event in the family."
    entries:
      - third_factor: M
        meaning_th: "แต่งงานหรือหมั้นหมายฉับพลัน"
      - third_factor: ARIES
        meaning_th: "การแต่งงานที่ตกลงกันอย่างรวดเร็ว คู่ครองที่พบกันเร็วอย่างน่าประหลาดใจ"
      - third_factor: SUN
        meaning_th: "ตัดสินใจแต่งงานอย่างรวดเร็ว เหตุการณ์ฉับพลันในชีวิตแต่งงาน วันหรือเหตุการณ์ที่น่าตื่นเต้น"
      - third_factor: A
        meaning_th: "งานแต่งงานฉับพลันของผู้อื่น พบตัวเองอยู่ในกลุ่มคนใหม่อย่างฉับพลัน"
      - third_factor: MOON
        meaning_th: "ผู้หญิงที่แต่งงานอย่างรวดเร็ว รวมกลุ่มกันฉับพลันในที่สาธารณะ บุคคลที่ตัดสินใจเข้าร่วมสมาคมหรือกลุ่มใดกลุ่มหนึ่งอย่างรวดเร็ว"
      - third_factor: NODE
        meaning_th: "เกี่ยวข้องกับการแต่งงานที่รวดเร็ว ตัดสินใจเห็นด้วยกับสิ่งใดสิ่งหนึ่งอย่างรวดเร็ว"
      - third_factor: MERCURY
        meaning_th: "โทรเลขแสดงความยินดี สนทนาเรื่องใหม่ๆ ทางศิลปะ เท่ากับศุกร์ คือคิดถึงศิลปะการขับร้อง"
      - third_factor: VENUS
        meaning_th: "การแสดงความรักฉับพลันในชีวิตแต่งงาน ความเป็นหุ้นส่วนที่กลมกลืนกันฉับพลัน"
      - third_factor: MARS
        meaning_th: "ฉากที่ไม่น่าพอใจฉับพลันในชีวิตแต่งงาน"
      - third_factor: JUPITER
        meaning_th: "การแต่งงานฉับพลันที่ลงเอยด้วยความสุข ช่วงเวลาแห่งความสุขในชีวิตแต่งงาน"
      - third_factor: SATURN
        meaning_th: "การแต่งงานหรือความสัมพันธ์ถูกพรากจากกันฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "การแต่งงานถูกพรากด้วยความตาย สัญญาณการล่มสลายในชุมชน การล่มสลายของสหภาพปฏิวัติ"
      - third_factor: PLUTO
        meaning_th: "สมาชิกในครอบครัวเพิ่มขึ้นฉับพลัน"
      - third_factor: HADES
        meaning_th: "การเปลี่ยนแปลงฉับพลันในชีวิตแต่งงานที่เกิดจากความเจ็บป่วยหรือความยากจน สมาคมที่ทนทุกข์จากความขาดแคลน หรือจากความเจ็บป่วยหรือความยากจนของสมาชิก"
      - third_factor: ZEUS
        meaning_th: "ความล่มสลายฉับพลันในชีวิตแต่งงาน ไฟไหม้สถานประกอบการขนาดใหญ่จากการระเบิด การต่อต้านอย่างแข็งขัน ความมั่นคงหนักแน่น"
      - third_factor: KRONOS
        meaning_th: "การแต่งงานที่สำเร็จด้วยอำนาจรัฐ เข้าร่วมสมาคมตามคำสั่งของรัฐ"
      - third_factor: APOLLON
        meaning_th: "งานแต่งงานหมู่ หลายคนตัดสินใจแต่งงานฉับพลัน การประชุมใหญ่ ชมรมโหราศาสตร์"
      - third_factor: ADMETOS
        meaning_th: "การสูญเสียบุคคลจำนวนมากในชุมชนหรือในครอบครัว"
      - third_factor: VULKANUS
        meaning_th: "ชีวิตแต่งงานถูกกระทบกระเทือนหรือสั่นคลอน เช่นเดียวกับชีวิตในชุมชน"
      - third_factor: POSEIDON
        meaning_th: "การก่อตั้ง สถาปนา หรือเข้าร่วมสมาคมที่มุ่งเป้าหมายด้านปรัชญา การโฆษณาชวนเชื่อ และวัฒนธรรม"

  - factors: [URANUS, HADES]
    keyword_en: "Accident. Murder. War atrocities. Sudden mean acts. Grave damages. Outstanding loathsomeness and disgust."
    entries:
      - third_factor: M
        meaning_th: "ตกอยู่ในอันตรายจากการถูกฆาตกรรม เป็นต้นเหตุแห่งความตาย ทนทุกข์จากการกระทำที่ต่ำช้าและชั่วร้าย รู้สึกขยะแขยงและรังเกียจฉับพลัน"
      - third_factor: ARIES
        meaning_th: "การฆาตกรรมฉับพลัน เหตุการณ์ไม่คาดคิดที่คร่าชีวิตผู้คน"
      - third_factor: SUN
        meaning_th: "การฆาตกรรมในวันนั้น ตายด้วยความตายที่ผิดปกติ ชายที่เผชิญอิทธิพลร้ายต่อสุขภาพฉับพลัน วันที่อันตรายซุ่มรอ"
      - third_factor: A
        meaning_th: "การฆาตกรรมของคนรู้จัก ต้องเกี่ยวข้องกับคนชั้นต่ำ ต้องระวังการกระทำอันน่าเกลียดของผู้อื่น"
      - third_factor: MOON
        meaning_th: "การฆาตกรรมผู้หญิง จุดจบอันร้ายแรงของผู้หญิง บุคคลที่มีชื่อเสียงต่ำ"
      - third_factor: NODE
        meaning_th: "เกี่ยวข้องกับคดีฆาตกรรม พัวพันฉับพลันกับการทรยศที่น่าเกลียดและเจ้าเล่ห์"
      - third_factor: MERCURY
        meaning_th: "ความคิดฆาตกรรมเกิดขึ้นฉับพลัน ลางสังหรณ์แห่งความตาย ต้องตายด้วยความตายที่ผิดปกติ"
      - third_factor: VENUS
        meaning_th: "การฆาตกรรมผู้หญิง การฆาตกรรมที่มีการข่มขืนนำหน้า ผู้หญิงในตำแหน่งผู้รับใช้"
      - third_factor: MARS
        meaning_th: "พยายามฆาตกรรม ความตายฉับพลันด้วยอาวุธหรือวัตถุอื่น ความตายจากบาดแผล การกระทำต่ำช้าฉับพลัน เท่ากับจันทร์/ซุส คือตายจากถูกไฟลวก ตายในเหมือง"
      - third_factor: JUPITER
        meaning_th: "ตายอย่างรวดเร็วด้วยการฆาตกรรมหรืออุบัติเหตุ โชคดีในเรื่องอันตรายหรือภารกิจเสี่ยง หลีกเลี่ยงหรือรอดพ้นจากอันตราย"
      - third_factor: SATURN
        meaning_th: "การพลัดพรากหรือความสูญเสียจากการฆาตกรรม ความเจ้าเล่ห์อันต่ำช้าและน่าเกลียด เท่ากับอาเซนแดนต์ คือพลัดพรากจากผู้อื่นฉับพลัน"
      - third_factor: NEPTUNE
        meaning_th: "การฆาตกรรมผ่านการทรยศ พินาศด้วยน้ำ ไร้หนทางช่วยเหลือตัวเองหรือไร้การป้องกัน"
      - third_factor: PLUTO
        meaning_th: "เป็นต้นเหตุหรือผู้ยุยงการกระทำต่ำช้า การถูกปฏิเสธการเปลี่ยนแปลงที่เราหวังหรือปรารถนา"
      - third_factor: CUPIDO
        meaning_th: "การฆาตกรรมในงานเฉลิมฉลอง ตายท่ามกลางผู้อื่น ความยากจนฉับพลัน"
      - third_factor: ZEUS
        meaning_th: "ความตายจากไฟไหม้ จากสงคราม การฆาตกรรมด้วยอาวุธปืนหรืออาวุธสงคราม โชคร้ายฉับพลันจากไฟไหม้ การทำแท้ง การกระทำต่ำช้าที่วางแผนและดำเนินการอย่างดี เท่ากับอังคาร คือโทษประหารชีวิต"
      - third_factor: KRONOS
        meaning_th: "ความตาย (การฆาตกรรม) ของบุคคลที่มีตำแหน่งสูง โชคร้ายใหญ่หลวง การกระทำชั่วร้ายและต่ำช้าครั้งใหญ่ เท่ากับอังคาร คือโทษประหารชีวิตโดยรัฐ"
      - third_factor: APOLLON
        meaning_th: "คนจำนวนมากต่ำช้า ทนทุกข์จากการกระทำต่ำช้าร่วมกับคนหมู่มาก โหราศาสตร์ที่ขายตามงานวัดในนิตยสารราคาถูก วิทยาศาสตร์เทียม การค้นพบทางประวัติศาสตร์วิทยาศาสตร์"
      - third_factor: ADMETOS
        meaning_th: "ความเสียหายที่ไม่อาจชดใช้คืนได้ รอยฉีกขาด สิ่งที่แตกหักหรือขาดวิ่นซึ่งไม่อาจซ่อมแซมหรือทดแทนได้ การทำลายล้าง ศัตรูที่จะไม่มีวันคืนดี"
      - third_factor: VULKANUS
        meaning_th: "การฆาตกรรมร้ายแรง อันตรายจากสงครามครั้งใหญ่ ตกอยู่ในอันตรายใหญ่หลวงฉับพลัน"
      - third_factor: POSEIDON
        meaning_th: "การตรวจพบการกระทำต่ำช้า การฆาตกรรม มองทะลุการกระทำอันน่าเกลียด"

  - factors: [URANUS, ZEUS]
    keyword_en: "Sudden outbreak of war. Fire explosion. Bolt of lightning. Electric motor. Dynamo. Fierce fire. Discharge of firearms. To fire, to splinter. The will."
    entries:
      - third_factor: M
        meaning_th: "พลังใจที่แข็งขัน ผู้เผด็จการ ถูกครอบงำด้วยพลังภายใน"
      - third_factor: ARIES
        meaning_th: "การกระทำรุนแรงดุเดือด พายุ การปะทุ สาธารณชนถูกบังคับด้วยกำลัง ตึงเครียดและพร้อมรบ"
      - third_factor: SUN
        meaning_th: "การระเบิดรุนแรงฉับพลันในวันนั้น บุคคลผู้ใช้ความรุนแรง ชายที่มุ่งมั่นและกำหนดทิศทางความคิดและพลังของตน วันแห่งความสำเร็จอันยิ่งใหญ่"
      - third_factor: A
        meaning_th: "ร่วมทุกข์จากความเสียหายที่เกิดจากฟ้าผ่า ตกอยู่ภายใต้เจตจำนงของผู้อื่น ยอมจำนนต่อผู้อื่น"
      - third_factor: MOON
        meaning_th: "การระเบิดรุนแรงฉับพลันในชั่วโมงนั้น ความเกรี้ยวกราด ผู้ที่เชื่อฟังคำสั่ง รับฟังบัญชาการ กระตือรือร้นและพร้อม ชาติที่ลุกขึ้นจับอาวุธ"
      - third_factor: NODE
        meaning_th: "เกี่ยวข้องกับพลังแห่งธรรมชาติ พลังใหญ่ ร่วมมือกันทำงานอย่างแข็งขัน"
      - third_factor: MERCURY
        meaning_th: "สั่งการอย่างฉับพลันและเข้มแข็ง คิดรวดเร็วดั่งสายฟ้าแลบ ความคิดสร้างสรรค์ที่น่าประหลาดใจ"
      - third_factor: VENUS
        meaning_th: "การให้กำเนิดบุตรสาว กลมกลืนกับพลังธรรมชาติ ประสานและกำหนดทิศทางพลังแห่งธรรมชาติ"
      - third_factor: MARS
        meaning_th: "การให้กำเนิดบุตรชาย ระเบิดมือ เท่ากับฮาเดส คือความเสียหายจากระเบิดมือ การระเบิด ระเบิด เท่ากับมิเดียม คือวิศวกรไฟฟ้า"
      - third_factor: JUPITER
        meaning_th: "พลังที่เอื้อประโยชน์ พายุฝนเขตร้อน"
      - third_factor: SATURN
        meaning_th: "พายุฉับพลัน ความสูญเสียจากการระเบิด หรือจากความรุนแรง ความตายจากสิ่งเหล่านั้น พายุฝนฟ้าคะนองพร้อมความเสียหาย"
      - third_factor: NEPTUNE
        meaning_th: "พายุฝนฟ้าคะนอง พายุฉับพลันในทะเล ไร้หนทางต้านทานพลังเหล่านี้ เท่ากับอังคาร คือการทำลายล้างด้วยวัตถุระเบิดหรือกระสุนปืน"
      - third_factor: PLUTO
        meaning_th: "ผลผลิตพุ่งสูงขึ้นฉับพลันจากการพัฒนาพลังภายในหรือภายนอก ควบคุมพลังภายในด้วยเจตจำนง"
      - third_factor: CUPIDO
        meaning_th: "การให้กำเนิดบุตรในชีวิตแต่งงาน การระดมยิงอาวุธ บังคับเจตจำนงของตนต่อผู้อื่น ครอบงำผู้อื่น"
      - third_factor: HADES
