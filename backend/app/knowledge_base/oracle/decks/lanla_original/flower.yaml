category: flower
category_th: "ดอกไม้แห่งจิตวิญญาณ"
cards:
  - id: flower_lotus
    name_th: "บัว"
    keywords: ["การตื่นรู้", "ความบริสุทธิ์", "การเติบโตทางใจ"]
    meaning: "แม้อยู่ท่ามกลางโคลนตม จิตใจของคุณยังผลิบานได้อย่างบริสุทธิ์"
    voice_th: "ฉันคือดอกบัว ผลิบานอยู่เหนือโคลนตมโดยไม่แปดเปื้อน แม้คุณจะอยู่ท่ามกลางความสกปรกวุ่นวายตอนนี้ ใจของคุณก็ยังบริสุทธิ์และงอกงามได้ เพียงอย่าลืมว่ารากของฉันยังคงอยู่ในโคลนนั้น การเติบโตทางใจไม่ได้แปลว่าต้องหนีจากความจริงที่ยากลำบาก"

  - id: flower_jasmine
    name_th: "มะลิ"
    keywords: ["ความรักบริสุทธิ์", "ความกตัญญู", "ความอ่อนโยน"]
    meaning: "ความรักที่ไม่มีเงื่อนไขจากคนใกล้ตัวคือพลังที่หล่อเลี้ยงคุณอยู่"
    voice_th: "ฉันคือดอกมะลิ กลิ่นหอมที่ไม่เรียกร้องสิ่งตอบแทน ความรักที่ไม่มีเงื่อนไขจากคนใกล้ตัวคือพลังที่หล่อเลี้ยงคุณอยู่ตอนนี้ เพียงอย่าลืมมอบความรักแบบเดียวกันนั้นกลับไปให้พวกเขาบ้าง ไม่ใช่รับอยู่ฝ่ายเดียว"

  - id: flower_orchid
    name_th: "กล้วยไม้"
    keywords: ["ความประณีต", "คุณค่าที่ซ่อนอยู่", "ความอดทน"]
    meaning: "คุณค่าของคุณอาจไม่ได้ฉูดฉาด แต่ลึกซึ้งและควรค่าแก่การรอคอย"
    voice_th: "ฉันคือกล้วยไม้ เติบโตช้าแต่ไม่เคยหยาบง่าย คุณค่าของคุณอาจไม่ฉูดฉาด แต่ลึกซึ้งและควรค่าแก่การรอคอยเสมอ เพียงอย่าปล่อยให้ความอดทนนั้นกลายเป็นการรอให้คนอื่นมาเห็นคุณค่าแทนที่จะแสดงมันออกมาบ้าง"

  - id: flower_marigold
    name_th: "ดาวเรือง"
    keywords: ["สิริมงคล", "ความสำเร็จ", "พลังบวก"]
    meaning: "สัญญาณแห่งความเป็นสิริมงคลกำลังเข้ามา สิ่งที่ทำอยู่มีแนวโน้มไปได้สวย"
    voice_th: "ฉันคือดอกดาวเรือง สีทองที่ผู้คนวางไว้บูชาความเป็นสิริมงคล สัญญาณดีๆ ด้านการเงินกำลังเข้ามาหาคุณ สิ่งที่ทำอยู่มีแนวโน้มไปได้สวย เพียงอย่าลืมว่าสิริมงคลจะเกิดผลก็ต่อเมื่อคุณยังลงมือทำต่อ ไม่ใช่รอโชคอย่างเดียว"

  - id: flower_champa
    name_th: "จำปา"
    keywords: ["เสน่ห์", "ความน่าเชื่อถือ", "ความหอมที่ติดทน"]
    meaning: "เสน่ห์และความจริงใจของคุณจะเป็นที่จดจำ แม้เมื่อคุณไม่ได้อยู่ตรงนั้นแล้ว"
    voice_th: "ฉันคือดอกจำปา หอมติดทนแม้ดอกร่วงไปแล้ว เสน่ห์และความจริงใจของคุณจะเป็นที่จดจำ แม้เมื่อคุณไม่ได้อยู่ตรงนั้นแล้วก็ตาม เพียงจำไว้ว่าสิ่งที่ทิ้งไว้ให้คนจดจำควรเป็นความจริงใจ ไม่ใช่แค่ภาพลักษณ์ที่ดูดี"

  - id: flower_ratchaphruek
    name_th: "ราชพฤกษ์"
    keywords: ["เกียรติยศ", "ความภาคภูมิใจ", "ผลสำเร็จที่รอคอย"]
    meaning: "ผลสำเร็จที่รอคอยมานานกำลังผลิบาน จงภาคภูมิใจในสิ่งที่ทำมา"
    voice_th: "ฉันคือดอกราชพฤกษ์ บานพร้อมกันทั้งต้นหลังรอคอยมาทั้งปี ผลสำเร็จที่คุณรอคอยมานานกำลังผลิบาน จงภาคภูมิใจในสิ่งที่ทำมาทั้งหมด เพียงอย่าลืมว่าฉันบานแค่ช่วงเวลาสั้นๆ เท่านั้น จงเก็บเกี่ยวความสำเร็จนี้ให้ทันเวลา"

  - id: flower_hibiscus
    name_th: "ชบา"
    keywords: ["พลังชีวิต", "ความสดใส", "การเริ่มต้นวันใหม่"]
    meaning: "เติมพลังชีวิตให้ตัวเองใหม่ทุกเช้า แล้วความสดใสจะกลับมาเอง"
    voice_th: "ฉันคือดอกชบา บานใหม่ทุกเช้าโดยไม่เหนื่อยหน่าย เติมพลังชีวิตให้ตัวเองใหม่ทุกวันเถิด แล้วความสดใสจะกลับมาเอง เพียงอย่าลืมว่าฉันก็ร่วงในตอนเย็นเช่นกัน ทุกวันจึงต้องเริ่มเติมพลังใหม่ ไม่ใช่หวังว่าครั้งเดียวจะพอไปตลอด"

  - id: flower_gardenia
    name_th: "พุด"
    keywords: ["ความสงบ", "ความเรียบง่าย", "ความสะอาดใจ"]
    meaning: "ความสุขที่แท้จริงบางครั้งอยู่ในความเรียบง่ายที่คุณมองข้ามไป"
    voice_th: "ฉันคือดอกพุด ไม่ต้องสีสันฉูดฉาดก็หอมได้ ความสุขที่แท้จริงบางครั้งอยู่ในความเรียบง่ายที่คุณมองข้ามไป เพียงอย่าให้ความเรียบง่ายนั้นกลายเป็นข้ออ้างที่จะไม่ไขว่คว้าสิ่งที่ยังอยากได้จริงๆ"

  - id: flower_rose
    name_th: "กุหลาบ"
    keywords: ["ความรักลึกซึ้ง", "ความหลงใหล", "หนามแห่งบทเรียน"]
    meaning: "ความรักที่ลึกซึ้งมักมาพร้อมบทเรียน อย่ากลัวหนามที่แฝงอยู่ในความงาม"
    voice_th: "ฉันคือดอกกุหลาบ งดงามและมีหนามในต้นเดียวกัน ความรักที่ลึกซึ้งมักมาพร้อมบทเรียน อย่ากลัวหนามที่แฝงอยู่ในความงามนั้น เพียงอย่าปล่อยให้หนามของอีกฝ่ายทิ่มแทงคุณซ้ำๆ จนลืมว่าความรักไม่ควรเจ็บตลอดเวลา"

  - id: flower_sunflower
    name_th: "ทานตะวัน"
    keywords: ["ความหวัง", "พลังบวก", "การหันหน้าเข้าหาแสง"]
    meaning: "หันหน้าเข้าหาสิ่งที่ให้พลังบวกกับคุณเสมอ เหมือนทานตะวันที่หันหาแสงแดด"
    voice_th: "ฉันคือดอกทานตะวัน หันหน้าตามแสงแดดเสมอไม่ว่าฟ้าจะครึ้มแค่ไหน หันหน้าเข้าหาสิ่งที่ให้พลังบวกกับคุณเถิด เหมือนที่ฉันไม่เคยหันหลังให้แสง เพียงอย่าลืมว่าบางวันฟ้าก็มืดจนมองไม่เห็นแสงเลย นั่นไม่ใช่ความผิดของคุณ แค่รอวันที่ฟ้าเปิดอีกครั้ง"

  - id: flower_everlasting
    name_th: "บานไม่รู้โรย"
    keywords: ["ความทรงจำ", "ความยั่งยืน", "คุณค่าที่คงอยู่"]
    meaning: "สิ่งที่คุณสร้างไว้ด้วยใจจะคงอยู่และมีความหมายไปอีกนาน"
    voice_th: "ฉันคือดอกบานไม่รู้โรย เก็บสีสันไว้ได้แม้เวลาผ่านไป สิ่งที่คุณสร้างไว้ด้วยใจจะคงอยู่และมีความหมายไปอีกนาน เพียงอย่าลืมดูแลมันบ้าง แม้จะบานไม่รู้โรยก็ยังต้องการการดูแลเพื่อไม่ให้ฝุ่นจับ"

  - id: flower_ixora
    name_th: "เข็ม"
    keywords: ["ปัญญา", "ความเฉียบคม", "ความแม่นยำ"]
    meaning: "ใช้คำพูดและการตัดสินใจอย่างแหลมคมแต่มีเมตตากำกับ"
    voice_th: "ฉันคือดอกเข็ม เล็กแต่แหลมคม ใช้คำพูดและการตัดสินใจของคุณอย่างแม่นยำ แต่อย่าลืมมีเมตตากำกับไว้เสมอ เพราะความแม่นยำที่ไร้เมตตาก็ทำร้ายคนได้ไม่ต่างจากหนามที่ทิ่มแทงโดยไม่ตั้งใจ"

  - id: flower_frangipani
    name_th: "ลีลาวดี"
    keywords: ["การเริ่มต้นใหม่", "ความงามหลังบาดแผล", "การผลิใบใหม่"]
    meaning: "แม้ผ่านช่วงที่โรยราหรือถูกตัดแต่ง คุณจะผลิดอกใหม่ที่งดงามกว่าเดิม"
    voice_th: "ฉันคือดอกลีลาวดี ผลิใหม่ได้แม้ถูกตัดกิ่งจนโกร๋น แม้คุณจะผ่านช่วงที่โรยราหรือถูกตัดแต่งมา คุณจะผลิดอกใหม่ที่งดงามกว่าเดิมแน่นอน เพียงให้เวลาแผลนั้นแห้งสนิทก่อน อย่าเร่งให้ดอกบานเร็วเกินไปจนรากยังไม่แข็งแรงพอ"

  - id: flower_kraweg
    name_th: "การเวก"
    keywords: ["ความคิดถึง", "ความผูกพัน", "อดีตที่หอมหวาน"]
    meaning: "ความทรงจำในอดีตยังคงหอมหวานอยู่ในใจ แต่ไม่จำเป็นต้องฉุดรั้งปัจจุบัน"
    voice_th: "ฉันคือดอกการเวก ส่งกลิ่นหอมมาตามลมยามค่ำคืน ความทรงจำในอดีตยังคงหอมหวานอยู่ในใจคุณ แต่ไม่จำเป็นต้องฉุดรั้งปัจจุบันไว้ เพียงอย่าใช้กลิ่นหอมของอดีตกลบกลิ่นของสิ่งใหม่ที่กำลังรอให้คุณค้นพบ"

  - id: flower_kradangnga
    name_th: "กระดังงา"
    keywords: ["เสน่ห์ที่ซ่อนเร้น", "ความลึกซึ้ง", "การค้นพบทีละน้อย"]
    meaning: "เสน่ห์ที่แท้จริงของคุณจะค่อยๆ เผยออกมาให้คนที่ใส่ใจได้สัมผัส"
    voice_th: "ฉันคือดอกกระดังงา ซ่อนกลิ่นหอมไว้ให้คนที่ใส่ใจได้ค้นพบทีละน้อย เสน่ห์ที่แท้จริงของคุณจะค่อยๆ เผยออกมาเองเมื่อถึงเวลา เพียงอย่าซ่อนตัวเองไว้นานเกินไปจนไม่มีใครมีโอกาสได้ค้นพบคุณเลย"

  - id: flower_bougainvillea
    name_th: "เฟื่องฟ้า"
    keywords: ["ความทนทาน", "พลังชีวิต", "ความบานสะพรั่งแม้ในที่แล้ง"]
    meaning: "แม้สภาพแวดล้อมจะไม่เอื้ออำนวย คุณก็ยังบานสะพรั่งได้ด้วยพลังของตัวเอง"
    voice_th: "ฉันคือดอกเฟื่องฟ้า บานสะพรั่งได้แม้ในดินแล้งที่ไม่เอื้ออำนวย แม้สภาพแวดล้อมรอบตัวคุณจะไม่เป็นใจ คุณก็ยังบานได้ด้วยพลังของตัวเอง เพียงอย่าลืมว่าความทนทานไม่ได้แปลว่าต้องอยู่ในดินแล้งนั้นตลอดไปโดยไม่มองหาที่ที่ดีกว่า"

  - id: flower_lantana
    name_th: "ผกากรอง"
    keywords: ["การเยียวยา", "ขอบเขตที่ดีต่อใจ", "การฟื้นตัว"]
    meaning: "การตั้งขอบเขตให้ตัวเองคือส่วนหนึ่งของการเยียวยา ไม่ใช่ความเห็นแก่ตัว"
    voice_th: "ฉันคือดอกผกากรอง ขึ้นเป็นพุ่มที่มีขอบเขตของตัวเองชัดเจน การตั้งขอบเขตให้ตัวเองคือส่วนหนึ่งของการเยียวยา ไม่ใช่ความเห็นแก่ตัวอย่างที่คุณกลัว เพียงอย่าให้ขอบเขตนั้นแน่นหนาจนไม่มีใครเข้าใกล้คุณได้เลย"

  - id: flower_goldenshower_vine
    name_th: "สร้อยทอง"
    keywords: ["ความมั่งคั่งค่อยเป็นค่อยไป", "ความอดทนทางการเงิน", "ผลตอบแทนที่สั่งสม"]
    meaning: "ความมั่งคั่งที่แท้จริงเติบโตทีละน้อยอย่างมั่นคง ไม่ใช่ทางลัด"
    voice_th: "ฉันคือดอกสร้อยทอง ร้อยเรียงกลีบทีละดอกจนเป็นพวงยาว ความมั่งคั่งที่แท้จริงเติบโตทีละน้อยอย่างมั่นคง ไม่ใช่ทางลัดอย่างที่ใจร้อนอยากได้ เพียงอย่าให้ความมั่นคงนั้นกลายเป็นข้ออ้างที่จะไม่กล้าลงทุนอะไรเลย"

  - id: flower_bullet_wood
    name_th: "พิกุล"
    keywords: ["ความคิดถึงอดีต", "ความอบอุ่นในความทรงจำ", "รากเหง้า"]
    meaning: "หวนกลับไปทบทวนความทรงจำดีๆ จะช่วยเติมพลังใจให้ก้าวต่อไปได้"
    voice_th: "ฉันคือดอกพิกุล หอมกรุ่นอยู่ในความทรงจำแม้ดอกจะร่วงไปนานแล้ว หวนกลับไปทบทวนความทรงจำดีๆ เถิด มันจะช่วยเติมพลังใจให้ก้าวต่อไปได้ เพียงอย่าอยู่ในความทรงจำนั้นนานจนลืมสร้างความทรงจำใหม่ในวันนี้"

  - id: flower_saraphi
    name_th: "สายหยุด"
    keywords: ["การหยุดพัก", "การใคร่ครวญ", "จังหวะเวลา"]
    meaning: "หยุดสักครู่เพื่อทบทวนก่อนตัดสินใจต่อ การเร่งรีบตอนนี้อาจไม่ใช่คำตอบ"
    voice_th: "ฉันคือดอกสายหยุด บานช้าและหยุดคิดก่อนผลิกลีบ หยุดสักครู่เพื่อทบทวนก่อนตัดสินใจต่อ การเร่งรีบตอนนี้อาจไม่ใช่คำตอบ เพียงอย่าหยุดนานจนโอกาสที่รออยู่เลยผ่านไปโดยไม่ทันรู้ตัว"

  - id: flower_thongkwao
    name_th: "ทองกวาว"
    keywords: ["ความรักที่เร่าร้อน", "ตำนานรัก", "ความกล้าแสดงออก"]
    meaning: "ความรู้สึกที่ซ่อนไว้นานอาจถึงเวลาต้องเปิดเผยออกมาอย่างกล้าหาญ เหมือนดอกทองกวาวที่บานสะพรั่งทั้งต้นในคราวเดียว"
    voice_th: "ฉันคือดอกทองกวาว บานสะพรั่งทั้งต้นในคราวเดียวโดยไม่กลัวใครมอง ความรู้สึกที่คุณซ่อนไว้นานอาจถึงเวลาต้องเปิดเผยออกมาอย่างกล้าหาญ เหมือนที่ฉันไม่เคยอายที่จะบาน เพียงเลือกจังหวะและคนที่ใช่ในการเปิดเผยนั้นด้วย ไม่ใช่ทุกที่จะปลอดภัยสำหรับความรู้สึกจริงของคุณ"

