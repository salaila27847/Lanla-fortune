category: guardian
category_th: "เทวดา & นางฟ้าผู้พิทักษ์"
cards:
  - id: guardian_new_beginnings
    name_th: "เทวดาแห่งการเริ่มต้นใหม่"
    keywords: ["เริ่มต้นใหม่", "โอกาส", "ความหวัง"]
    meaning: "ประตูบทใหม่กำลังเปิดออก อย่ากลัวที่จะก้าวออกจากสิ่งเดิมที่คุ้นเคย"
    voice_th: "ฉันคือเทวดาแห่งการเริ่มต้นใหม่ ประตูบทใหม่กำลังเปิดออกตรงหน้าคุณ อย่ากลัวที่จะก้าวข้ามธรณีประตูออกจากสิ่งเดิมที่คุ้นเคย เพียงอย่าลืมปิดประตูเก่าให้เรียบร้อยก่อนก้าวไป ไม่เช่นนั้นบทเรียนเดิมจะตามคุณเข้าไปในบทใหม่ด้วย"

  - id: guardian_courage
    name_th: "นางฟ้าแห่งความกล้าหาญ"
    keywords: ["ความกล้า", "เผชิญหน้า", "พลังใจ"]
    meaning: "ถึงเวลาเผชิญหน้ากับสิ่งที่คุณเลี่ยงมานาน คุณมีพลังมากพอแล้ว"
    voice_th: "ฉันคือนางฟ้าแห่งความกล้าหาญ ยืนอยู่เคียงข้างคุณในสนามรบที่ไม่มีใครเห็น คุณมีพลังมากพอแล้วที่จะเผชิญหน้ากับสิ่งที่เลี่ยงมานาน เพียงจำไว้ว่าความกล้าที่แท้จริงไม่ใช่การไม่กลัว แต่คือการก้าวต่อไปทั้งที่ยังกลัวอยู่"

  - id: guardian_love
    name_th: "เทวดาแห่งความรัก"
    keywords: ["ความรัก", "เปิดใจ", "ความสัมพันธ์"]
    meaning: "เปิดใจรับความรักโดยไม่ต้องตั้งกำแพงป้องกันไว้ก่อน"
    voice_th: "ฉันคือเทวดาแห่งความรัก โอบกอดคุณไว้แม้คุณจะปิดใจอยู่ก็ตาม เปิดใจรับความรักเถิดโดยไม่ต้องก่อกำแพงป้องกันไว้ก่อน แต่การเปิดใจไม่ได้แปลว่าต้องทิ้งขอบเขตของตัวเองไปด้วย รักใครก็ยังต้องรักษาตัวตนของคุณไว้"

  - id: guardian_forgiveness
    name_th: "นางฟ้าแห่งการให้อภัย"
    keywords: ["ให้อภัย", "ปล่อยวาง", "เยียวยาใจ"]
    meaning: "การให้อภัยไม่ได้แปลว่าลืม แต่คือการปลดปล่อยตัวเองจากภาระเก่า"
    voice_th: "ฉันคือนางฟ้าแห่งการให้อภัย มาปลดโซ่ที่คุณผูกตัวเองไว้กับอดีต การให้อภัยไม่ได้แปลว่าลืม แต่คือการปลดปล่อยตัวเองจากภาระเก่าที่แบกมานาน เพียงรู้ไว้ว่าการให้อภัยไม่ได้บังคับให้คุณต้องเปิดประตูรับคนคนนั้นกลับมาเสมอไป"

  - id: guardian_fortune
    name_th: "เทวดาแห่งโชคลาภ"
    keywords: ["โชคลาภ", "การเงิน", "ความสำเร็จ"]
    meaning: "สัญญาณโอกาสด้านการเงินกำลังเข้ามา จับจังหวะให้ทันแล้วลงมือ"
    voice_th: "ฉันคือเทวดาแห่งโชคลาภ ถือถุงทองมาเคาะประตูใจคุณ สัญญาณโอกาสด้านการเงินกำลังเข้ามา จับจังหวะให้ทันแล้วลงมือ เพียงอย่าให้ความโลภมาบดบังจนมองไม่เห็นความเสี่ยงที่ซ่อนอยู่ในโอกาสนั้น"

  - id: guardian_healing
    name_th: "นางฟ้าแห่งการเยียวยา"
    keywords: ["เยียวยา", "พักฟื้น", "สุขภาพ"]
    meaning: "ร่างกายและจิตใจต้องการเวลาพักฟื้น อย่าฝืนตัวเองต่อไป"
    voice_th: "ฉันคือนางฟ้าแห่งการเยียวยา วางมือลงบนหัวใจที่เหนื่อยล้าของคุณ ร่างกายและจิตใจของคุณต้องการเวลาพักฟื้น อย่าฝืนตัวเองต่อไปอีกเลย เพียงอย่าใช้การพักนี้เป็นข้ออ้างเลี่ยงสิ่งที่ต้องเผชิญตลอดไป การพักคือช่วงเตรียมพร้อม ไม่ใช่จุดหมายปลายทาง"

  - id: guardian_wisdom
    name_th: "เทวดาแห่งปัญญา"
    keywords: ["ปัญญา", "การตัดสินใจ", "สติ"]
    meaning: "ใช้สติไตร่ตรองให้รอบคอบก่อนตัดสินใจ คำตอบที่ถูกต้องอยู่ใกล้กว่าที่คิด"
    voice_th: "ฉันคือเทวดาแห่งปัญญา ส่องแสงนำทางให้คุณในความมืด ใช้สติไตร่ตรองให้รอบคอบก่อนตัดสินใจ คำตอบที่ถูกต้องอยู่ใกล้ตัวคุณกว่าที่คิด เพียงอย่าไตร่ตรองนานจนพลาดจังหวะที่ต้องลงมือทำ"

  - id: guardian_hope
    name_th: "นางฟ้าแห่งความหวัง"
    keywords: ["ความหวัง", "กำลังใจ", "แสงสว่าง"]
    meaning: "แม้ตอนนี้จะมืดมน แต่แสงสว่างที่ปลายทางกำลังรอคุณอยู่"
    voice_th: "ฉันคือนางฟ้าแห่งความหวัง จุดเทียนไว้รอคุณอยู่ปลายทาง แม้ตอนนี้จะมืดมนแค่ไหน แสงสว่างที่ปลายอุโมงค์ก็กำลังรอคุณอยู่ เพียงอย่าปล่อยให้ความหวังนั้นกลายเป็นการนั่งรอเฉยๆ แสงจะพาคุณไปถึงก็ต่อเมื่อคุณยังเดินอยู่"

  - id: guardian_protection
    name_th: "เทวดาแห่งการปกป้อง"
    keywords: ["ปกป้อง", "ความปลอดภัย", "คุ้มครอง"]
    meaning: "คุณได้รับการคุ้มครองอยู่ในเรื่องนี้ วางใจและเดินหน้าต่อไปได้"
    voice_th: "ฉันคือเทวดาแห่งการปกป้อง กางปีกคลุมคุณไว้โดยที่คุณอาจไม่ทันสังเกต คุณได้รับการคุ้มครองอยู่ในเรื่องนี้แล้ว วางใจแล้วเดินหน้าต่อไปได้เลย เพียงอย่าใช้ความอุ่นใจนี้เป็นข้ออ้างประมาทเลินเล่อ การคุ้มครองทำงานร่วมกับความรอบคอบของคุณเสมอ"

  - id: guardian_peace
    name_th: "นางฟ้าแห่งความสงบ"
    keywords: ["ความสงบ", "พักใจ", "สมดุล"]
    meaning: "ถอยออกมาจากความวุ่นวายสักครู่ เพื่อฟังเสียงหัวใจตัวเองอีกครั้ง"
    voice_th: "ฉันคือนางฟ้าแห่งความสงบ มาชวนให้คุณถอยออกมาจากความวุ่นวายสักครู่ เพื่อฟังเสียงหัวใจตัวเองอีกครั้ง เพียงอย่าใช้ความสงบนี้เป็นการหนีปัญหาที่ยังรอการแก้ไขอยู่จริงๆ"

  - id: guardian_abundance
    name_th: "เทวดาแห่งความอุดมสมบูรณ์"
    keywords: ["ความอุดมสมบูรณ์", "การเติบโต", "ผลลัพธ์"]
    meaning: "สิ่งที่คุณลงแรงไว้กำลังเติบโตและออกผล อดทนอีกนิดเดียว"
    voice_th: "ฉันคือเทวดาแห่งความอุดมสมบูรณ์ เฝ้าดูเมล็ดที่คุณปลูกไว้เติบโตทุกวัน สิ่งที่คุณลงแรงไว้กำลังออกผล อดทนอีกนิดเดียวเท่านั้น เพียงอย่าเก็บเกี่ยวก่อนที่ผลจะสุกเต็มที่ ความรีบร้อนจะทำให้รสชาติไม่ได้อย่างที่ควรจะเป็น"

  - id: guardian_truth
    name_th: "นางฟ้าแห่งสัจจะ"
    keywords: ["ความจริง", "ซื่อสัตย์", "ความชัดเจน"]
    meaning: "ถึงเวลาพูดความจริงกับตัวเองและคนรอบข้างอย่างตรงไปตรงมา"
    voice_th: "ฉันคือนางฟ้าแห่งสัจจะ ไม่มีสิ่งใดหลบซ่อนจากแสงของฉันได้ ถึงเวลาที่คุณต้องพูดความจริงกับตัวเองและคนรอบข้างอย่างตรงไปตรงมา เพียงจำไว้ว่าความจริงที่พูดโดยไม่มีความเมตตากำกับ อาจทำร้ายมากกว่าที่ตั้งใจ"

  - id: guardian_journey
    name_th: "เทวดาแห่งการเดินทาง"
    keywords: ["การเดินทาง", "การเปลี่ยนแปลง", "ก้าวสำคัญ"]
    meaning: "การเปลี่ยนสถานที่หรือเส้นทางครั้งนี้จะพาคุณไปพบสิ่งที่ดีกว่า"
    voice_th: "ฉันคือเทวดาแห่งการเดินทาง โบกมือเรียกคุณให้ก้าวออกไป การเปลี่ยนสถานที่หรือเส้นทางครั้งนี้จะพาคุณไปพบสิ่งที่ดีกว่าเดิม เพียงอย่าลืมว่าไม่ว่าจะเดินทางไปไกลแค่ไหน สิ่งที่ยังแก้ไม่ตกในใจก็จะติดตามคุณไปด้วยเสมอ"

  - id: guardian_family
    name_th: "นางฟ้าแห่งครอบครัว"
    keywords: ["ครอบครัว", "ความผูกพัน", "บ้าน"]
    meaning: "ให้เวลากับคนในครอบครัวมากขึ้น ความสัมพันธ์ตรงนี้คือรากฐานสำคัญ"
    voice_th: "ฉันคือนางฟ้าแห่งครอบครัว เฝ้าดูรากเหง้าที่คุณมาจาก ให้เวลากับคนในครอบครัวมากขึ้นเถิด เพราะความสัมพันธ์ตรงนี้คือรากฐานสำคัญของคุณ เพียงอย่าลืมว่าความใกล้ชิดที่ดีก็ยังต้องการพื้นที่ส่วนตัวของแต่ละคนด้วยเช่นกัน"

  - id: guardian_patience
    name_th: "เทวดาแห่งความอดทน"
    keywords: ["ความอดทน", "การรอคอย", "จังหวะเวลา"]
    meaning: "บางสิ่งยังไม่ถึงเวลา จงรอคอยด้วยความศรัทธาโดยไม่เร่งรัด"
    voice_th: "ฉันคือเทวดาแห่งความอดทน นั่งเฝ้าเวลาไปพร้อมกับคุณโดยไม่เร่งรีบ บางสิ่งยังไม่ถึงเวลา ขอให้คุณรอคอยด้วยความศรัทธา เพียงอย่าปล่อยให้การรอคอยกลายเป็นข้ออ้างที่จะไม่เตรียมตัวสำหรับวันที่มันมาถึง"

  - id: guardian_inspiration
    name_th: "นางฟ้าแห่งแรงบันดาลใจ"
    keywords: ["แรงบันดาลใจ", "ความคิดสร้างสรรค์", "จุดประกาย"]
    meaning: "ไอเดียที่แวบเข้ามาตอนนี้คุ้มค่าที่จะจดไว้และลงมือทำต่อ"
    voice_th: "ฉันคือนางฟ้าแห่งแรงบันดาลใจ กระซิบไอเดียไว้ในความฝันของคุณเมื่อคืน ไอเดียที่แวบเข้ามาตอนนี้คุ้มค่าที่จะจดไว้และลงมือทำต่อ เพียงอย่าปล่อยให้มันเป็นแค่ไอเดียที่สวยงามในหัวโดยไม่เคยได้ลงมือจริง"

  - id: guardian_justice
    name_th: "เทวดาแห่งความยุติธรรม"
    keywords: ["ความยุติธรรม", "สมดุล", "ผลของการกระทำ"]
    meaning: "ทุกการกระทำมีผลตอบแทนของมันเอง จงเลือกทางที่เป็นธรรมกับทุกฝ่าย"
    voice_th: "ฉันคือเทวดาแห่งความยุติธรรม ถือตาชั่งที่ไม่มีวันเอียงข้างใคร ทุกการกระทำมีผลตอบแทนของมันเอง จงเลือกทางที่เป็นธรรมกับทุกฝ่าย เพียงอย่าลืมว่าความยุติธรรมที่แท้จริงเริ่มจากการตัดสินตัวเองอย่างเป็นธรรมก่อนตัดสินคนอื่น"

  - id: guardian_release
    name_th: "นางฟ้าแห่งการปล่อยวาง"
    keywords: ["ปล่อยวาง", "ปิดฉาก", "เริ่มต้นใหม่"]
    meaning: "บางบทต้องปิดลงเพื่อให้บทใหม่เริ่มต้นได้ อย่ายึดติดกับสิ่งที่หมดเวลาแล้ว"
    voice_th: "ฉันคือนางฟ้าแห่งการปล่อยวาง มาเปิดมือคุณให้คลายจากสิ่งที่กำแน่นไว้ บางบทต้องปิดลงเพื่อให้บทใหม่เริ่มต้นได้ อย่ายึดติดกับสิ่งที่หมดเวลาแล้ว เพียงอย่าสับสนระหว่างการปล่อยวางกับการเก็บกดความรู้สึกไว้ข้างใน สิ่งหนึ่งคือการเยียวยา อีกสิ่งคือการซ่อนแผล"

  - id: guardian_friendship
    name_th: "เทวดาแห่งมิตรภาพ"
    keywords: ["มิตรภาพ", "คนรอบข้าง", "ความไว้ใจ"]
    meaning: "คนที่อยู่เคียงข้างคุณตอนนี้คือกำลังใจสำคัญ อย่าลืมขอบคุณพวกเขา"
    voice_th: "ฉันคือเทวดาแห่งมิตรภาพ ยืนอยู่เบื้องหลังคนที่รักคุณ คนที่อยู่เคียงข้างคุณตอนนี้คือกำลังใจสำคัญ อย่าลืมขอบคุณพวกเขาบ้าง เพียงอย่าพึ่งพาพวกเขาจนลืมว่าคุณเองก็ต้องยืนด้วยขาของตัวเองได้เช่นกัน"

  - id: guardian_destiny
    name_th: "นางฟ้าแห่งโชคชะตา"
    keywords: ["โชคชะตา", "จุดเปลี่ยน", "ความหมายชีวิต"]
    meaning: "คุณกำลังยืนอยู่ตรงจุดเปลี่ยนสำคัญ สิ่งที่เลือกตอนนี้จะกำหนดเส้นทางต่อไป"
    voice_th: "ฉันคือนางฟ้าแห่งโชคชะตา ยืนอยู่ตรงทางแยกกับคุณในวินาทีนี้ สิ่งที่คุณเลือกตอนนี้จะกำหนดเส้นทางต่อไปทั้งหมด เพียงจำไว้ว่าโชคชะตาเปิดทางให้เดิน แต่คนที่ต้องก้าวเท้าเองคือคุณ ไม่ใช่ฉัน"

  - id: guardian_gratitude
    name_th: "เทวดาแห่งความกตัญญู"
    keywords: ["ความกตัญญู", "การสำนึกบุญคุณ", "การมองเห็นคุณค่า"]
    meaning: "การหยุดขอบคุณสิ่งที่มีอยู่ตอนนี้ จะเปิดทางให้สิ่งดีๆ เข้ามาเพิ่มขึ้นอีก"
