id: lanla_original
name_th: "ลานลาออราเคิล"
name_en: "Lanla Oracle"
description: >
  ชุดไพ่ออราเคิลประจำแอป Lanla-fortune ผสาน 3 พลังนำทางเข้าด้วยกัน:
  เทวดา & นางฟ้าผู้พิทักษ์ (การนำทางจากภายนอก/คุณธรรม), สัตว์นำทางแบบไทย
  (สัญชาตญาณและบทเรียนจากธรรมชาติ), และดอกไม้แห่งจิตวิญญาณ (การเติบโตและอารมณ์)
  ออกแบบให้เป็นชุดไพ่หลักของแอป แต่ผู้ใช้เลือกสลับไปใช้ deck อื่นได้ในภายหลัง
  (ดู backend/app/knowledge_base/oracle/decks/ สำหรับ deck อื่นๆ ที่จะเพิ่มทีหลัง)
