# Major Arcana (22 cards) — standard divinatory meanings from the
# Rider-Waite-Smith tradition, written fresh in Thai. No reusable
# "Destiny Matrix" reference file was found in this GitHub account
# (checked 2026-08-12) — see knowledge_base/tarot/README.md.
cards:
  - id: major_00
    number: 0
    name_th: "เดอะฟูล (ผู้เดินทาง)"
    name_en: "The Fool"
    keywords_upright: ["เริ่มต้นใหม่", "ความเป็นไปได้", "ความไร้เดียงสา"]
    keywords_reversed: ["ประมาท", "ลังเล", "ก้าวพลาด"]
    meaning_upright: "จุดเริ่มต้นใหม่กำลังรอคุณอยู่ กล้าก้าวออกไปด้วยใจที่เปิดกว้าง แม้ยังมองไม่เห็นปลายทางชัดเจน"
    meaning_reversed: "ความประมาทหรือการก้าวโดยไม่ไตร่ตรองอาจนำไปสู่ความผิดพลาด ทบทวนก่อนตัดสินใจ"

  - id: major_01
    number: 1
    name_th: "นักมายากล"
    name_en: "The Magician"
    keywords_upright: ["พลังสร้างสรรค์", "ทรัพยากรพร้อม", "การลงมือทำ"]
    keywords_reversed: ["ศักยภาพที่ยังไม่ถูกใช้", "การบิดเบือน", "แผนที่ไม่รอบคอบ"]
    meaning_upright: "คุณมีทุกอย่างพร้อมแล้วที่จะเปลี่ยนความคิดให้เป็นจริง ใช้ทักษะและทรัพยากรที่มีอย่างมั่นใจ"
    meaning_reversed: "พรสวรรค์ที่มีอยู่ยังไม่ถูกดึงออกมาใช้เต็มที่ หรือกำลังใช้ความสามารถไปในทางที่ไม่ตรงไปตรงมา"

  - id: major_02
    number: 2
    name_th: "นักบวชหญิง"
    name_en: "The High Priestess"
    keywords_upright: ["สัญชาตญาณ", "ความรู้ที่ซ่อนอยู่", "การฟังเสียงภายใน"]
    keywords_reversed: ["ห่างจากสัญชาตญาณ", "ความลับที่ปกปิด", "ข้อมูลเริ่มเผยออกมา"]
    meaning_upright: "ฟังเสียงสัญชาตญาณของตัวเองให้มาก คำตอบที่แท้จริงอยู่ภายในมากกว่าคำแนะนำจากภายนอก"
    meaning_reversed: "คุณอาจกำลังตัดขาดจากสัญชาตญาณตัวเอง หรือมีบางอย่างถูกปิดบังที่ควรได้รับการเปิดเผย"

  - id: major_03
    number: 3
    name_th: "จักรพรรดินี"
    name_en: "The Empress"
    keywords_upright: ["ความอุดมสมบูรณ์", "การเติบโต", "ความเอื้ออาทร"]
    keywords_reversed: ["ความคิดสร้างสรรค์ติดขัด", "การละเลยตัวเอง", "พึ่งพาผู้อื่นมากไป"]
    meaning_upright: "ช่วงเวลาแห่งความอุดมสมบูรณ์และการเติบโต ทั้งในความคิดสร้างสรรค์ ความสัมพันธ์ และชีวิตความเป็นอยู่"
    meaning_reversed: "ความคิดสร้างสรรค์อาจกำลังชะงัก หรือคุณกำลังทุ่มเทให้ผู้อื่นจนละเลยการดูแลตัวเอง"

  - id: major_04
    number: 4
    name_th: "จักรพรรดิ"
    name_en: "The Emperor"
    keywords_upright: ["โครงสร้าง", "ความมั่นคง", "อำนาจที่มีเหตุผล"]
    keywords_reversed: ["ความเข้มงวดเกินไป", "การควบคุมที่ขาดยืดหยุ่น", "ขาดวินัย"]
    meaning_upright: "ถึงเวลาสร้างโครงสร้างและกฎเกณฑ์ที่ชัดเจนให้ชีวิต ความมั่นคงจะมาจากการวางแผนที่รอบคอบ"
    meaning_reversed: "การควบคุมที่มากเกินไปอาจทำให้ขาดความยืดหยุ่น หรือสถานการณ์กำลังขาดระเบียบที่ควรมี"

  - id: major_05
    number: 5
    name_th: "นักบวช (ปุโรหิต)"
    name_en: "The Hierophant"
    keywords_upright: ["ประเพณี", "การเรียนรู้จากผู้มีประสบการณ์", "ความเชื่อร่วม"]
    keywords_reversed: ["การท้าทายกรอบเดิม", "ความเชื่อส่วนตัว", "การต่อต้านขนบธรรมเนียม"]
    meaning_upright: "การขอคำแนะนำจากผู้มีประสบการณ์หรือระบบที่วางไว้แล้วจะช่วยให้คุณเดินไปถูกทาง"
    meaning_reversed: "ถึงเวลาตั้งคำถามกับกรอบเดิมและเชื่อในทางของตัวเองมากขึ้น แม้จะขัดกับขนบธรรมเนียม"

  - id: major_06
    number: 6
    name_th: "คู่รัก"
    name_en: "The Lovers"
    keywords_upright: ["ความสัมพันธ์", "การเลือกที่สอดคล้องกับคุณค่า", "ความกลมเกลียว"]
    keywords_reversed: ["ความไม่ลงรอย", "การตัดสินใจที่ค้างคา", "ความไม่สมดุลในความสัมพันธ์"]
    meaning_upright: "ความสัมพันธ์หรือทางเลือกสำคัญที่สอดคล้องกับคุณค่าในใจกำลังปรากฏชัด เลือกด้วยหัวใจที่ซื่อตรง"
    meaning_reversed: "อาจมีความไม่ลงรอยในความสัมพันธ์ หรือการตัดสินใจสำคัญที่ยังคาราคาซังอยู่"

  - id: major_07
    number: 7
    name_th: "รถศึก"
    name_en: "The Chariot"
    keywords_upright: ["ความมุ่งมั่น", "การควบคุมสถานการณ์", "ชัยชนะ"]
    keywords_reversed: ["ขาดทิศทาง", "สูญเสียการควบคุม", "พลังงานกระจัดกระจาย"]
    meaning_upright: "ด้วยความมุ่งมั่นและการควบคุมพลังทั้งสองด้านของตัวเอง คุณจะฝ่าฟันไปสู่ชัยชนะได้"
    meaning_reversed: "ทิศทางไม่ชัดเจนหรือกำลังเสียการควบคุม ควรหยุดทบทวนก่อนเดินหน้าต่อ"

  - id: major_08
    number: 8
    name_th: "พลัง"
    name_en: "Strength"
    keywords_upright: ["ความกล้าหาญอ่อนโยน", "ความเมตตา", "การควบคุมด้วยใจ"]
    keywords_reversed: ["ความไม่มั่นใจในตัวเอง", "การใช้กำลังแทนความอ่อนโยน", "อารมณ์ท่วมท้น"]
    meaning_upright: "พลังที่แท้จริงมาจากความอ่อนโยนและความเมตตา ไม่ใช่การใช้กำลังบังคับ"
    meaning_reversed: "ความไม่มั่นใจในตัวเองอาจกำลังฉุดรั้งคุณอยู่ หรืออารมณ์กำลังเข้าครอบงำเหตุผล"

  - id: major_09
    number: 9
    name_th: "ฤๅษี"
    name_en: "The Hermit"
    keywords_upright: ["การใคร่ครวญ", "การอยู่กับตัวเอง", "ปัญญาภายใน"]
    keywords_reversed: ["ความโดดเดี่ยว", "การหลีกหนีมากเกินไป", "ความเหงา"]
    meaning_upright: "ถอยออกมาอยู่กับตัวเองสักพักเพื่อค้นหาคำตอบจากภายใน คำตอบที่แท้จริงไม่ได้อยู่ข้างนอก"
    meaning_reversed: "การถอยห่างจากผู้คนนานเกินไปอาจกลายเป็นความโดดเดี่ยวที่ไม่ก่อประโยชน์"

  - id: major_10
    number: 10
    name_th: "กงล้อแห่งโชคชะตา"
    name_en: "Wheel of Fortune"
    keywords_upright: ["วัฏจักรชีวิต", "จุดเปลี่ยน", "โชคชะตา"]
    keywords_reversed: ["ความโชคร้ายชั่วคราว", "การต่อต้านการเปลี่ยนแปลง", "รู้สึกไร้อำนาจ"]
    meaning_upright: "ชีวิตกำลังเข้าสู่จุดเปลี่ยนสำคัญ วัฏจักรใหม่กำลังเริ่มต้น ปล่อยให้กระแสพาไป"
    meaning_reversed: "ช่วงเวลานี้อาจรู้สึกโชคไม่เข้าข้าง หรือกำลังต่อต้านการเปลี่ยนแปลงที่หลีกเลี่ยงไม่ได้"

  - id: major_11
    number: 11
    name_th: "ความยุติธรรม"
    name_en: "Justice"
    keywords_upright: ["ความเป็นธรรม", "ผลของการกระทำ", "ความจริง"]
    keywords_reversed: ["ความไม่เป็นธรรม", "การหลีกเลี่ยงความรับผิดชอบ", "การตัดสินใจที่ลำเอียง"]
    meaning_upright: "ทุกการกระทำมีผลของมันเอง ความจริงและความเป็นธรรมกำลังปรากฏชัดในสถานการณ์นี้"
    meaning_reversed: "อาจมีความไม่เป็นธรรมเกิดขึ้น หรือมีใครบางคน (อาจรวมถึงตัวคุณเอง) กำลังเลี่ยงความรับผิดชอบ"

  - id: major_12
    number: 12
    name_th: "ชายแขวนคอ"
    name_en: "The Hanged Man"
    keywords_upright: ["การหยุดพัก", "มุมมองใหม่", "การปล่อยวาง"]
    keywords_reversed: ["ความล่าช้าโดยไม่จำเป็น", "การต่อต้านการปล่อยวาง", "ความรู้สึกเป็นเหยื่อ"]
    meaning_upright: "หยุดพักและมองสถานการณ์จากมุมใหม่ บางครั้งการไม่ทำอะไรเลยคือคำตอบที่ถูกต้องที่สุด"
    meaning_reversed: "การยึดติดไม่ยอมปล่อยวางกำลังทำให้ติดหล่ม หรือรู้สึกเหมือนตกเป็นเหยื่อของสถานการณ์"

  - id: major_13
    number: 13
    name_th: "ความตาย"
    name_en: "Death"
    keywords_upright: ["การเปลี่ยนผ่าน", "การปิดฉาก", "การเริ่มต้นใหม่"]
    keywords_reversed: ["ต่อต้านการเปลี่ยนแปลง", "ความหยุดนิ่ง", "กลัวการสิ้นสุด"]
    meaning_upright: "บทหนึ่งกำลังจบลงเพื่อเปิดทางให้บทใหม่เริ่มต้น การเปลี่ยนแปลงนี้จำเป็นแม้จะเจ็บปวด"
    meaning_reversed: "คุณอาจกำลังต่อต้านการเปลี่ยนแปลงที่หลีกเลี่ยงไม่ได้ ทำให้ติดอยู่กับที่โดยไม่จำเป็น"

  - id: major_14
    number: 14
    name_th: "ความพอดี"
    name_en: "Temperance"
    keywords_upright: ["ความสมดุล", "ความอดทน", "การผสมผสาน"]
    keywords_reversed: ["ความไม่สมดุล", "ความสุดโต่ง", "ความขัดแย้งภายใน"]
    meaning_upright: "การผสมผสานสิ่งที่ดูขัดแย้งกันด้วยความอดทนและพอดี จะนำไปสู่ความสมดุลที่ยั่งยืน"
    meaning_reversed: "ชีวิตอาจกำลังเอียงไปทางสุดโต่งด้านใดด้านหนึ่ง ลองหาจุดสมดุลใหม่อีกครั้ง"

  - id: major_15
    number: 15
    name_th: "ปีศาจ"
    name_en: "The Devil"
    keywords_upright: ["ความยึดติด", "พันธนาการ", "วัตถุนิยม"]
    keywords_reversed: ["การปลดปล่อยตัวเอง", "การเลิกพฤติกรรมเดิม", "ทวงคืนอำนาจในชีวิต"]
    meaning_upright: "บางสิ่งกำลังผูกมัดคุณไว้ ไม่ว่าจะเป็นความกลัว นิสัย หรือความสัมพันธ์ที่ไม่เป็นผลดี"
    meaning_reversed: "ถึงเวลาปลดปล่อยตัวเองจากพันธนาการเดิมและทวงคืนอำนาจในชีวิตของตัวเอง"

  - id: major_16
    number: 16
    name_th: "หอคอย"
    name_en: "The Tower"
    keywords_upright: ["การเปลี่ยนแปลงฉับพลัน", "การเปิดเผยความจริง", "การพังทลายที่จำเป็น"]
    keywords_reversed: ["การเลี่ยงวิกฤต", "กลัวการเปลี่ยนแปลง", "ความพังทลายที่ถูกยืดออกไป"]
    meaning_upright: "โครงสร้างเดิมที่ไม่มั่นคงกำลังพังทลายลงอย่างฉับพลัน แม้เจ็บปวดแต่จะเปิดทางให้สิ่งที่แท้จริงกว่า"
    meaning_reversed: "คุณอาจกำลังหลีกเลี่ยงความจริงที่ต้องเผชิญ หรือความเปลี่ยนแปลงที่รอวันมาถึงถูกเลื่อนออกไป"

  - id: major_17
    number: 17
    name_th: "ดาว"
    name_en: "The Star"
    keywords_upright: ["ความหวัง", "แรงบันดาลใจ", "การเยียวยา"]
    keywords_reversed: ["ความสิ้นหวังชั่วคราว", "ขาดความเชื่อมั่น", "ห่างจากความหวัง"]
    meaning_upright: "หลังผ่านช่วงเวลาที่ยากลำบาก ความหวังและแรงบันดาลใจกำลังกลับคืนมา เชื่อในเส้นทางของตัวเอง"
    meaning_reversed: "อาจรู้สึกท้อแท้หรือขาดความเชื่อมั่นชั่วคราว ให้เวลาตัวเองได้เยียวยาก่อนก้าวต่อ"

  - id: major_18
    number: 18
    name_th: "ดวงจันทร์"
    name_en: "The Moon"
    keywords_upright: ["ความไม่ชัดเจน", "จิตใต้สำนึก", "ความกลัวที่ซ่อนอยู่"]
    keywords_reversed: ["ความสับสนเริ่มคลี่คลาย", "ปลดปล่อยความกลัว", "ความชัดเจนที่กำลังมา"]
    meaning_upright: "สถานการณ์ยังไม่ชัดเจน มีบางอย่างซ่อนอยู่ในจิตใต้สำนึกที่ควรได้รับการสำรวจอย่างระมัดระวัง"
    meaning_reversed: "ความสับสนหรือความกลัวที่เคยปกคลุมกำลังค่อยๆ คลี่คลาย ความชัดเจนกำลังใกล้เข้ามา"

  - id: major_19
    number: 19
    name_th: "ดวงอาทิตย์"
    name_en: "The Sun"
    keywords_upright: ["ความสำเร็จ", "ความสุข", "ความชัดเจน"]
    keywords_reversed: ["ความสุขที่ล่าช้า", "มองโลกในแง่ดีเกินไป", "ความสำเร็จที่ยังไม่เต็มที่"]
    meaning_upright: "ช่วงเวลาแห่งความสุข ความสำเร็จ และพลังชีวิตที่เต็มเปี่ยมกำลังส่องสว่างให้กับคุณ"
    meaning_reversed: "ความสุขหรือความสำเร็จอาจมาช้ากว่าที่คาดหวัง หรือกำลังมองสถานการณ์ในแง่ดีเกินจริง"

  - id: major_20
    number: 20
    name_th: "การพิพากษา"
    name_en: "Judgement"
    keywords_upright: ["การตื่นรู้", "การเรียกจากภายใน", "การให้อภัยตัวเอง"]
    keywords_reversed: ["การตัดสินตัวเองรุนแรงเกินไป", "เพิกเฉยต่อเสียงเรียกภายใน", "ความลังเลที่จะเปลี่ยนแปลง"]
    meaning_upright: "เสียงเรียกจากภายในกำลังบอกให้คุณตื่นรู้และก้าวสู่เวอร์ชันที่ดีกว่าของตัวเอง"
    meaning_reversed: "คุณอาจกำลังตัดสินตัวเองอย่างรุนแรงเกินไป หรือเพิกเฉยต่อสัญญาณที่เรียกร้องให้เปลี่ยนแปลง"

  - id: major_21
    number: 21
    name_th: "โลก"
    name_en: "The World"
    keywords_upright: ["ความสำเร็จสมบูรณ์", "การบรรลุเป้าหมาย", "ความครบถ้วน"]
    keywords_reversed: ["ความสำเร็จที่ยังไม่สมบูรณ์", "งานค้างคา", "ความล่าช้าใกล้เส้นชัย"]
    meaning_upright: "วงจรหนึ่งกำลังจบลงอย่างสมบูรณ์ คุณได้บรรลุสิ่งที่ตั้งใจไว้ ถึงเวลาฉลองความสำเร็จนี้"
